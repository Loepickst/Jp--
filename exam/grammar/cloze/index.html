<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT 完形填空练习</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;600;700;900&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../grammar/grammar-redesign.css">
    <link rel="stylesheet" href="./shared/cloze-redesign.css">
</head>
<body class="grammar-app cloze-app">
    <header class="sort-page-header">
        <a href="../index.html" id="page-back-btn" class="grammar-back-link" data-kiki-unified-back data-kiki-dynamic-back aria-label="返回语法专项" onclick="event.preventDefault(); app.handleHeaderBack(); return false;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            <span id="page-back-label">返回语法专项</span>
        </a>
        <h1 id="page-header-title" class="sort-page-header-title">JLPT 完形填空</h1>
        <div id="header-right-slot" class="header-right-slot">
            <button id="header-cloze-mistake-btn" type="button" class="header-mistake-center-btn" onclick="app.showMistakeCenter()">
                <span>错题中心</span>
                <strong id="header-cloze-mistake-count">0</strong>
            </button>
        </div>
    </header>

    <main class="page-shell">
        <div class="grammar-app-main">
            <div id="view-level-select" class="view-section active selection-view-shell grammar-directory-view">
                <section class="grammar-character-hero" aria-label="小野的完形填空练习引导">
                    <div class="grammar-character-figure cloze-ono-figure">
                        <img src="../../../assets/grammar/grammar-cloze-mentor-ono-full.webp" alt="完形填空导师小野">
                    </div>
                    <div class="grammar-character-speech">
                        <p class="grammar-character-name">小野 · 篇章理解导师</p>
                        <h2 id="cloze-main-greeting">今天想用什么方式练习“拍照”呢？</h2>
                        <button id="cloze-resume-button" type="button" class="grammar-resume-line" onclick="app.resumeLastPractice()" hidden>
                            <span><strong>继续练习</strong>　<span id="cloze-resume-copy">上次的年度真题</span></span>
                            <span>继续 →</span>
                        </button>
                    </div>
                </section>

                <div class="grammar-section-title">
                    <h2>练习目录</h2>
                    <div class="grammar-level-tabs grammar-main-level-tabs" aria-label="切换练习等级">
                        <button type="button" data-cloze-level="N1" onclick="app.selectLevel('N1')">N1</button>
                        <button type="button" data-cloze-level="N2" onclick="app.selectLevel('N2')">N2</button>
                        <button type="button" data-cloze-level="N3" disabled>N3</button>
                    </div>
                </div>

                <section class="grammar-practice-entry" aria-label="完形填空练习入口">
                    <nav class="grammar-primary-routes grammar-primary-routes--stacked" aria-label="主要练习方式">
                        <button type="button" onclick="app.showYearList()" class="grammar-primary-route is-year">
                            <span class="grammar-primary-route__index">01</span>
                            <span class="grammar-primary-route__copy"><strong>年度练习</strong><small>按考试年份完成整篇真题</small></span>
                            <span class="grammar-primary-route__arrow" aria-hidden="true">›</span>
                        </button>
                        <button type="button" onclick="app.startRandomPractice()" class="grammar-primary-route is-category">
                            <span class="grammar-primary-route__index">02</span>
                            <span class="grammar-primary-route__copy"><strong>随机练习</strong><small>从当前级别随机抽取一篇文章</small></span>
                            <span class="grammar-primary-route__arrow" aria-hidden="true">›</span>
                        </button>
                    </nav>
                </section>
            </div>

            <div id="view-year-select" class="view-section selection-view-shell">
                <section class="grammar-character-hero" aria-label="小野的年度练习引导">
                    <div class="grammar-character-figure cloze-ono-figure">
                        <img src="../../../assets/grammar/grammar-cloze-mentor-ono-full.webp" alt="小野">
                    </div>
                    <div class="grammar-character-speech">
                        <p class="grammar-character-name">小野 · 篇章理解导师</p>
                        <h2 id="cloze-year-greeting">从整体的视角，去抓取“最美”的画面吧。</h2>
                    </div>
                </section>
                <div class="grammar-section-title grammar-year-title">
                    <h2><span id="cloze-year-level">N?</span> 年度完形真题</h2>
                    <button type="button" class="grammar-directory-back" onclick="app.backToDirectory()"><span aria-hidden="true">‹</span> 返回练习目录</button>
                </div>
                <div id="year-list-container" class="exam-year-list"></div>
                <footer class="grammar-level-switcher grammar-year-level-switcher">
                    <span>切换级别</span>
                    <div class="grammar-level-tabs" aria-label="切换年度完形真题级别">
                        <button type="button" data-cloze-year-level="N1" onclick="app.selectYearLevel('N1')">N1</button>
                        <button type="button" data-cloze-year-level="N2" onclick="app.selectYearLevel('N2')">N2</button>
                        <button type="button" data-cloze-year-level="N3" disabled>N3</button>
                    </div>
                </footer>
            </div>

            <div id="view-mistake-center" class="view-section selection-view-shell mistake-center-view">
                <section class="mistake-mentor-strip cloze-ono-strip" aria-label="小野的错题复习建议">
                    <span class="cloze-ono-strip-figure"><img src="../../../assets/grammar/grammar-cloze-mentor-ono-full.webp" alt="小野"></span>
                    <div><span>小野 · 错题复习</span><h2>回到原文里看看，答案往往藏在空格前后的关系中。</h2></div>
                </section>
                <div class="grammar-section-title mistake-center-title">
                    <h2><span id="cloze-mistake-level">N?</span> 完形错题中心</h2>
                    <div class="grammar-level-tabs grammar-main-level-tabs" aria-label="切换错题级别">
                        <button type="button" data-cloze-mistake-level="N1" onclick="app.selectMistakeLevel('N1')">N1</button>
                        <button type="button" data-cloze-mistake-level="N2" onclick="app.selectMistakeLevel('N2')">N2</button>
                        <button type="button" data-cloze-mistake-level="N3" disabled>N3</button>
                    </div>
                </div>
                <section class="mistake-overview-line" aria-label="完形填空错题概览">
                    <div><span>待复习</span><strong><b id="cloze-mistake-total">0</b> 题</strong></div>
                    <div><span>复习方式</span><strong>回到原文</strong></div>
                    <div class="mistake-overview-weak"><span>学习目标</span><strong>辨认篇章关系</strong></div>
                </section>
                <div id="cloze-mistake-list" class="mistake-group-list"></div>
            </div>

            <div id="training-mode-overlay" class="training-mode-overlay" hidden>
                <div class="training-mode-modal" role="dialog" aria-modal="true" aria-labelledby="training-mode-title">
                    <header class="training-mode-header">
                        <span class="cloze-ono-modal-avatar"><img src="../../../assets/grammar/grammar-cloze-mentor-ono-full.webp" alt="小野"></span>
                        <div><span>小野的练习建议</span><div id="training-mode-title" class="training-mode-title">选择练习方式</div><div id="training-mode-subtitle" class="training-mode-subtitle">请选择答题与批改方式。</div></div>
                    </header>
                    <div class="training-mode-grid">
                        <button type="button" class="training-mode-card" data-training-mode="study">
                            <span class="training-mode-number">01</span><span><b class="training-mode-card-title">学习模式</b><small class="training-mode-card-copy">完成全文后立即批改并查看解析</small></span><span class="training-mode-mark" aria-hidden="true"></span>
                        </button>
                        <button type="button" class="training-mode-card" data-training-mode="challenge">
                            <span class="training-mode-number">02</span><span><b class="training-mode-card-title">测试模式</b><small class="training-mode-card-copy">限时完成全文后统一批改</small></span><span class="training-mode-mark" aria-hidden="true"></span>
                        </button>
                    </div>
                    <div id="training-mode-timer" class="training-mode-timer" hidden>
                        <div class="training-setting-title">设置限时</div>
                        <div class="training-chip-row">
                            <button type="button" class="training-mode-chip" data-training-minutes="8">8 分</button>
                            <button type="button" class="training-mode-chip" data-training-minutes="10">10 分</button>
                            <button type="button" class="training-mode-chip" data-training-minutes="15">15 分</button>
                            <label class="training-custom-time">自定义<input id="training-mode-custom-input" type="number" min="1" max="180" step="1" value="10">分</label>
                        </div>
                    </div>
                    <div class="training-mode-actions">
                        <button type="button" id="training-mode-cancel-btn" class="training-mode-action is-cancel">取消</button>
                        <button type="button" id="training-mode-confirm-btn" class="training-mode-action is-primary">开始</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const clozeEntries = [
            { level:'N1', session:'2020年12月', title:'文芸の毒', href:'./n1/2020.12.html' },
            { level:'N1', session:'2019年12月', title:'「好き」という言葉の罠', href:'./n1/2019.12.html' },
            { level:'N1', session:'2019年7月', title:'人間とは月のようなもの', href:'./n1/2019.7.html' },
            { level:'N1', session:'2018年12月', title:'装飾という架け橋', href:'./n1/2018.12.html' },
            { level:'N1', session:'2018年7月', title:'横暴な小説係', href:'./n1/2018.7.html' },
            { level:'N1', session:'2017年12月', title:'小説『望月青果店』の書評', href:'./n1/2017.12.html' },
            { level:'N1', session:'2017年7月', title:'声優と犬', href:'./n1/2017.7.html' },
            { level:'N1', session:'2016年12月', title:'十人十色', href:'./n1/2016.12.html' },
            { level:'N1', session:'2016年7月', title:'若者よ、ありがとう', href:'./n1/2016.7.html' },
            { level:'N1', session:'2015年12月', title:'ずーっと刻まれる「母の愛」', href:'./n1/2015.12.html' },
            { level:'N1', session:'2015年7月', title:'夫婦格差社会の書評', href:'./n1/2015.7.html' },
            { level:'N1', session:'2014年12月', title:'牛の気持ち', href:'./n1/2014.12.html' },
            { level:'N1', session:'2014年7月', title:'これがおもしろいんだ！', href:'./n1/2014.7.html' },
            { level:'N1', session:'2013年12月', title:'人生相談万事OK', href:'./n1/2013.12.html' },
            { level:'N1', session:'2013年7月', title:'銀杏が衣を脱ぐ時', href:'./n1/2013.7.html' },
            { level:'N1', session:'2012年12月', title:'大人時間', href:'./n1/2012.12.html' },
            { level:'N1', session:'2012年7月', title:'なぜ下手か日本人の外国語', href:'./n1/2012.7.html' },
            { level:'N1', session:'2011年12月', title:'友人への手紙', href:'./n1/2011.12.html' },
            { level:'N1', session:'2011年7月', title:'広告主の品位', href:'./n1/2011.7.html' },
            { level:'N1', session:'2010年12月', title:'過剰に求められるコミュニケーション能力', href:'./n1/2010.12.html' },
            { level:'N1', session:'2010年7月', title:'父性の復権', href:'./n1/2010.7.html' },
            { level:'N2', session:'2020年12月', title:'ロボット・セラピー', href:'./n2/2020.12.html' },
            { level:'N2', session:'2019年12月', title:'文章文法真题', href:'./n2/2019.12.html' },
            { level:'N2', session:'2019年7月', title:'伝統から最新技術へ', href:'./n2/2019.7.html' },
            { level:'N2', session:'2018年12月', title:'伝統から最新技術へ', href:'./n2/2018.12.html' },
            { level:'N2', session:'2018年7月', title:'道路のひみつ', href:'./n2/2018.7.html' },
            { level:'N2', session:'2017年12月', title:'鳥はなぜ飛べるのですか', href:'./n2/2017.12.html' },
            { level:'N2', session:'2017年7月', title:'高齢化社会におけるスポーツ', href:'./n2/2017.7.html' },
            { level:'N2', session:'2016年12月', title:'日本発のトイレマーク', href:'./n2/2016.12.html' },
            { level:'N2', session:'2016年7月', title:'25時', href:'./n2/2016.7.html' },
            { level:'N2', session:'2015年12月', title:'回転ずしでたくさん食べてしまうのはなぜか', href:'./n2/2015.12.html' },
            { level:'N2', session:'2015年7月', title:'「のぼり」', href:'./n2/2015.7.html' },
            { level:'N2', session:'2014年12月', title:'日本の「大人」', href:'./n2/2014.12.html' },
            { level:'N2', session:'2014年7月', title:'光害', href:'./n2/2014.7.html' },
            { level:'N2', session:'2013年12月', title:'ポケットティッシュ', href:'./n2/2013.12.html' },
            { level:'N2', session:'2013年7月', title:'サクラが春に咲く不思議', href:'./n2/2013.7.html' },
            { level:'N2', session:'2012年12月', title:'ランチメニューはなぜ安い？', href:'./n2/2012.12.html' },
            { level:'N2', session:'2012年7月', title:'ランチメニューはなぜ安い？', href:'./n2/2012.7.html' },
            { level:'N2', session:'2011年12月', title:'日本の家の寿命', href:'./n2/2011.12.html' },
            { level:'N2', session:'2011年7月', title:'日本の鉄道ファン', href:'./n2/2011.7.html' },
            { level:'N2', session:'2010年12月', title:'花粉症とうまく付き合う', href:'./n2/2010.12.html' },
            { level:'N2', session:'2010年7月', title:'血液型と性格', href:'./n2/2010.7.html' }
        ];

        const qs = new URLSearchParams(location.search);
        const app = {
            currentLevel: ['N1','N2'].includes(qs.get('level')) ? qs.get('level') : 'N1',
            activeView: 'view-level-select',
            picker: { entry:null, review:false, mode:'study', minutes:10 },

            init() {
                updateCharacterCopy();
                this.updateDirectoryUI();
                const browse = qs.get('browse');
                if (browse === 'years') this.showYearList({ updateUrl:false });
                else if (browse === 'mistakes') this.showMistakeCenter({ updateUrl:false });
                else this.switchView('view-level-select');
            },

            entries(level=this.currentLevel) { return clozeEntries.filter(item => item.level === level); },
            entryId(entry) { return String(entry.href).split('/').pop().replace(/\.html$/, ''); },
            mistakeIds(entry) {
                try { const value = JSON.parse(localStorage.getItem(`grammar_cloze_mistakes::${entry.level}::${this.entryId(entry)}`) || '[]'); return Array.isArray(value) ? value.filter(Boolean) : []; }
                catch (_) { return []; }
            },
            mistakeTotal(level=this.currentLevel) { return this.entries(level).reduce((sum, entry) => sum + this.mistakeIds(entry).length, 0); },
            lastKey(level=this.currentLevel) { return `grammar_cloze_last_practice::${level}`; },

            replaceUrl(params={}) {
                const next = new URLSearchParams();
                Object.entries(params).forEach(([key,value]) => { if (value) next.set(key,value); });
                history.replaceState({},'',`${location.pathname}${next.toString() ? `?${next}` : ''}`);
            },
            switchView(id, options={}) {
                document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
                document.getElementById(id)?.classList.add('active');
                this.activeView = id;
                if (!options.preserveScroll) scrollTo({top:0,behavior:'instant'});
                this.updateHeader();
            },
            updateHeader() {
                const title = `${this.currentLevel} 完形填空`;
                const pageHeaderTitle = document.getElementById('page-header-title');
                if (pageHeaderTitle) pageHeaderTitle.textContent = title;
                document.querySelectorAll('.kiki-unified-header-title').forEach(node => node.textContent = title);
                const label = this.activeView === 'view-level-select' ? '返回语法专项' : '返回练习目录';
                const pageBackLabel = document.getElementById('page-back-label');
                if (pageBackLabel) pageBackLabel.textContent = label;
                document.querySelectorAll('.kiki-unified-back-label').forEach(node => node.textContent = label);
                document.querySelectorAll('.kiki-unified-back-label-mobile').forEach(node => node.textContent = '返回');
                const unifiedBack = document.querySelector('.kiki-unified-back');
                if (unifiedBack) {
                    unifiedBack.href = this.activeView === 'view-level-select'
                        ? new URL('../index.html', location.href).href
                        : new URL(`index.html?level=${this.currentLevel}`, location.href).href;
                }
            },
            handleHeaderBack() {
                if (this.activeView === 'view-level-select') { location.href = '../index.html'; return; }
                this.backToDirectory();
            },
            backToDirectory() { this.replaceUrl({level:this.currentLevel}); this.switchView('view-level-select'); },

            updateDirectoryUI() {
                document.querySelectorAll('[data-cloze-level]').forEach(button => button.classList.toggle('is-active', button.dataset.clozeLevel === this.currentLevel));
                document.querySelectorAll('[data-cloze-year-level]').forEach(button => button.classList.toggle('is-active', button.dataset.clozeYearLevel === this.currentLevel));
                document.querySelectorAll('[data-cloze-mistake-level]').forEach(button => button.classList.toggle('is-active', button.dataset.clozeMistakeLevel === this.currentLevel));
                document.getElementById('cloze-year-level').textContent = this.currentLevel;
                document.getElementById('cloze-mistake-level').textContent = this.currentLevel;
                const total = this.mistakeTotal();
                document.getElementById('header-cloze-mistake-count').textContent = total;
                const lastId = localStorage.getItem(this.lastKey()) || '';
                const last = this.entries().find(entry => this.entryId(entry) === lastId);
                document.getElementById('cloze-resume-button').hidden = !last;
                if (last) document.getElementById('cloze-resume-copy').textContent = `${last.level} · ${last.session}`;
                this.updateHeader();
            },
            selectLevel(level) { if (!['N1','N2'].includes(level)) return; this.currentLevel=level; this.replaceUrl({level}); this.updateDirectoryUI(); },
            selectYearLevel(level) { const top=scrollY; this.currentLevel=level; this.updateDirectoryUI(); this.showYearList({preserveScroll:true,scrollTop:top}); },
            selectMistakeLevel(level) { this.currentLevel=level; this.updateDirectoryUI(); this.showMistakeCenter(); },

            showYearList(options={}) {
                if (options.updateUrl !== false) this.replaceUrl({level:this.currentLevel,browse:'years'});
                const lastId = localStorage.getItem(this.lastKey()) || '';
                const groups = this.entries().reduce((map,entry) => {
                    const match = entry.session.match(/^(\d{4})年(\d{1,2})月$/); const year = match ? match[1] : entry.session; const month = match ? Number(match[2]) : 0;
                    if (!map.has(year)) map.set(year,[]); map.get(year).push({...entry,month}); return map;
                },new Map());
                document.getElementById('year-list-container').innerHTML = [...groups.entries()].map(([year,entries]) => `
                    <section class="grammar-year-stage" aria-label="${year} 年完形填空真题">
                        <header class="grammar-year-stage-header"><span class="grammar-year-stage-title"><strong>${year} 年</strong></span></header>
                        <div class="grammar-year-sessions">${entries.sort((a,b)=>a.month-b.month).map(entry => `
                            <button type="button" onclick="app.openPickerById('${this.entryId(entry)}')" class="exam-year-item grammar-year-session ${this.entryId(entry)===lastId?'is-current':''}">
                                <span class="grammar-year-session-copy"><strong>${entry.month} 月</strong><small>${escapeHtml(entry.title)}</small></span>
                                <span class="grammar-year-session-state">${this.entryId(entry)===lastId?'继续 ›':'进入 ›'}</span>
                            </button>`).join('')}</div>
                    </section>`).join('');
                this.updateDirectoryUI();
                this.switchView('view-year-select',{preserveScroll:options.preserveScroll});
                if (options.preserveScroll) scrollTo({top:options.scrollTop||0,behavior:'instant'});
            },
            showMistakeCenter(options={}) {
                if (options.updateUrl !== false) this.replaceUrl({level:this.currentLevel,browse:'mistakes'});
                const items = this.entries().map(entry => ({entry,count:this.mistakeIds(entry).length})).filter(item=>item.count);
                document.getElementById('cloze-mistake-total').textContent = items.reduce((sum,item)=>sum+item.count,0);
                document.getElementById('cloze-mistake-list').innerHTML = items.length ? items.map((item,index)=>`
                    <button type="button" onclick="app.openPickerById('${this.entryId(item.entry)}',true)" class="mistake-group-row">
                        <span class="mistake-group-index">${String(index+1).padStart(2,'0')}</span>
                        <span class="mistake-group-copy"><strong>${item.entry.session}</strong><small>${escapeHtml(item.entry.title)}</small></span>
                        <span class="mistake-weakness-meter"><span><b>待复习空位</b><em>${item.count} 题</em></span><i><u></u></i></span>
                        <span class="mistake-group-metrics"><span><b>${item.count}</b> 待复习</span></span><span class="mistake-group-enter">进入 ›</span>
                    </button>`).join('') : '<div class="mistake-empty-state"><strong>目前没有待复习的完形填空</strong><span>新的错题会自动出现在这里。</span></div>';
                this.updateDirectoryUI(); this.switchView('view-mistake-center');
            },

            startRandomPractice() { const pool=this.entries(); if(!pool.length)return; const entry=pool[Math.floor(Math.random()*pool.length)]; this.openPicker(entry,false); },
            resumeLastPractice() { const id=localStorage.getItem(this.lastKey())||''; this.openPickerById(id); },
            openPickerById(id,review=false) { const entry=this.entries().find(item=>this.entryId(item)===id); if(entry)this.openPicker(entry,review); },
            openPicker(entry,review=false) { this.picker={entry,review,mode:'study',minutes:10}; this.syncPicker(); },
            closePicker() { this.picker.entry=null; this.syncPicker(); },
            setPickerMode(mode) { this.picker.mode=mode==='challenge'?'challenge':'study'; this.syncPicker(); },
            setPickerMinutes(value) { const num=Number(value); this.picker.minutes=Number.isFinite(num)?Math.min(180,Math.max(1,Math.round(num))):10; this.syncPicker(); },
            syncPicker() {
                const open=Boolean(this.picker.entry); document.getElementById('training-mode-overlay').hidden=!open;
                document.getElementById('training-mode-timer').hidden=this.picker.mode!=='challenge';
                document.getElementById('training-mode-custom-input').value=this.picker.minutes;
                document.querySelectorAll('[data-training-mode]').forEach(button=>button.classList.toggle('is-selected',button.dataset.trainingMode===this.picker.mode));
                document.querySelectorAll('[data-training-minutes]').forEach(button=>button.classList.toggle('is-selected',Number(button.dataset.trainingMinutes)===this.picker.minutes));
            },
            confirmPicker() {
                const entry=this.picker.entry; if(!entry)return;
                localStorage.setItem(this.lastKey(),this.entryId(entry));
                const url=new URL(entry.href,location.href);
                url.searchParams.set('readingMode',this.picker.mode==='challenge'?'test':'study');
                if(this.picker.mode==='challenge') url.searchParams.set('timer',this.picker.minutes);
                if(this.picker.review) url.searchParams.set('mode','review');
                url.searchParams.set('from', this.picker.review ? 'mistakes' : (this.activeView==='view-year-select' ? 'years' : 'directory'));
                location.href=url.href;
            }
        };

        function escapeHtml(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
        function getUserName(){
            if(window.HomePetSystem&&typeof HomePetSystem.getUserName==='function'){const value=String(HomePetSystem.getUserName()||'').trim();if(value)return Array.from(value).slice(0,16).join('');}
            try{return Array.from(String(JSON.parse(localStorage.getItem('study_quest_test_v1_kiki_pet_settings_v1')||'{}')?.userName||'').trim()).slice(0,16).join('');}catch(_){return '';}
        }
        function updateCharacterCopy(){const name=getUserName();document.getElementById('cloze-main-greeting').textContent=name?`今天想用什么方式练习“拍照”呢，${name}。`:'今天想用什么方式练习“拍照”呢？';document.getElementById('cloze-year-greeting').textContent=name?`从整体的视角，去抓取“最美”的画面吧，${name}。`:'从整体的视角，去抓取“最美”的画面吧。';}

        document.querySelectorAll('[data-training-mode]').forEach(button=>button.addEventListener('click',()=>app.setPickerMode(button.dataset.trainingMode)));
        document.querySelectorAll('[data-training-minutes]').forEach(button=>button.addEventListener('click',()=>app.setPickerMinutes(button.dataset.trainingMinutes)));
        document.getElementById('training-mode-custom-input').addEventListener('input',event=>app.setPickerMinutes(event.target.value));
        document.getElementById('training-mode-cancel-btn').addEventListener('click',()=>app.closePicker());
        document.getElementById('training-mode-confirm-btn').addEventListener('click',()=>app.confirmPicker());
        document.getElementById('training-mode-overlay').addEventListener('click',event=>{if(event.target.id==='training-mode-overlay')app.closePicker();});
        addEventListener('keydown',event=>{if(event.key==='Escape')app.closePicker();});
        addEventListener('kiki-user-profile:changed',updateCharacterCopy);
        addEventListener('kiki-unified-header:ready',()=>{app.updateHeader();app.updateDirectoryUI();});
        app.init();
    </script>
    <script src="../../../shared/word-bank.js"></script>
    <script src="../../../shared/unified-header.js" data-kiki-unified-header-loader></script>
</body>
</html>

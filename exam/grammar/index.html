<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文法演習ノート</title>
    <link rel="stylesheet" href="../../shared/site-fonts.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;600;700;900&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="../../shared/legacy-directory-redirect.js"></script>
    <style>
        :root {
            /* 纸张与铅笔色盘 - 明亮白底版 */
            --paper: #ffffff;          
            --paper-light: #ffffff;    
            
            --graphite: #333333;       /* 深石墨灰 */
            --graphite-sub: #666666;   
            --graphite-faint: #cccccc; 
            
            --red-pencil: #e64a4a;     /* 批改用红铅笔 */
            
            /* 水彩记号笔色系 (各模块区分) */
            --marker-blue: rgba(129, 212, 250, 0.35);    
            --marker-peach: rgba(253, 186, 116, 0.35);   
            --marker-mint: rgba(134, 239, 172, 0.35);    
            --marker-pink: rgba(244, 143, 177, 0.35);    
            --marker-lavender: rgba(196, 181, 253, 0.35);
            
            --marker-yellow: rgba(255, 213, 79, 0.35);   /* 通用高亮 */
            --marker-gray: rgba(200, 200, 200, 0.25);    /* 锁定状态 */

            /* 铅笔排线背景 */
            --hatching-graphite: repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(51, 51, 51, 0.04) 3px, rgba(51, 51, 51, 0.04) 4px);

            --transition: all 0.2s ease-out;
            
            --font-sans: 'Noto Sans SC', 'Noto Sans JP', sans-serif;
            --font-serif: 'Noto Serif SC', 'Noto Serif JP', 'Songti SC', 'SimSun', serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--paper);
            color: var(--graphite);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* 极弱的纸张噪点纹理 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
            z-index: -1;
            pointer-events: none;
        }

        /* 工具类：手绘感不规则边框 */
        .sketch-box {
            border: 1.5px solid var(--graphite);
            border-radius: 2px 255px 3px 25px / 255px 5px 225px 3px;
            background: transparent;
        }
        
        .sketch-circle {
            border: 1.5px solid var(--graphite);
            border-radius: 50% 45% 55% 40% / 45% 55% 40% 50%;
        }

        /* ================= Header ================= */
        header {
            width: 100%;
            padding: 16px 20px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            border-bottom: 1.5px solid var(--graphite);
            border-bottom-left-radius: 50% 2px;
            border-bottom-right-radius: 50% 3px;
        }

        .back-btn, .home-btn {
            text-decoration: none;
            color: var(--graphite);
            font-size: 14px;
            font-weight: 700;
            padding: 4px 12px;
            background: transparent;
            border: 1.5px solid var(--graphite);
            border-radius: 2px 8px 3px 6px / 6px 3px 8px 2px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            letter-spacing: 0.05em;
        }
        
        .back-btn:hover, .home-btn:hover { 
            background: var(--marker-yellow);
        }

        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--graphite);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
        }
        
        h1 span {
            color: var(--graphite);
            background: transparent;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: 8px;
            border: 1.5px solid var(--graphite);
            border-radius: 2px 8px 2px 6px / 6px 2px 8px 2px;
            font-family: 'Noto Sans JP', sans-serif;
        }

        /* ================= Main Container ================= */
        .page-shell {
            width: min(92%, 880px);
            margin: 0 auto;
            padding: 40px 0 60px;
            display: flex;
            flex-direction: column;
            flex: 1;
            box-sizing: border-box;
            max-width: 100%;
            min-width: 0;
        }

        /* 提示说明块 - 水彩荧光笔风格 */
        .intro-box {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.4s ease-out;
        }
        
        .intro-box p {
            color: var(--graphite);
            font-size: 15px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(transparent 50%, rgba(255, 213, 79, 0.4) 50%);
            border-bottom: 1.5px dashed var(--graphite-faint);
            display: inline-block;
            padding: 4px 16px;
            letter-spacing: 0.1em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 模块卡片（笔记本的一个章节） */
        .group-card {
            background: var(--bg-card);
            border: 1.5px solid var(--graphite);
            border-radius: 2px 255px 3px 25px / 255px 5px 225px 3px;
            padding: 32px 36px;
            margin-bottom: 40px;
            position: relative;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.02);
            animation: fadeIn 0.5s ease-out;
            box-sizing: border-box;
            max-width: 100%;
            min-width: 0;
        }

        .group-head {
            margin-bottom: 24px;
            border-bottom: 1.5px dashed var(--graphite-faint);
            padding-bottom: 16px;
        }

        .group-title {
            margin: 0 0 8px;
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        /* 水彩标记线代替原来的红色粗线 */
        .group-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 24px;
            border-radius: 2px 4px 3px 4px / 4px 3px 4px 2px;
        }

        .group-card--exam .group-title::before { background-color: rgba(134, 239, 172, 0.6); }
        .group-card--topic .group-title::before { background-color: rgba(129, 212, 250, 0.6); }

        .group-note {
            margin: 0;
            color: var(--graphite-sub);
            font-size: 14px;
            font-weight: 700;
            line-height: 1.7;
            letter-spacing: 0.05em;
        }

        .lesson-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 具体修习项目（小卡片） */
        .lesson-item {
            background: var(--bg-card);
            padding: 20px 108px 20px 24px;
            border: 1.5px solid var(--graphite-faint);
            border-radius: 3px 255px 4px 25px / 255px 5px 225px 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            transition: all 0.2s ease-out;
            text-decoration: none;
            color: var(--graphite);
            position: relative;
            box-sizing: border-box;
            max-width: 100%;
            min-width: 0;
        }

        .lesson-item:hover:not(.disabled) {
            border-color: var(--graphite);
            background: var(--hatching-graphite);
            transform: translateY(-2px);
            box-shadow: 2px 4px 12px rgba(0,0,0,0.03);
        }

        /* 未解锁状态 */
        .lesson-item.disabled {
            border-style: dashed;
            opacity: 0.7;
            cursor: not-allowed;
            pointer-events: none;
            background-color: transparent;
        }

        .lesson-content {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1 1 auto;
            width: 100%;
            min-width: 0;
            max-width: 100%;
        }

        /* 题型图标（手绘圆圈） */
        .lesson-icon {
            font-size: 24px;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1.5px solid var(--graphite);
            border-radius: 50% 45% 55% 40% / 45% 55% 40% 50%;
            background: #FFF;
        }

        /* 分配水彩颜色 */
        .lesson-item.t-pink:not(.disabled) .lesson-icon { background: var(--marker-pink); }
        .lesson-item.t-blue:not(.disabled) .lesson-icon { background: var(--marker-blue); }
        .lesson-item.t-mint:not(.disabled) .lesson-icon { background: var(--marker-mint); }
        .lesson-item.t-peach:not(.disabled) .lesson-icon { background: var(--marker-peach); }
        .lesson-item.t-lavender:not(.disabled) .lesson-icon { background: var(--marker-lavender); }
        
        .lesson-item.disabled .lesson-icon {
            background: var(--marker-gray);
            border-color: var(--graphite-faint);
            filter: grayscale(100%);
            opacity: 0.6;
        }

        .lesson-text {
            min-width: 0;
            max-width: 100%;
        }

        .lesson-text h3 {
            margin: 0 0 6px;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.05em;
        }

        .lesson-text p {
            margin: 0;
            font-size: 13px;
            color: var(--graphite-sub);
            line-height: 1.6;
            font-weight: 500;
        }

        /* 状态印鉴 */
        .lesson-tag {
            background: #FFF;
            color: var(--graphite);
            border: 1.5px solid var(--graphite);
            border-radius: 2px 8px 2px 6px / 6px 2px 8px 2px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 900;
            flex-shrink: 0;
            letter-spacing: 0.1em;
            box-sizing: border-box;
            max-width: 100%;
            position: absolute;
            top: 50%;
            right: 18px;
            transform: translateY(-50%);
            margin: 0;
            align-self: auto;
        }

        .lesson-item.t-pink:not(.disabled) .lesson-tag { background: var(--marker-pink); }
        .lesson-item.t-blue:not(.disabled) .lesson-tag { background: var(--marker-blue); }
        .lesson-item.t-mint:not(.disabled) .lesson-tag { background: var(--marker-mint); }
        .lesson-item.t-peach:not(.disabled) .lesson-tag { background: var(--marker-peach); }
        .lesson-item.t-lavender:not(.disabled) .lesson-tag { background: var(--marker-lavender); }

        .lesson-item.disabled .lesson-tag {
            background: var(--marker-gray);
            border-color: var(--graphite-faint);
            color: var(--graphite-sub);
        }

        footer {
            margin-top: auto;
            padding: 28px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--graphite-faint);
        }

        @media (max-width: 680px) {
            .page-shell {
                width: 100%;
                padding: 24px 16px 48px;
                box-sizing: border-box;
            }

            .group-card {
                padding: 24px 20px;
                margin-bottom: 24px;
            }

            .group-title {
                font-size: 20px;
            }

            .lesson-item {
                padding: 16px 94px 16px 16px;
                width: 100%;
            }

            .lesson-content {
                gap: 14px;
            }

            .lesson-icon {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }

            .lesson-text h3 {
                font-size: 16px;
            }
            .lesson-text p {
                font-size: 12px;
            }

            .lesson-tag {
                padding: 4px 8px;
                font-size: 11px;
                right: 16px;
            }
            
            header { padding: 12px 16px; }
            header h1 { font-size: 16px; }
            .back-btn, .home-btn { font-size: 12px; padding: 4px 10px; }
        }
        
        @media (max-width: 520px) {
            header { padding: 10px 12px; }
            .back-btn, .home-btn { font-size: 11px; padding: 4px 8px; }
            header h1 { font-size: 15px; }
            header h1 span { font-size: 10px; padding: 2px 6px; }
            
            .group-title { font-size: 18px; }
            .group-note { font-size: 12px; }
            .group-card { padding: 20px 16px; }
            .lesson-item {
                padding: 14px 92px 14px 14px;
                flex-direction: column;
                align-items: flex-start;
                width: 100%;
            }
            .lesson-content { width: 100%; gap: 12px; }
            .lesson-text h3,
            .lesson-text p { overflow-wrap: anywhere; }
            .lesson-tag {
                position: absolute;
                top: 50%;
                right: 12px;
                transform: translateY(-50%);
                margin: 0;
                align-self: auto;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="../../index.html#exam" class="back-btn" data-back-nav>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            戻る
        </a>
        <h1>文法 <span>GRAMMAR</span></h1>
        <div style="width: 70px;"></div>
    </header>

    <main class="page-shell">
        <div class="intro-box">
            <p>✎ 请选择要练习的项目</p>
        </div>

        <section class="group-card group-card--exam sketch-box">
            <div class="group-head">
                <div>
                    <h3 class="group-title">真题演习</h3>
                    <p class="group-note">按照真题题型练习文法选择、句子重组和文章文法，适合按考试形式集中训练。</p>
                </div>
            </div>

            <div class="lesson-list">
                <a href="grammar/index.html" class="lesson-item t-peach">
                    <div class="lesson-content">
                        <div class="lesson-icon">📝</div>
                        <div class="lesson-text">
                            <h3>文法练习</h3>
                            <p>熟练各类语法在真题里的使用。</p>
                        </div>
                    </div>
                    <span class="lesson-tag">进入练习</span>
                </a>

                <a href="sort/index.html" class="lesson-item t-mint">
                    <div class="lesson-content">
                        <div class="lesson-icon">🎯</div>
                        <div class="lesson-text">
                            <h3>排序题</h3>
                            <p>理解句子结构、语序和连接关系。</p>
                        </div>
                    </div>
                    <span class="lesson-tag">进入练习</span>
                </a>

                <a href="cloze/index.html" class="lesson-item t-lavender">
                    <div class="lesson-content">
                        <div class="lesson-icon">📖</div>
                        <div class="lesson-text">
                            <h3>完形填空</h3>
                            <p>熟练语句的连接关系。</p>
                        </div>
                    </div>
                    <span class="lesson-tag">进入练习</span>
                </a>
            </div>
        </section>

        <section class="group-card group-card--topic sketch-box">
            <div class="group-head">
                <div>
                    <h3 class="group-title">专题练习</h3>
                    <p class="group-note">按照具体文法专题整理知识点，用来补强单项弱点。</p>
                </div>
            </div>

            <div class="lesson-list">
                <a href="../../daily/grammar/expressions/复合格助词.html" class="lesson-item t-pink">
                    <div class="lesson-content">
                        <div class="lesson-icon">🧩</div>
                        <div class="lesson-text">
                            <h3>复合格助词</h3>
                            <p>整理多个助词组合而成的表达与用法。</p>
                        </div>
                    </div>
                    <span class="lesson-tag">进入练习</span>
                </a></div>
        </section>
    </main>

    <footer>
        © キキの日本語コーナー
    </footer>

    <script src="../../shared/back-navigation.js"></script>
    <script>
        if (typeof window.bindHierarchicalBack === 'function') {
            window.bindHierarchicalBack({
                selector: "[data-back-nav]",
                fallback: "../../index.html#exam"
            });
        } else if (typeof window.bindStatefulBack === 'function') {
            window.bindStatefulBack({
                selector: "[data-back-nav]",
                fallback: "../../index.html#exam"
            });
        } else {
            document.querySelectorAll('[data-back-nav]').forEach(function(el) {
                el.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.href = "../../index.html#exam";
                });
            });
        }
    </script>
    <script src="../../shared/word-bank.js"></script>
    <script src="../../shared/unified-header.js" data-kiki-unified-header-loader></script>
</body>
</html>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;600;700;900&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">

<body class="reading-app">

    <header class="reading-page-header">
        <a href="../../index.html#exam/exam-reading" class="reading-back-link" id="backButton" data-back-nav data-kiki-unified-back data-kiki-dynamic-back>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

        </a>
        <h1 id="pageTitle" class="reading-page-title">N1 読解特訓</h1>
        <div class="reading-header-actions header-right-slot">
            <button id="readingMistakeCenterBtn" type="button" class="reading-mistake-button" onclick="showMistakeCenter()">
                <span>错题中心</span>
                <strong id="readingMistakeCount">0</strong>
            </button>
        </div>
    </header>

    <main class="reading-page-shell">
        <div class="reading-app-main">
            <section id="typeSelectView" class="reading-view reading-directory-view">
                <section class="reading-character-hero" aria-label="当前阅读练习目录">
                    <div class="reading-character-figure">
                        <img src="../../assets/reading/reading-master-apprentice-hero-v1.webp" alt="阅读导师仁与薰">
                    </div>
                    <div class="reading-character-speech">
                        <p class="reading-character-name">仁 · 読解指南</p>
                        <h2 id="typeSectionTitle">选择今天想要进行的阅读练习吧，kiki。</h2>
                        <button type="button" class="reading-resume-line" data-reading-resume onclick="resumeLastReading()" hidden>
                            <span><strong>继续练习</strong>　<span data-reading-resume-copy>上次的阅读真题</span></span>
                            <span>继续 →</span>
                        </button>
                    </div>
                </section>

                <div class="reading-section-title">
                    <h2 id="typePracticeMenuTitle">短文理解 · 练习目录</h2>
                    <div class="reading-section-tools">
                        <div class="reading-level-tabs" aria-label="切换阅读等级">
                            <button type="button" data-reading-level="N1" onclick="switchReadingLevel('N1')">N1</button>
                            <button type="button" data-reading-level="N2" onclick="switchReadingLevel('N2')">N2</button>
                            <button type="button" data-reading-level="N3" disabled title="内容准备中">N3</button>
                        </div>
                    </div>
                </div>

                <section class="reading-practice-entry" aria-label="阅读练习方式">
                    <nav class="reading-primary-routes" aria-label="主要练习入口">
                        <button type="button" class="reading-primary-route is-year" onclick="openRoute('year')">
                            <span class="reading-primary-route__index">01</span>
                            <span class="reading-primary-route__copy"><strong>年度练习</strong><small>按考试年份完成真题阅读</small></span>
                            <span class="reading-primary-route__arrow" aria-hidden="true">›</span>
                        </button>
                        <button id="readingCategoryRoute" type="button" class="reading-primary-route is-category" onclick="openRoute('category')">
                            <span class="reading-primary-route__index">02</span>
                            <span class="reading-primary-route__copy"><strong>分类练习</strong><small>按同类题目集中练习</small></span>
                            <span class="reading-primary-route__arrow" aria-hidden="true">›</span>
                        </button>
                    </nav>
                    <button type="button" class="reading-random-entry" onclick="startRandomPractice()">
                        <span><strong>随机练习</strong><small>从当前题型随机抽取一篇文章</small></span>
                        <span>开始随机小测　›</span>
                    </button>
                </section>
            </section>

            <section id="yearListView" class="reading-view hidden">
                <section class="reading-character-hero reading-character-hero--compact" aria-label="阅读练习引导">
                    <div class="reading-character-figure">
                        <img src="../../assets/reading/reading-master-apprentice-hero-v1.webp" alt="阅读导师仁与薰">
                    </div>
                    <div class="reading-character-speech">
                        <p class="reading-character-name">仁 · 読解指南</p>
                        <h2 id="practiceGuideCopy">择一卷真题，静心读罢；莫急，文意自会显现，kiki。</h2>
                    </div>
                </section>

                <div class="reading-section-title">
                    <h2 id="practiceDirectoryTitle">短文理解</h2>
                    <div class="reading-section-tools">
                        <div class="reading-level-tabs" aria-label="切换阅读等级">
                            <button type="button" data-reading-level="N1" onclick="switchReadingLevel('N1')">N1</button>
                            <button type="button" data-reading-level="N2" onclick="switchReadingLevel('N2')">N2</button>
                            <button type="button" data-reading-level="N3" disabled title="内容准备中">N3</button>
                        </div>
                    </div>
                </div>

                <div id="readingReviewSection" class="hidden"><div id="readingReviewGrid"></div></div>
                <div id="yearContainer" class="year-grid reading-year-grid"></div>
                <div id="categoryContainer" class="year-grid reading-category-grid hidden"></div>
                <div id="categoryArticleShell" class="category-article-shell hidden">
                    <div class="category-article-toolbar">
                        <button id="backToCategoryListBtn" type="button" class="reading-directory-back"><span>‹</span> 返回分类目录</button>
                    </div>
                    <div id="categoryArticleGrid" class="year-grid reading-category-article-grid"></div>
                </div>
            </section>

            <section id="mistakeCenterView" class="reading-view hidden">
                <section class="reading-character-hero reading-character-hero--compact" aria-label="错题复习引导">
                    <div class="reading-character-figure">
                        <img src="../../assets/reading/reading-master-apprentice-hero-v1.webp" alt="阅读导师仁与薰">
                    </div>
                    <div class="reading-character-speech">
                        <p class="reading-character-name">薰 · 復習中</p>
                        <h2>咦，这几招刚才没看清……没关系，再陪我走一遍吧，这次一定能抓住它！</h2>
                    </div>
                </section>
                <div class="reading-section-title">
                    <h2 id="mistakeDirectoryTitle">阅读错题分类</h2>
                    <div class="reading-section-tools">
                        <div class="reading-level-tabs" aria-label="切换阅读等级">
                            <button type="button" data-reading-level="N1" onclick="switchReadingLevel('N1')">N1</button>
                            <button type="button" data-reading-level="N2" onclick="switchReadingLevel('N2')">N2</button>
                            <button type="button" data-reading-level="N3" disabled title="内容准备中">N3</button>
                        </div>
                        <button id="mistakeCategoryBack" type="button" class="reading-directory-back hidden" onclick="returnToMistakeCategories()"><span>‹</span> 返回错题分类</button>
                    </div>
                </div>
                <div id="mistakeCenterList" class="reading-mistake-list"></div>
            </section>
        </div>
    </main>

    );

    const yearView = document.getElementById('yearListView');
    const mistakeView = document.getElementById('mistakeCenterView');

    const pageTitle = document.getElementById('pageTitle');
    const backButton = document.getElementById('backButton');
    const typeSectionTitle = document.getElementById('typeSectionTitle');
    const typePracticeMenuTitle = document.getElementById('typePracticeMenuTitle');
    const readingCategoryRoute = document.getElementById('readingCategoryRoute');
    const practiceGuideCopy = document.getElementById('practiceGuideCopy');
    const practiceDirectoryTitle = document.getElementById('practiceDirectoryTitle');
    const mistakeDirectoryTitle = document.getElementById('mistakeDirectoryTitle');
    const mistakeCategoryBack = document.getElementById('mistakeCategoryBack');
    const mistakeCenterList = document.getElementById('mistakeCenterList');
    const readingMistakeCenterBtn = document.getElementById('readingMistakeCenterBtn');
    const readingMistakeCount = document.getElementById('readingMistakeCount');
    const readingResumeButtons = Array.from(document.querySelectorAll('[data-reading-resume]'));
    const readingResumeCopies = Array.from(document.querySelectorAll('[data-reading-resume-copy]'));
    const readingReviewSection = document.getElementById('readingReviewSection');
    const readingReviewGrid = document.getElementById('readingReviewGrid');
    const yearContainer = document.getElementById('yearContainer');
    const categoryContainer = document.getElementById('categoryContainer');
    const categoryArticleShell = document.getElementById('categoryArticleShell');
    const categoryArticleGrid = document.getElementById('categoryArticleGrid');
    const backToCategoryListBtn = document.getElementById('backToCategoryListBtn');
    const browseModeToggle = document.querySelector('.browse-mode-toggle');
    const browseModeButtons = Array.from(document.querySelectorAll('[data-browse-mode]'));

    let currentLevel = null;
    let currentType = null;
    let currentTypeName = '';
    let currentYear = null;
    let activeDatabase = [];
    let currentArticles = [];
    let currentBrowseMode = 'year';
    let selectedCategoryId = null;
    let currentRouteMode = 'year';
    let resumeTarget = null;
    let selectedMistakeType = null;

    function getAllArticles() {
        return [...databaseN1, ...databaseN2];
    }

    const typeNameMap = {
        short: '短文理解',
        middle: '中篇阅读',
        long: '長文阅读',
        integrated: '統合理解',
        search: '情報検索'
    };

    const mistakeTypeNameMap = {
        short: '短篇阅读',
        middle: '中篇阅读',
        long: '长篇阅读',
        integrated: '综合理解',
        search: '信息检索'
    };

    function normalizeExamKey(value) {
        return ReadingYearSystem.normalizeExamKey(value);
    }

    function normalizeReadingType(value) {
        if (window.ReadingYearSystem && typeof ReadingYearSystem.normalizeReadingType === 'function') {
            return ReadingYearSystem.normalizeReadingType(value);
        }
        const type = String(value || '').trim();
        if (type === 'mid' || type === 'medium') {
            return 'middle';
        }
        if (type === 'd') {
            return 'integrated';
        }
        if (type === 't') {
            return 'search';
        }
        if (type === 'l') {
            return 'long';
        }
        return type;
    }

    function getDisplayYear(examKey) {
        return ReadingCategorySystem.formatDisplayYear(examKey);
    }

    function typeSupportsCategory(type) {
        const normalizedType = normalizeReadingType(type);
        if (['integrated', 'search'].includes(normalizedType) || !currentLevel) {
            return false;
        }
        return ReadingCategorySystem.getCategories(currentLevel, normalizedType).length > 0;
    }

    function getDefaultReadingType(preferredType = 'short') {
        const normalizedPreferredType = normalizeReadingType(preferredType);
        const availableTypes = ['short', 'middle', 'long', 'integrated', 'search']
            .filter((type) => activeDatabase.some((article) => article.type === type));
        return availableTypes.includes(normalizedPreferredType)
            ? normalizedPreferredType
            : (availableTypes[0] || null);
    }

    function buildArticleUrl(article, examKey, reviewMode, readingMode, page = 1) {
        if (!article || !article.link) {
            return null;
        }

        const basePath = String(article.link).split('?')[0];
        const params = new URLSearchParams();
        params.set('page', String(Math.max(1, Number.parseInt(page, 10) || 1)));
        params.set('examKey', examKey);
        if (reviewMode) {
            params.set('mode', 'review');
        } else if (readingMode) {
            params.set('readingMode', readingMode);
        }
        params.set('return', buildIndexStateUrl());
        return `${basePath}?${params.toString()}`;
    }

    function escapeHtml(value) {
        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function buildIndexStateUrl() {
        const params = new URLSearchParams();
        const outerReturn = new URLSearchParams(window.location.search).get('return');
        if (currentLevel) {
            params.set('level', currentLevel);
        }
        if (outerReturn) {
            params.set('return', outerReturn);
        }
        if (!mistakeView.classList.contains('hidden')) {
            params.set('browse', 'mistakes');
            if (selectedMistakeType) {
                params.set('mistakeType', selectedMistakeType);
            }
            return `${window.location.pathname}?${params.toString()}`;
        }
        if (currentType) {
            params.set('type', currentType);
        }
        if (currentType && !yearView.classList.contains('hidden')) {
            params.set('browse', currentBrowseMode);
        }
        if (!yearView.classList.contains('hidden') && currentBrowseMode === 'category' && selectedCategoryId) {
            params.set('category', selectedCategoryId);
        }
        return params.toString() ? `${window.location.pathname}?${params.toString()}` : window.location.pathname;
    }

    function syncIndexUrl() {
        try {
            window.history.replaceState({ path: buildIndexStateUrl() }, '', buildIndexStateUrl());
        } catch (error) {
            console.warn('History API is restricted in this environment.');
        }
    }

    function updateBrowseButtons() {
        if (browseModeToggle) {
            browseModeToggle.classList.toggle('hidden', !typeSupportsCategory(currentType));
        }
        browseModeButtons.forEach((button) => {
            button.classList.toggle('active', button.dataset.browseMode === currentBrowseMode);
        });
    }

    function setActiveView(targetView) {
        [typeView, yearView, mistakeView].forEach((view) => {
            view.classList.toggle('hidden', view !== targetView);
        });
    }

    function updateHeaderButtons() {
        updateMistakeCenterSummary();
        readingMistakeCenterBtn.classList.toggle('hidden', !mistakeView.classList.contains('hidden'));
    }

    function renderEmptyState(container, message) {
        container.innerHTML = `<div class="empty-state-card">${escapeHtml(message)}</div>`;
    }

    function initializeReadingDirectory() {
        const urlParams = new URLSearchParams(window.location.search);
        const initLevel = ['N1', 'N2'].includes(urlParams.get('level')) ? urlParams.get('level') : 'N1';
        const requestedType = normalizeReadingType(urlParams.get('type'));
        const initYear = urlParams.get('year');
        const requestedBrowse = urlParams.get('browse');
        const legacyDirectory = urlParams.get('directory');
        const initBrowse = requestedBrowse === 'category' || legacyDirectory === 'category' ? 'category' : 'year';
        const initCategory = urlParams.get('category');
        const initMistakeType = normalizeReadingType(urlParams.get('mistakeType'));
        const shouldOpenPracticeDirectory = ['year', 'category'].includes(requestedBrowse)
            || ['year', 'category'].includes(legacyDirectory)
            || Boolean(initYear || initCategory);

        selectLevel(initLevel, { updateUrl: false, keepView: true });

        if (urlParams.get('browse') === 'mistakes') {
            showMistakeCenter({
                selectedType: initMistakeType,
                updateUrl: false
            });
        } else {
            const initType = getDefaultReadingType(requestedType || 'short');
            if (!initType) {
                returnToHomeSection();
                return;
            }
            const typeName = typeNameMap[initType] || initType;
            openTypeDirectory(initType, typeName, { updateUrl: false });

            if (shouldOpenPracticeDirectory) {
                openRoute(initBrowse, {
                    categoryId: initCategory,
                    updateUrl: false,
                    preserveScroll: true
                });
            }

            if (shouldOpenPracticeDirectory && initBrowse !== 'category' && initYear) {
                const examKey = normalizeExamKey(initYear);
                selectYear(examKey);
                return;
            }

            syncIndexUrl();
        }

        updateHeaderButtons();
    }

    function selectLevel(level, options = {}) {
        currentLevel = level === 'N2' ? 'N2' : 'N1';

        if (currentLevel === 'N1') activeDatabase = databaseN1;
        else if (currentLevel === 'N2') activeDatabase = databaseN2;
        else activeDatabase = [];

        currentType = null;
        currentTypeName = '';
        currentArticles = [];
        currentYear = null;
        selectedCategoryId = null;

        document.querySelectorAll('[data-reading-level]').forEach((button) => {
            button.classList.toggle('active', button.dataset.readingLevel === currentLevel);
        });
        pageTitle.innerText = `${currentLevel} 読解特訓`;
        const unifiedTitle = document.querySelector('.kiki-unified-header-title');
        if (unifiedTitle) {
            unifiedTitle.textContent = `${currentLevel} 読解特訓`;
        }
        updateResumeTarget();
        updateMistakeCenterSummary();

        if (options.updateUrl !== false) {
            syncIndexUrl();
        }
        updateHeaderButtons();
    }

    function switchReadingLevel(level) {
        const scrollPosition = window.scrollY;
        const wasTypeDirectory = !typeView.classList.contains('hidden');
        const wasPracticeDirectory = !yearView.classList.contains('hidden');
        const wasMistakeCenter = !mistakeView.classList.contains('hidden');
        const retainedType = currentType;
        const retainedTypeName = currentTypeName || typeNameMap[retainedType] || retainedType;
        const retainedBrowseMode = currentBrowseMode;
        const retainedCategoryId = selectedCategoryId;
        const retainedMistakeType = selectedMistakeType;

        selectLevel(level, { updateUrl: false, keepView: true });

        const typeIsAvailable = retainedType && activeDatabase.some((article) => article.type === retainedType);
        if ((wasPracticeDirectory || wasTypeDirectory) && typeIsAvailable) {
            openTypeDirectory(retainedType, retainedTypeName, {
                updateUrl: false,
                preserveScroll: true
            });
            if (wasPracticeDirectory) {
                openRoute(retainedBrowseMode, {
                    categoryId: retainedCategoryId,
                    updateUrl: false,
                    preserveScroll: true
                });
            }
        } else if (wasMistakeCenter) {
            showMistakeCenter({
                selectedType: activeDatabase.some((article) => article.type === retainedMistakeType)
                    ? retainedMistakeType
                    : null,
                updateUrl: false
            });
        } else {
            const fallbackType = getDefaultReadingType(retainedType || 'short');
            if (fallbackType) {
                openTypeDirectory(fallbackType, typeNameMap[fallbackType], {
                    updateUrl: false,
                    preserveScroll: true
                });
            } else {
                returnToHomeSection();
                return;
            }
        }

        syncIndexUrl();
        window.requestAnimationFrame(() => window.scrollTo(0, scrollPosition));
    }

    function openRoute(mode, options = {}) {
        if (!currentType) {
            const fallbackType = getDefaultReadingType('short');
            if (!fallbackType) {
                returnToHomeSection();
                return;
            }
            openTypeDirectory(fallbackType, typeNameMap[fallbackType], {
                updateUrl: false,
                preserveScroll: true
            });
        }
        currentRouteMode = mode === 'category' ? 'category' : 'year';
        currentBrowseMode = currentRouteMode === 'category' && typeSupportsCategory(currentType) ? 'category' : 'year';
        selectedCategoryId = currentBrowseMode === 'category' && options.categoryId ? options.categoryId : null;

        renderPracticeView();
        setActiveView(yearView);
        practiceDirectoryTitle.textContent = currentBrowseMode === 'category'
            ? `${currentTypeName} · 分类练习`
            : `${currentTypeName} · 年度真题`;
        practiceGuideCopy.textContent = currentBrowseMode === 'category'
            ? '同类文章并置而读，细察其章法；久而久之，自会得其要领。'
            : '择一卷真题，静心读罢；莫急，文意自会显现，kiki。';
        if (options.updateUrl !== false) {
            syncIndexUrl();
        }
        updateHeaderButtons();
        if (!options.preserveScroll) {
            window.scrollTo(0, 0);
        }
    }

    function openTypeDirectory(type, typeName, options = {}) {
        currentType = normalizeReadingType(type);
        currentTypeName = typeName || typeNameMap[currentType] || currentType;
        currentArticles = activeDatabase.filter(a => a.type === currentType);
        currentYear = null;
        currentBrowseMode = 'year';
        selectedCategoryId = null;
        currentRouteMode = 'year';

        typeSectionTitle.textContent = `选择今天想要进行的${currentTypeName}练习吧，kiki。`;
        typePracticeMenuTitle.textContent = `${currentTypeName} · 练习目录`;
        if (readingCategoryRoute) {
            const supportsCategory = typeSupportsCategory(currentType);
            readingCategoryRoute.disabled = !supportsCategory;
            readingCategoryRoute.title = supportsCategory ? '' : '该题型暂不提供分类练习';
        }
        updateResumeTarget();
        setActiveView(typeView);
        if (options.updateUrl !== false) {
            syncIndexUrl();
        }
        updateHeaderButtons();
        if (!options.preserveScroll) {
            window.scrollTo(0, 0);
        }
    }

    function renderYears(list) {
        const lastPractice = localStorage.getItem(ReadingYearSystem.buildReadingLastPracticeKey(currentLevel, currentType)) || '';

        const articleMap = new Map();
        list.forEach(item => {
            const examKey = normalizeExamKey(item.year);
            if (!examKey || articleMap.has(examKey)) {
                return;
            }
            articleMap.set(examKey, item);
        });

        readingReviewGrid.innerHTML = '';
        readingReviewSection.classList.add('hidden');

        const yearGroups = new Map();
        articleMap.forEach((_article, examKey) => {
            const match = String(examKey).match(/^(\d{4})[.\-](\d{1,2})$/);
            const year = match ? match[1] : String(examKey).slice(0, 4);
            const month = match ? Number(match[2]) : 0;
            if (!yearGroups.has(year)) {
                yearGroups.set(year, []);
            }
            yearGroups.get(year).push({ examKey, month });
        });

        const groupedYears = Array.from(yearGroups.entries())
            .sort(([yearA], [yearB]) => yearB.localeCompare(yearA));

        if (groupedYears.length > 0) {
            yearContainer.innerHTML = groupedYears.map(([year, sessions]) => `
                <section class="reading-year-group" aria-label="${escapeHtml(year)} 年真题">
                    <div class="reading-year-group__label">
                        <strong>${escapeHtml(year)} 年</strong>
                    </div>
                    <div class="reading-year-group__sessions">
                        ${sessions.sort((a, b) => a.month - b.month).map(({ examKey, month }) => {
                            const displayYear = getDisplayYear(examKey);
                            const isLastPractice = examKey === lastPractice;
                            const monthLabel = month ? `${month} 月` : displayYear;
                            return `
                                <button type="button" class="reading-year-session${isLastPractice ? ' is-current' : ''}" data-year-card data-exam-key="${escapeHtml(examKey)}">
                                    <span class="reading-year-session__copy"><strong>${escapeHtml(monthLabel)}</strong></span>
                                    <span class="reading-year-session__state">${isLastPractice ? '继续 ›' : '进入 ›'}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>
                </section>
            `).join('');

            yearContainer.querySelectorAll('[data-year-card]').forEach((button) => {
                button.addEventListener('click', () => {
                    selectYear(button.dataset.examKey);
                });
            });
        } else {
            renderEmptyState(yearContainer, '該当する過去問がありません。');
        }
    }

    function renderCategories() {
        const categories = ReadingCategorySystem.getCategories(currentLevel, currentType);

        if (categories.length === 0) {
            renderEmptyState(categoryContainer, 'この問題タイプはまだテーマ別に整理されていません。');
            return;
        }

        categoryContainer.innerHTML = categories.map((category, index) => {
            const itemCount = Array.isArray(category.items) ? category.items.length : 0;
            const isEmpty = itemCount === 0;

            return `
                <button type="button" class="reading-directory-item${isEmpty ? ' is-empty' : ''}" data-category-card data-category-id="${escapeHtml(category.id)}"${isEmpty ? ' disabled aria-disabled="true"' : ''}>
                    <span class="reading-directory-item__number">${String(index + 1).padStart(2, '0')}</span>
                    <span class="reading-directory-item__copy">
                        <strong>${escapeHtml(category.name)}</strong>
                        <small>${escapeHtml(category.description || '')}</small>
                    </span>
                    <span class="reading-directory-item__meta">${isEmpty ? '暂无内容' : `${itemCount} 篇`}</span>
                    <span class="reading-directory-item__arrow" aria-hidden="true">${isEmpty ? '—' : '›'}</span>
                </button>
            `;
        }).join('');

        categoryContainer.querySelectorAll('[data-category-card]:not([disabled])').forEach((button) => {
            button.addEventListener('click', () => {
                selectCategory(button.dataset.categoryId);
            });
        });
    }

    function renderCategoryArticles(categoryId) {
        const category = ReadingCategorySystem.getCategory(currentLevel, currentType, categoryId);
        const items = ReadingCategorySystem.getCategoryPracticeItems({
            level: currentLevel,
            type: currentType,
            categoryId,
            pathContext: 'index'
        });
        const lastArticle = ReadingCategorySystem.getCategoryLastArticle(currentLevel, currentType, categoryId);

        if (!category) {
            selectedCategoryId = null;
            renderPracticeView();
            return;
        }

        if (items.length === 0) {
            renderEmptyState(categoryArticleGrid, 'このテーマにはまだ記事がありません。');
            return;
        }

        categoryArticleGrid.innerHTML = items.map((item, index) => {
            const isLastArticle = Boolean(
                lastArticle &&
                lastArticle.examKey === item.examKey &&
                lastArticle.page === item.page
            );
            const articleTitle = currentType === 'long'
                ? (item.displayLabel.split('/').slice(1).join('/').trim() || '长篇阅读')
                : `第 ${item.page} 篇`;
            return `
                <button type="button" class="reading-directory-item${isLastArticle ? ' is-current' : ''}" data-category-article data-href="${escapeHtml(item.href)}">
                    <span class="reading-directory-item__number">${String(index + 1).padStart(2, '0')}</span>
                    <span class="reading-directory-item__copy"><strong>${escapeHtml(articleTitle)}</strong><small>${escapeHtml(item.displayYear)}</small></span>
                    <span class="reading-directory-item__meta">${isLastArticle ? '继续' : ''}</span>
                    <span class="reading-directory-item__arrow" aria-hidden="true">›</span>
                </button>
            `;
        }).join('');

        categoryArticleGrid.querySelectorAll('[data-category-article]').forEach((button) => {
            button.addEventListener('click', () => {
                window.location.href = button.dataset.href;
            });
        });
    }

    function renderPracticeView() {
        if (!typeSupportsCategory(currentType)) {
            currentBrowseMode = 'year';
            selectedCategoryId = null;
        }

        updateBrowseButtons();

        yearContainer.classList.toggle('hidden', currentBrowseMode !== 'year');
        categoryContainer.classList.toggle('hidden', currentBrowseMode !== 'category' || Boolean(selectedCategoryId));
        categoryArticleShell.classList.toggle('hidden', currentBrowseMode !== 'category' || !selectedCategoryId);

        if (currentBrowseMode === 'year') {
            renderYears(currentArticles);
        } else if (selectedCategoryId) {
            readingReviewSection.classList.add('hidden');
            renderCategoryArticles(selectedCategoryId);
        } else {
            readingReviewSection.classList.add('hidden');
            renderCategories();
        }
    }

    function setBrowseMode(mode) {
        const nextMode = mode === 'category' && typeSupportsCategory(currentType) ? 'category' : 'year';
        currentBrowseMode = nextMode;
        if (nextMode === 'year') {
            selectedCategoryId = null;
        }

        renderPracticeView();
        syncIndexUrl();
    }

    function selectCategory(categoryId) {
        currentBrowseMode = 'category';
        selectedCategoryId = categoryId;
        renderPracticeView();
        syncIndexUrl();
    }

    function showCategoryList() {
        selectedCategoryId = null;
        currentBrowseMode = 'category';
        renderPracticeView();
        syncIndexUrl();
    }

    function selectYear(year) {
        const examKey = normalizeExamKey(year);
        currentYear = examKey;
        const filteredByYear = currentArticles.filter(a => normalizeExamKey(a.year) === examKey);

        if (filteredByYear.length > 0) {
            const firstArticle = filteredByYear[0];
            const targetUrl = buildArticleUrl(
                firstArticle,
                examKey,
                false,
                ['short', 'middle', 'long', 'integrated', 'search'].includes(currentType) ? 'test' : null
            );
            window.location.href = targetUrl;
        } else {
            alert('該当する问题がありません！');
        }
    }

    function updateResumeTarget() {
        resumeTarget = null;
        const savedPosition = typeof ReadingYearSystem.getReadingLastPosition === 'function'
            ? ReadingYearSystem.getReadingLastPosition(currentLevel)
            : null;
        const desiredTypes = currentType
            ? [normalizeReadingType(currentType)]
            : ['short', 'middle', 'long', 'integrated', 'search'];

        if (savedPosition && desiredTypes.includes(normalizeReadingType(savedPosition.type))) {
            const article = activeDatabase.find((item) => (
                item.type === normalizeReadingType(savedPosition.type) &&
                normalizeExamKey(item.year) === normalizeExamKey(savedPosition.examKey)
            ));
            if (article) {
                resumeTarget = {
                    article,
                    examKey: normalizeExamKey(savedPosition.examKey),
                    type: savedPosition.type,
                    page: Math.max(1, Number.parseInt(savedPosition.page, 10) || 1)
                };
            }
        }

        for (const type of resumeTarget ? [] : desiredTypes) {
            let examKey = '';
            try {
                examKey = localStorage.getItem(ReadingYearSystem.buildReadingLastPracticeKey(currentLevel, type)) || '';
            } catch (error) {
                examKey = '';
            }
            if (!examKey) {
                continue;
            }
            const article = activeDatabase.find((item) => item.type === type && normalizeExamKey(item.year) === normalizeExamKey(examKey));
            if (article) {
                resumeTarget = { article, examKey: normalizeExamKey(examKey), type, page: 1 };
                break;
            }
        }

        if (resumeTarget) {
            const pageCopy = resumeTarget.page > 1 ? ` · 第 ${resumeTarget.page} 篇` : '';
            const resumeCopy = `${typeNameMap[resumeTarget.type] || resumeTarget.type} · ${getDisplayYear(resumeTarget.examKey)}${pageCopy}`;
            readingResumeCopies.forEach((copy) => {
                copy.textContent = resumeCopy;
            });
            readingResumeButtons.forEach((button) => {
                button.hidden = false;
            });
        } else {
            readingResumeButtons.forEach((button) => {
                button.hidden = true;
            });
        }
    }

    function resumeLastReading() {
        if (!resumeTarget) {
            return;
        }
        window.location.href = buildArticleUrl(
            resumeTarget.article,
            resumeTarget.examKey,
            false,
            'test',
            resumeTarget.page
        );
    }

    function startRandomPractice() {
        const candidates = activeDatabase.filter((article) => (
            article && article.link && (!currentType || article.type === currentType)
        ));
        if (candidates.length === 0) {
            alert('当前级别的随机练习还在准备中。');
            return;
        }
        const article = candidates[Math.floor(Math.random() * candidates.length)];
        const examKey = normalizeExamKey(article.year);
        window.location.href = buildArticleUrl(article, examKey, false, 'test');
    }

    function collectMistakeEntries() {
        const entries = [];
        Object.keys(typeNameMap).forEach((type) => {
            const articleByExam = new Map(
                activeDatabase
                    .filter((article) => article.type === type)
                    .map((article) => [normalizeExamKey(article.year), article])
            );
            const questionItems = typeof ReadingYearSystem.collectReadingQuestionReviewItems === 'function'
                ? ReadingYearSystem.collectReadingQuestionReviewItems(currentLevel, type)
                : [];
            const questionItemByExam = new Map(
                questionItems.map((item) => [normalizeExamKey(item.examKey), item])
            );
            const legacyItems = ReadingYearSystem.collectReadingReviewItems(currentLevel, type);
            const examKeys = new Set([
                ...legacyItems.map((item) => normalizeExamKey(item.examKey)),
                ...questionItems.map((item) => normalizeExamKey(item.examKey))
            ]);
            examKeys.forEach((examKey) => {
                const item = questionItemByExam.get(examKey);
                const legacyItem = legacyItems.find((candidate) => normalizeExamKey(candidate.examKey) === examKey);
                const article = articleByExam.get(examKey);
                if (!article) {
                    return;
                }
                entries.push({
                    type,
                    typeName: typeNameMap[type] || type,
                    examKey,
                    count: Math.max(1, Number(item?.count || legacyItem?.count) || 1),
                    totalWrongCount: Math.max(0, Number(item?.totalWrongCount) || 0),
                    questions: Array.isArray(item?.questions) ? item.questions : [],
                    article
                });
            });
        });
        return entries.sort((a, b) => b.examKey.localeCompare(a.examKey) || a.typeName.localeCompare(b.typeName));
    }

    function updateMistakeCenterSummary() {
        const total = collectMistakeEntries().reduce((sum, entry) => sum + entry.count, 0);
        readingMistakeCount.textContent = String(total);
    }

    function getAvailableMistakeTypes() {
        return Object.keys(typeNameMap).filter((type) => (
            activeDatabase.some((article) => article.type === type)
        ));
    }

    function renderMistakeTypeDirectory(entries) {
        const availableTypes = getAvailableMistakeTypes();
        mistakeCenterList.classList.add('is-type-directory');
        mistakeCenterList.innerHTML = availableTypes.map((type, index) => {
            const typeEntries = entries.filter((entry) => entry.type === type);
            const pendingCount = typeEntries.reduce((sum, entry) => sum + entry.count, 0);
            const totalWrongCount = typeEntries.reduce((sum, entry) => sum + entry.totalWrongCount, 0);
            const typeName = mistakeTypeNameMap[type] || typeNameMap[type] || type;
            const statusCopy = pendingCount > 0 ? `${pendingCount} 题待复习` : '暂无错题';
            const historyCopy = totalWrongCount > 0
                ? `累计错误 ${totalWrongCount} 次`
                : '保持得很好';
            return `
                <button type="button" class="reading-mistake-type-item" data-mistake-type="${escapeHtml(type)}"${pendingCount > 0 ? '' : ' disabled'}>
                    <span class="reading-mistake-type-item__index">${String(index + 1).padStart(2, '0')}</span>
                    <span class="reading-mistake-type-item__main">
                        <strong>${escapeHtml(typeName)}</strong>
                        <small>集中复习${escapeHtml(typeName)}中的错题</small>
                    </span>
                    <span class="reading-mistake-type-item__stats">
                        <strong>${statusCopy}</strong>
                        <small>${historyCopy}</small>
                    </span>
                    <span class="reading-mistake-type-item__arrow" aria-hidden="true">›</span>
                </button>
            `;
        }).join('');

        mistakeCenterList.querySelectorAll('[data-mistake-type]').forEach((button) => {
            button.addEventListener('click', () => selectMistakeType(button.dataset.mistakeType));
        });
    }

    function renderMistakeTypeDetail(entries) {
        const typeEntries = entries.filter((entry) => entry.type === selectedMistakeType);
        mistakeCenterList.classList.remove('is-type-directory');
        if (typeEntries.length === 0) {
            renderEmptyState(mistakeCenterList, `目前没有待复习的${mistakeTypeNameMap[selectedMistakeType] || '阅读'}错题。`);
            return;
        }
        mistakeCenterList.innerHTML = typeEntries.map((entry, index) => {
            const numberFrequency = entry.questions.reduce((map, question) => {
                const key = String(question.questionNumber || '');
                map.set(key, (map.get(key) || 0) + 1);
                return map;
            }, new Map());
            const questionLabels = entry.questions.map((question) => {
                const number = String(question.questionNumber || '');
                return numberFrequency.get(number) > 1
                    ? `第${Number(question.page) || 1}篇-${number}`
                    : number;
            });
            const questionCopy = questionLabels.length
                ? `错题号 ${questionLabels.map(escapeHtml).join('、')}`
                : '历史错题记录 · 再次作答后补全题号';
            const wrongCountCopy = entry.totalWrongCount > 0
                ? `累计错误 ${entry.totalWrongCount} 次`
                : '错误次数待更新';
            return `
            <a class="reading-mistake-item" href="${buildArticleUrl(entry.article, entry.examKey, true)}">
                <span class="reading-mistake-item__index">${String(index + 1).padStart(2, '0')}</span>
                <span class="reading-mistake-item__main">
                    <strong>${escapeHtml(getDisplayYear(entry.examKey))}</strong>
                    <small>${escapeHtml(mistakeTypeNameMap[entry.type] || entry.typeName)}</small>
                    <span class="reading-mistake-item__questions">${questionCopy}</span>
                </span>
                <span class="reading-mistake-item__stats">
                    <strong>${entry.count} 题待复习</strong>
                    <small>${wrongCountCopy}</small>
                </span>
                <span aria-hidden="true">›</span>
            </a>
        `;
        }).join('');
    }

    function renderMistakeCenter() {
        const entries = collectMistakeEntries();
        if (selectedMistakeType) {
            mistakeDirectoryTitle.textContent = `${mistakeTypeNameMap[selectedMistakeType] || selectedMistakeType}错题`;
            mistakeCategoryBack.classList.remove('hidden');
            renderMistakeTypeDetail(entries);
            return;
        }

        mistakeDirectoryTitle.textContent = '阅读错题分类';
        mistakeCategoryBack.classList.add('hidden');
        renderMistakeTypeDirectory(entries);
    }

    function selectMistakeType(type) {
        const normalizedType = normalizeReadingType(type);
        if (!getAvailableMistakeTypes().includes(normalizedType)) {
            return;
        }
        selectedMistakeType = normalizedType;
        renderMistakeCenter();
        syncIndexUrl();
        window.scrollTo(0, 0);
    }

    function returnToMistakeCategories() {
        if (!selectedMistakeType) {
            return;
        }
        selectedMistakeType = null;
        renderMistakeCenter();
        syncIndexUrl();
        window.scrollTo(0, 0);
    }

    function showMistakeCenter(options = {}) {
        selectedCategoryId = null;
        const requestedType = normalizeReadingType(options.selectedType);
        selectedMistakeType = getAvailableMistakeTypes().includes(requestedType) ? requestedType : null;
        renderMistakeCenter();
        setActiveView(mistakeView);
        updateHeaderButtons();
        pageTitle.innerText = `${currentLevel} 読解特訓`;
        if (options.updateUrl !== false) {
            syncIndexUrl();
        }
        window.scrollTo(0, 0);
    }

    function returnToPracticeDirectory() {
        const targetType = getDefaultReadingType(currentType || 'short');
        currentYear = null;
        currentBrowseMode = 'year';
        selectedCategoryId = null;
        selectedMistakeType = null;
        if (!targetType) {
            returnToHomeSection();
            return;
        }
        openTypeDirectory(targetType, typeNameMap[targetType], {
            updateUrl: true
        });
    }

    function returnToTypeDirectory() {
        currentYear = null;
        currentBrowseMode = 'year';
        selectedCategoryId = null;
        setActiveView(typeView);
        pageTitle.innerText = `${currentLevel} 読解特訓`;
        updateResumeTarget();
        syncIndexUrl();
        window.scrollTo(0, 0);
    }

    function returnToHomeSection() {
        const fallback = new URL('../../index.html#exam/exam-reading', window.location.href);
        const params = new URLSearchParams(window.location.search);
        let explicitReturn = null;
        let referrer = null;

        try {
            const candidate = params.get('return');
            explicitReturn = candidate ? new URL(candidate, window.location.href) : null;
            if (explicitReturn && explicitReturn.origin !== window.location.origin) explicitReturn = null;
        } catch (error) {
            explicitReturn = null;
        }

        try {
            referrer = document.referrer ? new URL(document.referrer, window.location.href) : null;
            if (referrer && referrer.origin !== window.location.origin) referrer = null;
        } catch (error) {
            referrer = null;
        }

        const cameFromReadingPage = referrer && /\/exam\/jlpt-reading\//i.test(referrer.pathname);
        if (referrer && !cameFromReadingPage && window.history.length > 1) {
            window.history.back();
            return;
        }

        window.location.replace((explicitReturn || fallback).href);
    }

    function handleBack() {
        if (!mistakeView.classList.contains('hidden')) {
            if (selectedMistakeType) {
                returnToMistakeCategories();
            } else {
                returnToPracticeDirectory();
            }
            return;
        }
        if (!yearView.classList.contains('hidden')) {
            if (currentBrowseMode === 'category' && selectedCategoryId) {
                showCategoryList();
            } else {
                returnToTypeDirectory();
                return;
            }
        } else if (!typeView.classList.contains('hidden')) {
            returnToHomeSection();
            return;
        } else {
            returnToHomeSection();
            return;
        }

        updateHeaderButtons();
    }

    browseModeButtons.forEach((button) => {
        button.addEventListener('click', () => {
            setBrowseMode(button.dataset.browseMode);
        });
    });

    backToCategoryListBtn.addEventListener('click', showCategoryList);

    if (window.backNavigation && typeof window.backNavigation.resolveTargetUrl === 'function') {
        backButton.setAttribute(
            'href',
            window.backNavigation.resolveTargetUrl({
                selector: backButton,
                fallback: '../../index.html#exam/exam-reading'
            }).href
        );
    } else {
        backButton.setAttribute('href', '../../index.html#exam/exam-reading');
    }

    // The shared header hydrates this control after the directory script runs.
    // Delegate from document so the directory's real view hierarchy remains the
    // single source of truth even when the public header moves or rebuilds it.
    document.addEventListener('click', function(event) {
        const target = event.target instanceof Element
            ? event.target.closest('[data-kiki-dynamic-back]')
            : null;
        if (!target) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        handleBack();
    }, true);

    initializeReadingDirectory();
</script>
    <script src="../../shared/word-bank.js?v=20260808-reading-tools"></script>
    <script src="../../shared/unified-header.js" data-kiki-unified-header-loader></script>

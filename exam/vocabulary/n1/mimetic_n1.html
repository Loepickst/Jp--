    <script>
        const CURRICULUM_DAYS = Array.isArray(window.LAB_ONOMATOPOEIA_DAYS) ? window.LAB_ONOMATOPOEIA_DAYS : [];
        const CURRICULUM_STAGES = Array.isArray(window.LAB_ONOMATOPOEIA_STAGES) ? window.LAB_ONOMATOPOEIA_STAGES : [];
        const CURRICULUM_GROUPS = Array.isArray(window.LAB_ONOMATOPOEIA_GROUPS) ? window.LAB_ONOMATOPOEIA_GROUPS : [];
        const LOCAL_AUDIO_BY_WORD_ID = new Map();
        const STAR_KEY_PREFIX = 'study_quest_test_v1_n1_mimetic_vocab_star::';
        const LEGACY_STAR_KEY_PREFIX = 'study_quest_test_v1_vocab_star::';
        const LAST_DAY_STORAGE_KEY = 'study_quest_test_v1_n1_mimetic_last_day';
        const PRACTICE_TYPE_STORAGE_KEY = 'study_quest_test_v1_n1_mimetic_practice_type';
        const INDEX_COLLAPSED_STORAGE_KEY = 'study_quest_test_v1_n1_mimetic_index_collapsed';
        const DETAIL_FONT_SIZE_STORAGE_KEY = 'study_quest_test_v1_n1_mimetic_detail_font_size';
        const PET_SETTINGS_STORAGE_KEY = 'study_quest_test_v1_kiki_pet_settings_v1';
        const VOCABULARY_DIRECTORY_HREF = './mimetic_n1.html';
        const N1_VOCABULARY_HOME_HREF = '../index.html';
        const BACK_ICON_HTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';
        const PRACTICE_TYPE_OPTIONS = Object.freeze([
            Object.freeze({
                id: 'meaning',
                label: '假名选义',
                hint: '看假名，选出最合适的中文含义。'
            }),
            Object.freeze({
                id: 'sentence',
                label: '语境填空',
                hint: '结合语境，选出最合适的拟声拟态词。'
            })
        ]);
        const SENTENCE_REVIEW_MODULE_KEY = 'n1_mimetic';
        const sentenceReviewStore = window.VocabularySentenceReviewStore || null;
        const reviewStore = window.VocabularyReviewStore || null;

        let currentView = 'days';
        let currentDay = 1;
        let currentDailyWords = [];
        let currentWordIndex = 0;
        let currentPracticeType = getStoredPracticeType();
        let practicePickerContext = null;
        let activeVocabularyAudio = null;
        let activeSpeechUtterance = null;
        let activePronounceButton = null;
        let practicePickerReturnFocus = null;
        let isWordIndexCollapsed = safeGetItem(INDEX_COLLAPSED_STORAGE_KEY) === 'true';
        let currentDetailFontSize = normalizeDetailFontSize(safeGetItem(DETAIL_FONT_SIZE_STORAGE_KEY));
        let directoryScrollY = 0;
        let wordIndexScrollTop = 0;
        let isBackNavigationLocked = false;

        const backBtn = document.getElementById('back-btn');
        const pageTitle = document.getElementById('page-title');
        const headerPracticeBtn = document.getElementById('header-practice-btn');
        const daysView = document.getElementById('days-view');
        const wordListView = document.getElementById('word-list-view');
        const wordDetailView = document.getElementById('word-detail-view');
        const practicePickerOverlay = document.getElementById('practice-picker-overlay');
        const practicePickerCloseBtn = document.getElementById('practice-picker-close');
        const practicePickerOptionsNode = document.getElementById('practice-picker-options');
        const detailFontSizeButtons = document.querySelectorAll('[data-detail-font-size]');
        const fontSizeControl = document.querySelector('.font-size-control');
        const fontSizeTrigger = document.getElementById('font-size-trigger');
        const fontSizeDrawer = document.getElementById('font-size-drawer');
        const fontSizeCurrentLabel = document.getElementById('font-size-current-label');

        function safeGetItem(key) {
            try {
                return localStorage.getItem(key);
            } catch (error) {
                console.warn('LocalStorage access denied', error);
                return null;
            }
        }

        function safeSetItem(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (error) {
                console.warn('LocalStorage write denied', error);
            }
        }

        function safeRemoveItem(key) {
            try {
                localStorage.removeItem(key);
            } catch (error) {
                console.warn('LocalStorage remove denied', error);
            }
        }

        function normalizeDetailFontSize(value) {
            return ['small', 'medium', 'large'].includes(value) ? value : 'medium';
        }

        function applyDetailFontSize(size, shouldPersist = true) {
            currentDetailFontSize = normalizeDetailFontSize(size);
            document.body.dataset.vocabFontSize = currentDetailFontSize;
            detailFontSizeButtons.forEach((button) => {
                const isActive = button.dataset.detailFontSize === currentDetailFontSize;
                button.classList.toggle('is-active', isActive);
                button.setAttribute('aria-checked', String(isActive));
            });
            if (fontSizeCurrentLabel) {
                fontSizeCurrentLabel.textContent = {
                    small: '小',
                    medium: '标准',
                    large: '大'
                }[currentDetailFontSize];
            }
            if (shouldPersist) {
                safeSetItem(DETAIL_FONT_SIZE_STORAGE_KEY, currentDetailFontSize);
            }
        }

        function setFontSizeDrawerOpen(shouldOpen, shouldFocus = false) {
            if (!fontSizeControl || !fontSizeTrigger || !fontSizeDrawer) return;
            fontSizeControl.classList.toggle('is-open', shouldOpen);
            fontSizeTrigger.setAttribute('aria-expanded', String(shouldOpen));
            fontSizeDrawer.setAttribute('aria-hidden', String(!shouldOpen));
            if (shouldOpen && shouldFocus) {
                window.requestAnimationFrame(() => {
                    fontSizeDrawer.querySelector('.font-size-option.is-active')?.focus();
                });
            }
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function getPetSystemUserName() {
            if (window.HomePetSystem && typeof window.HomePetSystem.getUserName === 'function') {
                const systemName = String(window.HomePetSystem.getUserName() || '').trim();
                if (systemName) return Array.from(systemName).slice(0, 16).join('');
            }
            try {
                const settings = JSON.parse(safeGetItem(PET_SETTINGS_STORAGE_KEY) || '{}');
                return Array.from(String(settings && settings.userName ? settings.userName : '').trim())
                    .slice(0, 16)
                    .join('');
            } catch (error) {
                return '';
            }
        }

        function isPlaceholderWord(word) {
            const surface = String(word && word.word ? word.word : '').trim();
            return !surface || surface === '（準備中）' || surface === '---';
        }

        function getVocabStarKey(wordId) {
            return `${STAR_KEY_PREFIX}${String(wordId || '').trim()}`;
        }

        function getWordStorageId(word) {
            return String(word && (word.id || word.word) ? (word.id || word.word) : '').trim();
        }

        function getSentenceReviewQuestionCount() {
            return sentenceReviewStore ? sentenceReviewStore.getQuestionCount(SENTENCE_REVIEW_MODULE_KEY) : 0;
        }

        function getSentenceMistakeCountForWord(word) {
            if (!sentenceReviewStore) return 0;
            const storageId = getWordStorageId(word);
            const surface = String(word && word.word ? word.word : '').trim();
            const primaryCount = storageId ? sentenceReviewStore.getWordMistakeCount(SENTENCE_REVIEW_MODULE_KEY, storageId) : 0;
            if (primaryCount > 0) return primaryCount;
            return surface ? sentenceReviewStore.getWordMistakeCount(SENTENCE_REVIEW_MODULE_KEY, surface) : 0;
        }

        function findWordByReviewIdentifier(wordId) {
            const target = String(wordId || '').trim();
            if (!target) return null;
            const pools = [currentDailyWords, typeof FULL_WORD_LIST !== 'undefined' && Array.isArray(FULL_WORD_LIST) ? FULL_WORD_LIST : []];
            for (const pool of pools) {
                const found = pool.find((word) => {
                    if (!word || isPlaceholderWord(word)) return false;
                    const storageId = getWordStorageId(word);
                    const surface = String(word.word || '').trim();
                    return storageId === target || surface === target;
                });
                if (found) return found;
            }
            return null;
        }

        function getReviewKeywordIds(wordOrId) {
            const ids = new Set();
            if (typeof wordOrId === 'string') ids.add(wordOrId.trim());
            const word = typeof wordOrId === 'string' ? findWordByReviewIdentifier(wordOrId) : wordOrId;
            if (word) {
                const storageId = getWordStorageId(word);
                const surface = String(word.word || '').trim();
                if (storageId) ids.add(storageId);
                if (surface) ids.add(surface);
            }
            return Array.from(ids).filter(Boolean);
        }

        function isReviewKeywordDismissed(word) {
            if (!reviewStore || typeof reviewStore.isKeywordDismissed !== 'function') return false;
            return getReviewKeywordIds(word).some((wordId) => reviewStore.isKeywordDismissed(SENTENCE_REVIEW_MODULE_KEY, wordId));
        }

        function dismissReviewKeyword(wordOrId) {
            const ids = getReviewKeywordIds(wordOrId);
            ids.forEach((wordId) => {
                safeRemoveItem(getVocabStarKey(wordId));
                if (!reviewStore) return;
                if (typeof reviewStore.removeTypedWord === 'function') {
                    reviewStore.removeTypedWord(SENTENCE_REVIEW_MODULE_KEY, 'reading', wordId);
                    reviewStore.removeTypedWord(SENTENCE_REVIEW_MODULE_KEY, 'meaning', wordId);
                }
                if (typeof reviewStore.dismissKeyword === 'function') {
                    reviewStore.dismissKeyword(SENTENCE_REVIEW_MODULE_KEY, wordId);
                }
            });
        }

        function refreshReviewKeywordListAfterDismiss() {
            if (currentDay !== -1) return;
            currentDailyWords = getReviewableWords();
            if (currentDailyWords.length === 0) {
                currentWordIndex = 0;
                currentView = 'list';
                renderWordList(currentDailyWords);
                updateUI();
                return;
            }
            if (currentView === 'detail') {
                currentWordIndex = Math.min(currentWordIndex, currentDailyWords.length - 1);
                renderDetailCard();
                updateUI();
                return;
            }
            renderWordList(currentDailyWords);
            updateUI();
        }

        function getSentenceReviewWords() {
            if (!sentenceReviewStore || typeof FULL_WORD_LIST === 'undefined' || !Array.isArray(FULL_WORD_LIST)) return [];
            const trackedIds = new Set(sentenceReviewStore.listTrackedWordIds(SENTENCE_REVIEW_MODULE_KEY));
            if (trackedIds.size === 0) return [];
            return FULL_WORD_LIST.filter((word) => {
                if (!word || isPlaceholderWord(word)) return false;
                const storageId = getWordStorageId(word);
                const surface = String(word.word || '').trim();
                return trackedIds.has(storageId) || trackedIds.has(surface);
            });
        }

        function getTypedReviewCount(type) {
            return reviewStore ? reviewStore.getTypedCount(SENTENCE_REVIEW_MODULE_KEY, type) : 0;
        }

        function getTypedReviewSnapshots(type) {
            return reviewStore ? reviewStore.listTypedWords(SENTENCE_REVIEW_MODULE_KEY, type) : [];
        }

        function findWordByReviewSnapshot(snapshot) {
            if (!snapshot || typeof FULL_WORD_LIST === 'undefined' || !Array.isArray(FULL_WORD_LIST)) return null;
            const wordId = String(snapshot.wordId || snapshot.id || '').trim();
            const wordLabel = String(snapshot.wordLabel || snapshot.word || '').trim();
            return FULL_WORD_LIST.find((word) => {
                if (!word || isPlaceholderWord(word)) return false;
                const storageId = getWordStorageId(word);
                const surface = String(word.word || '').trim();
                return (wordId && (storageId === wordId || surface === wordId)) || (wordLabel && surface === wordLabel);
            }) || null;
        }

        function getTypedReviewWords(type) {
            return getTypedReviewSnapshots(type).map(findWordByReviewSnapshot).filter(Boolean);
        }

        function getTypedReviewWordIds() {
            const ids = new Set();
            ['reading', 'meaning'].forEach((type) => {
                getTypedReviewSnapshots(type).forEach((snapshot) => {
                    const wordId = String(snapshot && snapshot.wordId || '').trim();
                    const wordLabel = String(snapshot && (snapshot.wordLabel || snapshot.word) || '').trim();
                    if (wordId) ids.add(wordId);
                    if (wordLabel) ids.add(wordLabel);
                });
            });
            return ids;
        }

        function getSentenceTrackedWordIds() {
            return sentenceReviewStore ? new Set(sentenceReviewStore.listTrackedWordIds(SENTENCE_REVIEW_MODULE_KEY)) : new Set();
        }

        function getLegacyStarredWords() {
            const typedIds = getTypedReviewWordIds();
            const sentenceIds = getSentenceTrackedWordIds();
            return getStarredWords().filter((word) => {
                const storageId = getWordStorageId(word);
                const surface = String(word && word.word || '').trim();
                return !typedIds.has(storageId) && !typedIds.has(surface) && !sentenceIds.has(storageId) && !sentenceIds.has(surface);
            });
        }

        function getReviewableWords() {
            const seen = new Set();
            return [...getTypedReviewWords('reading'), ...getTypedReviewWords('meaning'), ...getSentenceReviewWords(), ...getLegacyStarredWords()].filter((word) => {
                const key = getWordStorageId(word) || String(word && word.word || '').trim();
                if (!key || seen.has(key)) return false;
                if (isReviewKeywordDismissed(word)) return false;
                seen.add(key);
                return true;
            });
        }

        function getReviewWordCount() {
            return getReviewableWords().length;
        }

        function getPendingReviewCount() {
            return getReviewWordCount() + getSentenceReviewQuestionCount();
        }

        function getPracticeOptionReviewCount(type) {
            if (type === 'sentence') return getSentenceReviewQuestionCount();
            return getTypedReviewCount(type);
        }

        function getPracticeOptionReviewCountLabel(type) {
            const count = getPracticeOptionReviewCount(type);
            if (count <= 0) return '暂无该类错题';
            return type === 'sentence' ? `${count} 题待回放` : `${count} 词待练`;
        }

        function getReviewCountSummary() {
            return `看错关键词 ${getReviewWordCount()} 词 · 句子题 ${getSentenceReviewQuestionCount()} 题待回放`;
        }

        function getEmptyReviewPracticeMessage(defaultMessage) {
            return getReviewWordCount() > 0
                ? '这些错词先作为关键词整理出来，确认词形和意思后再回到练习。'
                : defaultMessage;
        }

        function migrateLegacyProgress() {
            if (typeof FULL_WORD_LIST === 'undefined' || !Array.isArray(FULL_WORD_LIST)) return;
            FULL_WORD_LIST.forEach((word) => {
                if (!word || isPlaceholderWord(word)) return;
                const legacyKey = `${LEGACY_STAR_KEY_PREFIX}${word.word}`;
                if (safeGetItem(legacyKey) === 'true' && safeGetItem(getVocabStarKey(word.word)) !== 'true') {
                    safeSetItem(getVocabStarKey(word.word), 'true');
                }
            });
        }

        function getLastStudiedDay() {
            return parseInt(safeGetItem(LAST_DAY_STORAGE_KEY) || '', 10) || 0;
        }

        function setLastStudiedDay(dayId) {
            safeSetItem(LAST_DAY_STORAGE_KEY, String(dayId));
        }

        function normalizePracticeType(value) {
            const normalized = String(value || '').trim().toLowerCase();
            return PRACTICE_TYPE_OPTIONS.some((option) => option.id === normalized) ? normalized : 'sentence';
        }

        function getStoredPracticeType() {
            return normalizePracticeType(safeGetItem(PRACTICE_TYPE_STORAGE_KEY));
        }

        function setStoredPracticeType(type) {
            currentPracticeType = normalizePracticeType(type);
            safeSetItem(PRACTICE_TYPE_STORAGE_KEY, currentPracticeType);
        }

        function getCurrentPracticeTypeMeta() {
            return PRACTICE_TYPE_OPTIONS.find((option) => option.id === currentPracticeType) || PRACTICE_TYPE_OPTIONS[0];
        }

        function buildPracticeUrl(params, explicitType) {
            const searchParams = new URLSearchParams();
            Object.entries(params || {}).forEach(([key, value]) => {
                if (value === undefined || value === null || value === '') return;
                searchParams.set(key, String(value));
            });
            searchParams.set('type', normalizePracticeType(explicitType || currentPracticeType));
            return `practice_n1_mimetic.html?${searchParams.toString()}`;
        }

        function getCurriculumDay(dayId) {
            return CURRICULUM_DAYS.find((day) => Number(day.id) === Number(dayId)) || null;
        }

        function getCurriculumStage(stageId) {
            return CURRICULUM_STAGES.find((stage) => Number(stage.id) === Number(stageId)) || null;
        }

        function getCurriculumGroup(groupId) {
            return CURRICULUM_GROUPS.find((group) => Number(group.id) === Number(groupId)) || null;
        }

        function collectWordsByIndexes(indexes) {
            if (!Array.isArray(indexes) || typeof FULL_WORD_LIST === 'undefined' || !Array.isArray(FULL_WORD_LIST)) return [];
            const seen = new Set();
            return indexes.map((index) => FULL_WORD_LIST[index]).filter((word) => {
                if (!word || isPlaceholderWord(word)) return false;
                if (seen.has(word.word)) return false;
                seen.add(word.word);
                return true;
            });
        }

        function getDayWords(dayId) {
            const day = getCurriculumDay(dayId);
            if (day && Array.isArray(day.wordIds)) {
                return collectWordsByIndexes(day.wordIds);
            }
            if (typeof FULL_WORD_LIST === 'undefined' || !Array.isArray(FULL_WORD_LIST)) return [];
            const wordsPerDay = typeof WORDS_PER_DAY !== 'undefined' ? WORDS_PER_DAY : 20;
            const start = (dayId - 1) * wordsPerDay;
            const size = wordsPerDay;
            return FULL_WORD_LIST.slice(start, start + size).filter((word) => !isPlaceholderWord(word));
        }

        function getAllCurriculumWords() {
            if (CURRICULUM_DAYS.length > 0) {
                return collectWordsByIndexes(CURRICULUM_DAYS.flatMap((day) => Array.isArray(day.wordIds) ? day.wordIds : []));
            }
            return (typeof FULL_WORD_LIST !== 'undefined' && Array.isArray(FULL_WORD_LIST)) ? FULL_WORD_LIST.filter((word) => !isPlaceholderWord(word)) : [];
        }

        function getStarredWords() {
            return (typeof FULL_WORD_LIST !== 'undefined' && Array.isArray(FULL_WORD_LIST))
                ? FULL_WORD_LIST.filter((word) => !isPlaceholderWord(word) && safeGetItem(getVocabStarKey(word.word)) === 'true')
                : [];
        }

        function getStarredCount() {
            return getStarredWords().length;
        }

        function buildPracticePickerMeta(params) {
            if (params && params.mode === 'final') {
                return { title: '综合练习' };
            }
            if (params && Number(params.day) === -1) {
                return { title: '错题练习' };
            }
            if (params && params.stage != null) {
                const stage = getCurriculumStage(params.stage);
                return { title: stage ? `${stage.title}阶段练习` : '阶段练习' };
            }
            if (params && params.day != null) {
                return { title: '单元练习' };
            }
            return { title: '选择练习方式' };
        }

        function getPracticePickerFocusableNodes() {
            return Array.from(practicePickerOverlay.querySelectorAll(
                'button:not([disabled]), [href], input:not([disabled]), [tabindex]:not([tabindex="-1"])'
            )).filter((node) => !node.hidden);
        }

        function showPracticePicker() {
            practicePickerReturnFocus = document.activeElement instanceof HTMLElement
                ? document.activeElement
                : null;
            practicePickerOverlay.classList.add('is-open');
            practicePickerOverlay.setAttribute('aria-hidden', 'false');
            document.body.classList.add('practice-picker-open');
            window.requestAnimationFrame(() => {
                const firstOption = practicePickerOptionsNode.querySelector('button:not([disabled])');
                (firstOption || practicePickerCloseBtn)?.focus();
            });
        }

        function closePracticePicker(restoreFocus = true) {
            const wasOpen = practicePickerOverlay.classList.contains('is-open');
            practicePickerContext = null;
            practicePickerOverlay.classList.remove('is-open');
            practicePickerOverlay.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('practice-picker-open');
            if (wasOpen && restoreFocus && practicePickerReturnFocus?.isConnected) {
                window.requestAnimationFrame(() => practicePickerReturnFocus.focus());
            }
            practicePickerReturnFocus = null;
        }

        function launchPracticeFromPicker(type) {
            if (!practicePickerContext) {
                closePracticePicker();
                return;
            }
            if (Number(practicePickerContext.params && practicePickerContext.params.day) === -1 && getPracticeOptionReviewCount(type) <= 0) {
                return;
            }
            setStoredPracticeType(type);
            window.location.href = buildPracticeUrl(practicePickerContext.params, type);
        }

        function launchReviewActionFromPicker(action) {
            if (!practicePickerContext) {
                closePracticePicker();
                return;
            }
            if (action === 'keywords') {
                if (getReviewWordCount() <= 0) return;
                closePracticePicker();
                selectStarredWords();
                return;
            }
            if (action === 'sentence') {
                if (getSentenceReviewQuestionCount() <= 0) return;
                setStoredPracticeType('sentence');
                window.location.href = buildPracticeUrl(practicePickerContext.params, 'sentence');
            }
        }

        function openPracticePicker(params) {
            const pickerMeta = buildPracticePickerMeta(params);
            practicePickerContext = {
                params: { ...(params || {}) },
                meta: pickerMeta
            };
            document.getElementById('practice-picker-title').textContent = pickerMeta.title;
            const isReviewPicker = Number(practicePickerContext.params.day) === -1;
            if (isReviewPicker) {
                const keywordCount = getReviewWordCount();
                const sentenceCount = getSentenceReviewQuestionCount();
                const reviewOptions = [
                    {
                        id: 'keywords',
                        label: '看错关键词',
                        countLabel: keywordCount > 0 ? `${keywordCount} 词待确认` : '暂无看错关键词',
                        disabled: keywordCount <= 0
                    },
                    {
                        id: 'sentence',
                        label: '句子题回放',
                        countLabel: sentenceCount > 0 ? `${sentenceCount} 题待回放` : '暂无句子错题',
                        disabled: sentenceCount <= 0
                    }
                ];
                practicePickerOptionsNode.innerHTML = reviewOptions.map((option) => `
                <button
                    type="button"
                    class="practice-picker-option ${option.disabled ? 'is-disabled' : ''}"
                    data-review-action="${option.id}"
                    ${option.disabled ? 'disabled' : ''}
                >
                    <span class="practice-picker-option-title">${escapeHtml(option.label)}</span>
                    <span class="practice-picker-option-count">${escapeHtml(option.countLabel)}</span>
                </button>
            `).join('');
                practicePickerOptionsNode.querySelectorAll('[data-review-action]').forEach((node) => {
                    node.addEventListener('click', () => launchReviewActionFromPicker(node.dataset.reviewAction));
                });
                showPracticePicker();
                return;
            }
            practicePickerOptionsNode.innerHTML = PRACTICE_TYPE_OPTIONS.map((option) => `
                <button
                    type="button"
                    class="practice-picker-option"
                    data-picker-type="${option.id}"
                >
                    <span class="practice-picker-option-copy">
                        <span class="practice-picker-option-title">${escapeHtml(option.label)}</span>
                        <span class="practice-picker-option-sub">${escapeHtml(option.hint)}</span>
                    </span>
                </button>
            `).join('');
            practicePickerOptionsNode.querySelectorAll('[data-picker-type]').forEach((node) => {
                node.addEventListener('click', () => launchPracticeFromPicker(node.dataset.pickerType));
            });
            showPracticePicker();
        }

        function startPractice(dayId) {
            if (Number(dayId) === -1) {
                startReviewPractice();
                return;
            }
            openPracticePicker({ day: dayId });
        }

        function startStagePractice(stageId) {
            openPracticePicker({ stage: stageId });
        }

        function startFinalPractice() {
            openPracticePicker({ mode: 'final' });
        }

        function startReviewPractice() {
            if (getReviewWordCount() === 0 && getSentenceReviewQuestionCount() === 0) {
                alert('太棒啦！错题本目前是空的哦，继续保持！');
                return;
            }
            openPracticePicker({ day: -1 });
        }

        function selectStarredWords() {
            const reviewableWords = getReviewableWords();
            if (reviewableWords.length === 0) {
                alert('太棒啦！错题本目前是空的哦，继续保持！');
                return;
            }
            currentDay = -1;
            currentDailyWords = reviewableWords;
            currentWordIndex = 0;
            wordIndexScrollTop = 0;
            currentView = 'detail';
            renderDetailCard();
            updateUI();
        }

        function renderDays() {
            const reviewWordCount = getReviewWordCount();
            const sentenceReviewQuestionCount = getSentenceReviewQuestionCount();
            const totalDaysCount = CURRICULUM_DAYS.length || 9;
            const lastDay = Math.min(Math.max(Number(getLastStudiedDay()) || 1, 1), totalDaysCount);
            const currentDayData = getCurriculumDay(lastDay);
            const currentUnitTitle = currentDayData && currentDayData.title
                ? currentDayData.title
                : `${lastDay}日目`;
            const currentGroupTitle = currentDayData && currentDayData.groupTitle
                ? currentDayData.groupTitle
                : '擬声語・擬態語';
            const userName = getPetSystemUserName();
            const greetingText = userName
                ? `今天也一起学习吧，${userName}！`
                : '今天也一起学习吧！';
            const pendingReviewCount = reviewWordCount + sentenceReviewQuestionCount;
            const stages = CURRICULUM_STAGES.length > 0
                ? CURRICULUM_STAGES
                : [{
                    id: 1,
                    groupTitle: '擬声語・擬態語',
                    dayIds: Array.from({ length: totalDaysCount }, (_, index) => index + 1)
                }];

            const stagesHtml = stages.map((stage, stageIndex) => {
                const dayIds = Array.isArray(stage.dayIds) ? stage.dayIds : [];
                const startDayId = dayIds[0] || 1;
                const endDayId = dayIds[dayIds.length - 1] || startDayId;
                const startDayData = getCurriculumDay(startDayId);
                const endDayData = getCurriculumDay(endDayId);
                const startDayTitle = startDayData && startDayData.title ? startDayData.title : `${startDayId}日目`;
                const endDayTitle = endDayData && endDayData.title ? endDayData.title : `${endDayId}日目`;
                const stageDayRange = startDayId === endDayId
                    ? startDayTitle
                    : `${startDayTitle} 至 ${endDayTitle}`;
                const stageName = String(stage.groupTitle || stage.title || '擬声語・擬態語');
                const stageWordCount = dayIds.reduce((total, dayId) => {
                    const day = getCurriculumDay(dayId);
                    return total + (day && Array.isArray(day.wordIds) ? day.wordIds.length : 0);
                }, 0);
                const stageQuestionCount = Math.min(20, stageWordCount);
                const unitsHtml = dayIds.map((dayId) => {
                    const day = getCurriculumDay(dayId);
                    const fallbackCount = typeof WORDS_PER_DAY !== 'undefined' ? WORDS_PER_DAY : 10;
                    const wordCount = day && Array.isArray(day.wordIds) ? day.wordIds.length : fallbackCount;
                    const unitTitle = day && day.title ? day.title : `${dayId}日目`;
                    const unitOrder = day && Number(day.dayNumber) > 0 ? Number(day.dayNumber) : dayId;
                    const isCurrent = dayId === lastDay;
                    return `
                        <button type="button" class="curriculum-unit ${isCurrent ? 'is-current' : ''}" data-directory-day="${dayId}">
                            <span class="curriculum-unit-order">${String(unitOrder).padStart(2, '0')}</span>
                            <span class="curriculum-unit-copy">
                                <strong>${escapeHtml(unitTitle)}</strong>
                            </span>
                            <span class="curriculum-unit-count">${wordCount} 词</span>
                            <span class="curriculum-unit-state">${isCurrent ? '当前' : '›'}</span>
                        </button>
                    `;
                }).join('');

                return `
                    <section class="curriculum-stage">
                        <header class="curriculum-stage-header">
                            <span class="curriculum-stage-number">${String(stageIndex + 1).padStart(2, '0')}</span>
                            <div class="curriculum-stage-copy">
                                <small>大分類</small>
                                <h3>${escapeHtml(stageName)}</h3>
                            </div>
                            <button
                                type="button"
                                class="curriculum-stage-practice"
                                data-directory-stage="${stage.id}"
                                aria-label="开始${escapeHtml(stageName)}阶段练习，${escapeHtml(stageDayRange)}，共 ${stageQuestionCount} 题"
                            >阶段练习</button>
                        </header>
                        <div class="curriculum-unit-grid">
                            ${unitsHtml}
                        </div>
                    </section>
                `;
            }).join('');

            daysView.innerHTML = `
                <section class="directory-heading" aria-labelledby="directory-title">
                    <span class="directory-mentor-portrait" role="img" aria-hidden="true"></span>
                    <button type="button" class="directory-heading-copy" data-continue-day="${lastDay}">
                        <small>阳葵</small>
                        <h2 id="directory-title">${escapeHtml(greetingText)}</h2>
                        <span class="directory-current-unit">
                            <span>继续学习</span>
                            <strong>${escapeHtml(currentGroupTitle)} · ${escapeHtml(currentUnitTitle)}</strong>
                            <b>›</b>
                        </span>
                    </button>
                </section>

                <button type="button" class="directory-review ${pendingReviewCount > 0 ? '' : 'is-empty'}" data-directory-review ${pendingReviewCount > 0 ? '' : 'disabled'}>
                    <span class="directory-review-marker" aria-hidden="true"></span>
                    <span class="directory-review-copy">
                        <strong>错题库</strong>
                        <small>${pendingReviewCount > 0 ? `${pendingReviewCount} 项内容等待复盘` : '目前没有需要复盘的内容'}</small>
                    </span>
                    <span class="directory-review-action">${pendingReviewCount > 0 ? '查看错题' : '状态良好'} <b>›</b></span>
                </button>

                <div class="directory-section-heading">
                    <div>
                        <h2>学習日程</h2>
                    </div>
                    <p>学習する日を選択</p>
                </div>

                <div class="curriculum-stage-list">
                    ${stagesHtml}
                </div>
            `;

            daysView.querySelectorAll('[data-directory-day]').forEach((button) => {
                button.addEventListener('click', () => selectDay(Number(button.dataset.directoryDay)));
            });
            daysView.querySelectorAll('[data-directory-stage]').forEach((button) => {
                button.addEventListener('click', () => startStagePractice(Number(button.dataset.directoryStage)));
            });
            daysView.querySelector('[data-continue-day]')?.addEventListener('click', (event) => {
                selectDay(Number(event.currentTarget.dataset.continueDay));
            });
            daysView.querySelector('[data-directory-review]')?.addEventListener('click', startReviewPractice);
        }

        function selectDay(dayId) {
            directoryScrollY = window.scrollY;
            setLastStudiedDay(dayId);
            currentDay = dayId;
            currentDailyWords = getDayWords(dayId);
            currentWordIndex = 0;
            wordIndexScrollTop = 0;
            currentView = 'detail';
            renderDetailCard();
            updateUI();
        }

        function renderWordList(words) {
            const container = document.getElementById('word-list-container');
            container.innerHTML = '';
            const isReviewKeywordList = currentDay === -1;

            if (words.length === 0) {
                container.innerHTML = `
                    <div style="padding:42px 20px; text-align:center; color:var(--text-dim); font-weight:700; line-height:1.8;">
                        ${isReviewKeywordList ? '看错关键词已经清空。句子题如果还有待回放，可以从错题库入口继续复盘。' : '这一组词条还在整理中。'}
                    </div>
                `;
                window.scrollTo(0, 0);
                return;
            }

            words.forEach((wordData, index) => {
                const item = document.createElement('div');
                item.className = 'word-list-item';
                const wordId = wordData.word;
                const isStarred = safeGetItem(getVocabStarKey(wordId)) === 'true';
                const actionClass = isReviewKeywordList ? 'active review-remove' : (isStarred ? 'active' : '');
                const actionLabel = isReviewKeywordList ? '移出' : '🔖';
                const actionTitle = isReviewKeywordList ? '移出错题词' : '加入错题本';
                const sentenceMistakeCount = getSentenceMistakeCountForWord(wordData);
                const sentenceMistakeHtml = sentenceMistakeCount > 0
                    ? `<div style="font-size:12px; font-weight:600; color: var(--text-dim); line-height:1.5;">句子错 ${sentenceMistakeCount} 次</div>`
                    : '';
                item.innerHTML = `
                    <div style="min-width:0; display:flex; flex-direction:column; gap:4px;">
                        <div class="list-word-text">${wordData.word_html || wordData.word}</div>
                        ${sentenceMistakeHtml}
                    </div>
                    <div class="list-actions">
                        <div class="mark-btn ${actionClass}" data-word="${escapeHtml(wordId)}" title="${actionTitle}" aria-label="${actionTitle}">${actionLabel}</div>
                        <div class="list-arrow">›</div>
                    </div>
                `;
                item.addEventListener('click', (event) => {
                    const btn = event.target.closest('.mark-btn');
                    if (btn) {
                        event.stopPropagation();
                        toggleMark(btn, wordId);
                        return;
                    }
                    openWordDetail(index);
                });
                container.appendChild(item);
            });

            window.scrollTo(0, 0);
        }

        function toggleMark(button, wordId) {
            if (currentDay === -1) {
                dismissReviewKeyword(wordId);
                refreshReviewKeywordListAfterDismiss();
                return;
            }
            const storageKey = getVocabStarKey(wordId);
            const nextActive = safeGetItem(storageKey) !== 'true';
            if (nextActive) {
                safeSetItem(storageKey, 'true');
                if (reviewStore && typeof reviewStore.restoreKeyword === 'function') {
                    getReviewKeywordIds(wordId).forEach((id) => reviewStore.restoreKeyword(SENTENCE_REVIEW_MODULE_KEY, id));
                }
            } else {
                safeRemoveItem(storageKey);
            }
            button.classList.toggle('active', nextActive);
        }

        function restorePronounceButton(button) {
            if (!button) return;
            button.classList.remove('is-playing');
            button.textContent = '发音';
        }

        function stopVocabularyPlayback() {
            const audio = activeVocabularyAudio;
            const button = activePronounceButton;
            activeVocabularyAudio = null;
            activeSpeechUtterance = null;
            activePronounceButton = null;

            if (audio) {
                audio.pause();
                audio.currentTime = 0;
            }
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            restorePronounceButton(button);
        }

        function playSystemVocabularyWord(word, button) {
            const synth = window.speechSynthesis;
            if (!synth || typeof window.SpeechSynthesisUtterance !== 'function') {
                alert('当前浏览器暂不支持词汇发音。');
                restorePronounceButton(button);
                return;
            }

            synth.cancel();
            const utterance = new window.SpeechSynthesisUtterance(String(word || '').trim());
            const japaneseVoice = synth.getVoices().find((voice) => /^ja(?:-|_)/i.test(voice.lang));
            utterance.lang = 'ja-JP';
            utterance.rate = 0.82;
            utterance.pitch = 1;
            if (japaneseVoice) {
                utterance.voice = japaneseVoice;
            }

            const restoreButton = () => {
                if (activeSpeechUtterance !== utterance) return;
                activeSpeechUtterance = null;
                activePronounceButton = null;
                restorePronounceButton(button);
            };

            activeSpeechUtterance = utterance;
            activePronounceButton = button;
            button.classList.add('is-playing');
            button.textContent = '播放中';
            utterance.addEventListener('end', restoreButton, { once: true });
            utterance.addEventListener('error', restoreButton, { once: true });
            synth.speak(utterance);
        }

        function playLocalVocabularyAudio(entry, word, button) {
            const audio = new window.Audio(entry.src);
            let fallbackStarted = false;

            const finishPlayback = () => {
                if (activeVocabularyAudio !== audio) return;
                activeVocabularyAudio = null;
                activePronounceButton = null;
                restorePronounceButton(button);
            };
            const fallbackToSystemVoice = () => {
                if (fallbackStarted || activeVocabularyAudio !== audio) return;
                fallbackStarted = true;
                audio.pause();
                activeVocabularyAudio = null;
                activePronounceButton = null;
                restorePronounceButton(button);
                playSystemVocabularyWord(word, button);
            };

            audio.preload = 'auto';
            activeVocabularyAudio = audio;
            activePronounceButton = button;
            button.classList.add('is-playing');
            button.textContent = '播放中';
            audio.addEventListener('ended', finishPlayback, { once: true });
            audio.addEventListener('error', fallbackToSystemVoice, { once: true });

            const playPromise = audio.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(fallbackToSystemVoice);
            }
        }

        function getMimeticSpokenForm(wordData) {
            const practiceAnswer = String(wordData && wordData.practice && wordData.practice.answer || '').trim();
            return practiceAnswer || String(wordData && wordData.word || '').trim();
        }

        function speakVocabularyWord(wordData, button) {
            if (activePronounceButton === button && button.classList.contains('is-playing')) {
                stopVocabularyPlayback();
                return;
            }

            stopVocabularyPlayback();
            const localAudio = LOCAL_AUDIO_BY_WORD_ID.get(Number(wordData && wordData.id));
            const spokenForm = getMimeticSpokenForm(wordData);
            if (localAudio && typeof window.Audio === 'function') {
                playLocalVocabularyAudio(localAudio, spokenForm, button);
                return;
            }
            playSystemVocabularyWord(spokenForm, button);
        }

        function openWordDetail(index) {
            currentWordIndex = index;
            currentView = 'detail';
            renderDetailCard();
            updateUI();
        }

        function restoreWordIndexPosition(container) {
            const wordList = container.querySelector('.study-word-list');
            if (!wordList) return;

            wordList.scrollTop = wordIndexScrollTop;
            if (!isWordIndexCollapsed) {
                const selectedWord = wordList.querySelector('.study-word-link.is-selected');
                if (selectedWord) {
                    const listRect = wordList.getBoundingClientRect();
                    const selectedRect = selectedWord.getBoundingClientRect();
                    if (selectedRect.top < listRect.top) {
                        wordList.scrollTop -= listRect.top - selectedRect.top;
                    } else if (selectedRect.bottom > listRect.bottom) {
                        wordList.scrollTop += selectedRect.bottom - listRect.bottom;
                    }
                }
            }
            wordIndexScrollTop = wordList.scrollTop;
        }

        function renderDetailCard() {
            stopVocabularyPlayback();
            const container = document.getElementById('word-detail-view');
            const previousWordList = container.querySelector('.study-word-list');
            if (previousWordList) {
                wordIndexScrollTop = previousWordList.scrollTop;
            }
            const wordData = currentDailyWords[currentWordIndex];
            if (!wordData) return;

            const toneHtml = wordData.tone ? `<span class="study-tone">${escapeHtml(wordData.tone)}</span>` : '';
            const posHtml = wordData.pos ? `<span class="study-pos">${escapeHtml(wordData.pos)}</span>` : '';
            const meanings = wordData.mean ? wordData.mean.split(/[；;]/).map((item) => item.trim()).filter(Boolean) : [];
            const nuances = wordData.nuance
                ? wordData.nuance.split('\n').map((line) => line.trim().replace(/^\d+\.\s*/, '')).filter(Boolean)
                : [];
            const examples = Array.isArray(wordData.examples) ? wordData.examples : [];
            const count = Math.max(meanings.length, nuances.length, examples.length);
            const isReviewKeywordList = currentDay === -1;
            const isTemporaryUnit = currentDay === -2;
            const isReviewStyleUnit = isReviewKeywordList || isTemporaryUnit;
            const dayData = isReviewStyleUnit ? null : getCurriculumDay(currentDay);
            const unitTitle = isTemporaryUnit ? '本次错词复习' : (isReviewKeywordList ? '看错关键词' : (dayData && dayData.title ? dayData.title : `${currentDay}日目`));
            const unitLabel = isTemporaryUnit ? '临时单元' : (isReviewKeywordList
                ? 'N1 擬声語・擬態語 · 错题库'
                : `N1 · ${dayData && dayData.groupTitle ? dayData.groupTitle : '擬声語・擬態語'}`);
            const coreText = window.VocabularyMemoryHint
                ? window.VocabularyMemoryHint.buildHint(wordData, 'himari')
                : (nuances[0] || meanings.join('；') || '先抓住声音、动作或状态带来的画面感。');
            const directoryTitle = isTemporaryUnit ? '本次错词' : (isReviewKeywordList ? '错题词汇' : '本日词汇');
            const progress = currentDailyWords.length > 0
                ? Math.round(((currentWordIndex + 1) / currentDailyWords.length) * 100)
                : 0;

            const wordListHtml = currentDailyWords.map((word, index) => `
                <button
                    type="button"
                    class="study-word-link ${index === currentWordIndex ? 'is-selected' : ''}"
                    data-study-word-index="${index}"
                    ${index === currentWordIndex ? 'aria-current="page"' : ''}
                >
                    ${word.word_html || escapeHtml(word.word)}
                </button>
            `).join('');

            let definitionsHtml = '';
            for (let index = 0; index < count; index += 1) {
                const meanText = meanings[index] || (meanings.length === 1 && index === 0 ? meanings[0] : '');
                const nuanceText = nuances[index] || '';
                const example = examples[index];

                definitionsHtml += `
                    <div class="study-usage-group">
                        <div class="study-usage-number">${String(index + 1).padStart(2, '0')}</div>
                        <div>
                            <div class="study-usage-copy">
                                ${meanText ? `<strong class="hide-target">${escapeHtml(meanText)}</strong>` : '<strong>典型用法</strong>'}
                                ${nuanceText ? `<span class="hide-target">${escapeHtml(nuanceText)}</span>` : ''}
                            </div>
                            ${example ? `
                                <div class="study-example">
                                    <p class="study-example-jp" lang="ja">${example.jp}</p>
                                    <span class="hide-target study-example-cn">${escapeHtml(example.cn)}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }

            const isFirst = currentWordIndex === 0;
            const isLast = currentWordIndex === currentDailyWords.length - 1;
            const wordId = wordData.word;
            const isStarred = safeGetItem(getVocabStarKey(wordId)) === 'true';
            const actionClass = isReviewKeywordList ? 'active review-remove' : (isStarred ? 'active' : '');
            const actionLabel = isReviewKeywordList ? '移出错题库' : (isStarred ? '★ 已收藏' : '☆ 收藏');
            const actionTitle = isReviewKeywordList ? '移出错题词' : '加入错题本';
            const spokenForm = getMimeticSpokenForm(wordData);

            container.innerHTML = `
                <div class="study-unit-line">
                    <div class="study-unit-copy">
                        <span class="study-unit-label">${escapeHtml(unitLabel)}</span>
                        <strong class="study-unit-title">${escapeHtml(unitTitle)}</strong>
                    </div>
                    <div class="study-unit-progress" aria-label="词汇进度 ${currentWordIndex + 1}/${currentDailyWords.length}">
                        <span>${currentWordIndex + 1} / ${currentDailyWords.length}</span>
                        <i class="study-progress-track"><span style="width:${progress}%"></span></i>
                    </div>
                </div>

                <section class="study-workspace ${isWordIndexCollapsed ? 'is-index-collapsed' : ''}">
                    <aside class="study-word-index">
                        <div class="study-index-header">
                            <div class="study-index-title">
                                <strong>${escapeHtml(directoryTitle)}</strong>
                                <span>${currentDailyWords.length} 词</span>
                            </div>
                            <button
                                type="button"
                                class="study-index-toggle"
                                data-index-toggle
                                aria-expanded="${isWordIndexCollapsed ? 'false' : 'true'}"
                                aria-label="${isWordIndexCollapsed ? '展开词汇目录' : '收起词汇目录'}"
                                title="${isWordIndexCollapsed ? '展开词汇目录' : '收起词汇目录'}"
                            >${isWordIndexCollapsed ? '›' : '‹'}</button>
                        </div>
                        <nav class="study-word-list" aria-label="${escapeHtml(directoryTitle)}">
                            ${wordListHtml}
                        </nav>
                    </aside>

                    <article class="study-detail-panel">
                        <header class="study-word-header">
                            <div class="study-word-title-row">
                                <div class="study-word-title">
                                    <h2>${wordData.word_html || escapeHtml(wordData.word)}</h2>
                                    <div>
                                        ${toneHtml}
                                        ${posHtml}
                                    </div>
                                    <button type="button" class="study-pronounce" data-study-pronounce aria-label="播放 ${escapeHtml(spokenForm)} 的日语发音">发音</button>
                                </div>
                                <button type="button" class="detail-save ${actionClass}" data-detail-mark title="${actionTitle}" aria-label="${actionTitle}">${actionLabel}</button>
                            </div>
                        </header>

                        <section class="study-usage-section">
                            <div class="study-section-heading">
                                <h3>用法与例句</h3>
                                <p>从声音、动作和状态中建立画面感</p>
                            </div>
                            ${definitionsHtml || '<div class="study-usage-group"><div class="study-usage-number">01</div><div class="study-usage-copy"><span>内容整理中</span></div></div>'}
                        </section>

                        <aside class="study-mentor-note">
                            <img src="icon/qingmei-cutout.png?v=20260730" alt="" aria-hidden="true" onerror="this.hidden=true">
                            <div>
                                <strong>阳葵的记忆提示</strong>
                                <p>${escapeHtml(coreText)}</p>
                            </div>
                        </aside>

                        <footer class="study-detail-footer">
                            <button type="button" data-study-nav="-1" ${isFirst ? 'disabled' : ''}>‹ 上一词${!isFirst ? `　${escapeHtml(currentDailyWords[currentWordIndex - 1].word)}` : ''}</button>
                            <span>第 ${currentWordIndex + 1} 个，共 ${currentDailyWords.length} 个</span>
                            <button type="button" data-study-nav="1" ${isReviewStyleUnit && isLast ? 'disabled' : ''}>${isLast && !isReviewStyleUnit ? '完成并练习' : `下一词${!isLast ? `　${escapeHtml(currentDailyWords[currentWordIndex + 1].word)}` : ''} ›`}</button>
                        </footer>
                    </article>
                </section>
            `;

            restoreWordIndexPosition(container);
            container.querySelectorAll('[data-study-word-index]').forEach((button) => {
                button.addEventListener('click', () => openWordDetail(Number(button.dataset.studyWordIndex)));
            });
            container.querySelector('[data-index-toggle]')?.addEventListener('click', (event) => {
                isWordIndexCollapsed = !isWordIndexCollapsed;
                safeSetItem(INDEX_COLLAPSED_STORAGE_KEY, String(isWordIndexCollapsed));
                const workspace = container.querySelector('.study-workspace');
                workspace?.classList.toggle('is-index-collapsed', isWordIndexCollapsed);
                event.currentTarget.textContent = isWordIndexCollapsed ? '›' : '‹';
                event.currentTarget.setAttribute('aria-expanded', isWordIndexCollapsed ? 'false' : 'true');
                event.currentTarget.setAttribute('aria-label', isWordIndexCollapsed ? '展开词汇目录' : '收起词汇目录');
                event.currentTarget.setAttribute('title', isWordIndexCollapsed ? '展开词汇目录' : '收起词汇目录');
            });
            container.querySelector('[data-detail-mark]')?.addEventListener('click', (event) => {
                toggleMark(event.currentTarget, wordId);
                if (!isReviewKeywordList) {
                    renderDetailCard();
                }
            });
            container.querySelector('[data-study-pronounce]')?.addEventListener('click', (event) => {
                speakVocabularyWord(wordData, event.currentTarget);
            });
            container.querySelectorAll('[data-study-nav]').forEach((button) => {
                button.addEventListener('click', () => {
                    const direction = Number(button.dataset.studyNav);
                    if (isLast && direction === 1 && !isReviewStyleUnit) {
                        startPractice(currentDay);
                        return;
                    }
                    navigateWord(direction);
                });
            });
        }

        function navigateWord(direction) {
            const nextIndex = currentWordIndex + direction;
            if (nextIndex >= 0 && nextIndex < currentDailyWords.length) {
                currentWordIndex = nextIndex;
                renderDetailCard();
            }
        }

        function configureBackButton(label, href) {
            backBtn.setAttribute('href', href);
            backBtn.setAttribute('aria-label', label);
            backBtn.innerHTML = `${BACK_ICON_HTML} ${label}`;
        }

        function returnToVocabularyDirectory() {
            currentView = 'days';
            renderDays();
            updateUI();
            window.requestAnimationFrame(() => {
                window.scrollTo({ top: directoryScrollY, behavior: 'auto' });
            });
        }

        function handleBackNavigation(event) {
            event.preventDefault();
            event.stopImmediatePropagation();
            if (isBackNavigationLocked) return;
            isBackNavigationLocked = true;
            if (currentView === 'days') {
                window.location.assign(N1_VOCABULARY_HOME_HREF);
                return;
            }
            returnToVocabularyDirectory();
            window.setTimeout(() => {
                isBackNavigationLocked = false;
            }, 300);
        }

        function handleHeaderPracticeClick() {
            if (currentView !== 'list' && currentView !== 'detail') return;
            if (currentDay === -2) return;
            if (currentDay === -1) {
                startReviewPractice();
                return;
            }
            startPractice(currentDay);
        }

        function updateUI() {
            if (currentView !== 'detail') {
                stopVocabularyPlayback();
                setFontSizeDrawerOpen(false);
            }
            daysView.classList.add('hidden');
            wordListView.classList.add('hidden');
            wordDetailView.classList.add('hidden');
            document.body.classList.toggle('study-detail-active', currentView === 'detail');
            document.body.classList.toggle('study-days-active', currentView === 'days');

            if (headerPracticeBtn) {
                headerPracticeBtn.hidden = true;
            }

            if (currentView === 'days') {
                daysView.classList.remove('hidden');
                pageTitle.textContent = 'N1 擬声語・擬態語';
                configureBackButton('返回词汇入口', N1_VOCABULARY_HOME_HREF);
                return;
            }

            if (currentView === 'list') {
                wordListView.classList.remove('hidden');
                pageTitle.textContent = currentDay === -1 ? '错题合集' : `${getCurriculumDay(currentDay)?.title || `${currentDay}日目`}`;
                if (currentDailyWords.length > 0) {
                    renderWordList(currentDailyWords);
                }
                if (headerPracticeBtn) {
                    headerPracticeBtn.textContent = currentDay === -1 ? '错题练习' : '今日练习';
                    headerPracticeBtn.hidden = currentDay === -2;
                }
                configureBackButton('返回目录', VOCABULARY_DIRECTORY_HREF);
                return;
            }

            wordDetailView.classList.remove('hidden');
            pageTitle.textContent = 'N1 擬声語・擬態語';
            if (headerPracticeBtn) {
                headerPracticeBtn.textContent = currentDay === -1 ? '错题练习' : '练习';
                headerPracticeBtn.hidden = currentDay === -2;
            }
            configureBackButton('返回目录', VOCABULARY_DIRECTORY_HREF);
        }

        document.addEventListener('click', (event) => {
            const dynamicBack = event.target instanceof Element
                ? event.target.closest('#back-btn[data-kiki-dynamic-back]')
                : null;
            if (!dynamicBack) return;
            handleBackNavigation(event);
        }, true);
        headerPracticeBtn?.addEventListener('click', handleHeaderPracticeClick);
        applyDetailFontSize(currentDetailFontSize, false);
        detailFontSizeButtons.forEach((button) => {
            button.addEventListener('click', () => {
                applyDetailFontSize(button.dataset.detailFontSize);
                setFontSizeDrawerOpen(false);
                fontSizeTrigger?.focus();
            });
        });
        fontSizeTrigger?.addEventListener('click', () => {
            const shouldOpen = !fontSizeControl.classList.contains('is-open');
            setFontSizeDrawerOpen(shouldOpen, shouldOpen);
        });
        document.addEventListener('click', (event) => {
            if (fontSizeControl && !fontSizeControl.contains(event.target)) {
                setFontSizeDrawerOpen(false);
            }
        });

        migrateLegacyProgress();
        const temporaryUnitWords = window.VocabularyTemporaryUnit && window.VocabularyTemporaryUnit.isRequested()
            ? window.VocabularyTemporaryUnit.resolve(SENTENCE_REVIEW_MODULE_KEY, FULL_WORD_LIST, getWordStorageId)
            : [];
        if (temporaryUnitWords.length) {
            currentDay = -2;
            currentDailyWords = temporaryUnitWords;
            currentWordIndex = 0;
            wordIndexScrollTop = 0;
            currentView = 'detail';
            renderDetailCard();
        } else {
            renderDays();
        }
        updateUI();

        if (practicePickerCloseBtn) {
            practicePickerCloseBtn.addEventListener('click', closePracticePicker);
        }
        if (practicePickerOverlay) {
            practicePickerOverlay.addEventListener('click', (event) => {
                if (event.target === practicePickerOverlay) {
                    closePracticePicker();
                }
            });
        }
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && practicePickerOverlay.classList.contains('is-open')) {
                closePracticePicker();
                return;
            }
            if (event.key === 'Tab' && practicePickerOverlay.classList.contains('is-open')) {
                const focusableNodes = getPracticePickerFocusableNodes();
                if (focusableNodes.length > 0) {
                    const firstNode = focusableNodes[0];
                    const lastNode = focusableNodes[focusableNodes.length - 1];
                    if (event.shiftKey && (document.activeElement === firstNode || !practicePickerOverlay.contains(document.activeElement))) {
                        event.preventDefault();
                        lastNode.focus();
                    } else if (!event.shiftKey && document.activeElement === lastNode) {
                        event.preventDefault();
                        firstNode.focus();
                    }
                }
            }
            if (event.key === 'Escape' && fontSizeControl?.classList.contains('is-open')) {
                setFontSizeDrawerOpen(false);
                fontSizeTrigger?.focus();
            }
        });

        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        const minSwipeDistance = 50;

        document.addEventListener('touchstart', (event) => {
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
        }, false);

        document.addEventListener('touchend', (event) => {
            touchEndX = event.changedTouches[0].screenX;
            touchEndY = event.changedTouches[0].screenY;
            if (currentView !== 'detail') return;
            const distanceX = touchEndX - touchStartX;
            const distanceY = touchEndY - touchStartY;
            if (Math.abs(distanceX) > Math.abs(distanceY) && Math.abs(distanceX) > minSwipeDistance) {
                navigateWord(distanceX < 0 ? 1 : -1);
            }
        }, false);
    </script>
    <script src="../shared/vocabulary-level-switcher.js?v=20260808-1"></script>
    <script src="../../../shared/word-bank.js?v=20260808-vocab-pos1"></script>
    <script src="../../../shared/unified-header.js" data-kiki-unified-header-loader></script>
</body>
</html>

        function clearTypewriter(controllerName) {
            const controller = controllerName === 'intro' ? introTypingController : questionTypingController;
            if (controller && controller.timeoutId) {
                clearTimeout(controller.timeoutId);
            }
            if (controllerName === 'intro') {
                introTypingController = null;
            } else {
                questionTypingController = null;
            }
        }

        function runTypewriter({ controllerName, target, cursor, text, speed, onComplete }) {
            clearTypewriter(controllerName);
            target.innerText = '';
            cursor.className = 'typing-cursor';
            const controller = {
                index: 0,
                text,
                timeoutId: null,
                finished: false,
                finish() {
                    if (this.finished) return;
                    this.finished = true;
                    target.innerText = text;
                    cursor.className = '';
                    if (this.timeoutId) {
                        clearTimeout(this.timeoutId);
                    }
                    if (typeof onComplete === 'function') {
                        onComplete();
                    }
                }
            };

            function typeNext() {
                if (controller.finished) return;
                if (controller.index < text.length) {
                    target.innerText += text.charAt(controller.index);
                    controller.index += 1;
                    controller.timeoutId = setTimeout(typeNext, speed);
                } else {
                    controller.finished = true;
                    cursor.className = '';
                    if (typeof onComplete === 'function') {
                        onComplete();
                    }
                }
            }

            if (controllerName === 'intro') {
                introTypingController = controller;
            } else {
                questionTypingController = controller;
            }
            typeNext();
        }

        function finishCurrentTypewriter(controllerName) {
            const controller = controllerName === 'intro' ? introTypingController : questionTypingController;
            if (controller && typeof controller.finish === 'function') {
                controller.finish();
            }
        }

        function closePracticeFinishPopover(restoreFocus = true) {
            if (!practiceFinishPopover || practiceFinishPopover.hidden) return;
            practiceFinishPopover.hidden = true;
            practiceFinishTrigger?.setAttribute('aria-expanded', 'false');
            if (restoreFocus && practiceFinishReturnFocus?.isConnected && !practiceFinishTrigger?.hidden) {

        function openPracticeFinishPopover() {

            practiceFinishReturnFocus = document.activeElement instanceof HTMLElement
                ? document.activeElement
                : practiceFinishTrigger;
            practiceFinishPopover.hidden = false;
            practiceFinishTrigger.setAttribute('aria-expanded', 'true');

        document.addEventListener('click', closePracticeFinishPopover);
        document.addEventListener('keydown', (event) => {

            if (event.key === 'Tab' && practiceFinishPopover && !practiceFinishPopover.hidden) {
                const focusableNodes = getPracticeFinishFocusableNodes();
                if (focusableNodes.length > 0) {
                    const firstNode = focusableNodes[0];
                    const lastNode = focusableNodes[focusableNodes.length - 1];
                    if (event.shiftKey && (document.activeElement === firstNode || !practiceFinishPopover.contains(document.activeElement))) {
                        event.preventDefault();

                        event.preventDefault();

        function getReadingInputSlots(question = questions[currentQuestionIndex]) {
            const slots = [];
            const segments = Array.isArray(question && question.readingSegments)
                ? question.readingSegments
                : [];

            segments.forEach((segment, segmentIndex) => {
                if (!segment || segment.type !== 'input') return;
                splitKanaChars(segment.answer).forEach((answer, characterIndex) => {
                    slots.push({
                        answer,
                        segmentIndex,
                        characterIndex,
                        slotIndex: slots.length
                    });
                });
            });

            return slots;
        }

        function buildReadingAnswerMarkup(question) {
            let inputIndex = 0;
            const totalInputCount = getReadingInputSlots(question).length;
            let editableSegmentIndex = 0;
            const inputsHtml = (Array.isArray(question.readingSegments) ? question.readingSegments : []).map((segment, segmentIndex) => {
                if (!segment || segment.type !== 'input') {
                    return `<span class="reading-fixed-segment">${escapeHtml(segment && segment.text ? segment.text : '')}</span>`;
                }

                editableSegmentIndex += 1;
                const segmentInputs = splitKanaChars(segment.answer).map((unusedAnswer, characterIndex) => {
                    const currentIndex = inputIndex;
                    inputIndex += 1;
                    return `
                        <input
                            type="text"
                            lang="ja"
                            inputmode="kana"
                            enterkeyhint="done"
                            autocomplete="off"
                            autocapitalize="off"
                            spellcheck="false"
                            class="reading-char-input"
                            data-reading-index="${currentIndex}"
                            data-segment-index="${segmentIndex}"
                            data-character-index="${characterIndex}"
                            aria-label="第 ${currentIndex + 1} 个假名，共 ${totalInputCount} 个"
                            onfocus="handleReadingInputFocus(event)"
                            oncompositionstart="handleReadingCompositionStart(event)"
                            oncompositionend="handleReadingCompositionEnd(event, ${currentIndex})"
                            oninput="handleReadingInput(event, ${currentIndex})"
                            onkeydown="handleReadingKeyDown(event, ${currentIndex})"
                            onpaste="handleReadingPaste(event, ${currentIndex})"
                            onclick="handleReadingInputClick(event)"
                        >
                    `;
                }).join('');
                return `
                    <span
                        class="reading-input-segment"
                        role="group"
                        aria-label="第 ${editableSegmentIndex} 段读音"
                    >${segmentInputs}</span>
                `;
            }).join('');
            const wordLabel = getWordDisplayText(question && question.word) || '目标词汇';
            const hintDisabled = remainingHints <= 0;

            return `
                <div class="reading-answer-wrap">
                    <div
                        class="reading-input-grid"
                        id="reading-input-grid"
                        role="group"
                        aria-label="${escapeHtml(wordLabel)}的读音，共 ${totalInputCount} 个待填假名"
                    >${inputsHtml}</div>
                    <div class="reading-action-row">
                        <button
                            type="button"
                            class="reading-action-btn ${hintDisabled ? 'disabled' : ''}"
                            id="hint-btn"
                            onclick="useHint()"
                            ${hintDisabled ? 'disabled' : ''}
                        >请求提示 (${remainingHints})</button>
                        <button
                            type="button"
                            class="reading-action-btn disabled"
                            id="reading-submit-btn"
                            onclick="submitReadingAnswer()"
                            disabled
                        >确认提交</button>
                    </div>
                </div>
            `;
        }

        function getChoiceKanjiHintLabel(question, optionIndex) {
            if (!question || question.kind !== 'sentence') return '';
            const detail = Array.isArray(question.optionDetails) ? question.optionDetails[optionIndex] : null;
            const optionValue = String(question.options && question.options[optionIndex] || '').trim();
            const wordLabel = String(detail && detail.wordLabel || '').trim();
            if (!wordLabel || wordLabel === optionValue || !/[\u3400-\u9fff々]/u.test(wordLabel)) return '';
            return wordLabel;
        }

        function questionHasChoiceKanjiHints(question) {
            return Boolean(
                question &&
                Array.isArray(question.options) &&
                question.options.some((unusedOption, optionIndex) => getChoiceKanjiHintLabel(question, optionIndex))
            );
        }

        function buildChoiceAnswerMarkup(question) {
            const buttons = question.options.map((opt, optionIndex) => {
                const kanjiHint = getChoiceKanjiHintLabel(question, optionIndex);
                return `
                    <button type="button" class="action-option" data-option-index="${optionIndex}">
                        <span class="action-option-content">
                            <span class="action-option-primary">${escapeHtml(opt)}</span>
                            ${kanjiHint ? `<span class="action-option-kanji" hidden aria-hidden="true">${escapeHtml(kanjiHint)}</span>` : ''}
                        </span>
                    </button>
                `;
            }).join('');
            return `<div class="choice-grid">${buttons}</div>`;
        }

        function trimQuestionHtml(html) {
            return String(html || '').replace(/(?:<br>\s*)+$/g, '').trim();
        }

        function isOfficialQuestionSupportNode(node) {
            const text = String(node && node.textContent || '').replace(/\s+/g, '').trim();
            if (!text) return false;
            if (/^（.*）$/.test(text) || /^\(.*\)$/.test(text)) return false;
            return /结合语境|最合适|读音|假名|拼|写下|核心|词义|意思|辨析/.test(text);
        }

        function getQuestionDisplayModel(question) {
            if (!question) {
                return { asideText: '', questionHtml: '', supportHtml: '', typingText: '' };
            }
            if (question._displayModel) return question._displayModel;

            const wrapper = document.createElement('div');
            wrapper.innerHTML = question.questionHtml || '';

            const supportNodes = Array.from(wrapper.querySelectorAll('.question-sub-text'));
            const supportHtml = supportNodes.filter(isOfficialQuestionSupportNode).map((node) => node.outerHTML).join('');
            supportNodes.forEach((node) => node.remove());

            const typingText = String(question.typingText || '')
                .replace(/\r\n?/g, '\n')
                .split(/\n\s*\n/)[0]
                .trim();

            question._displayModel = {
                asideText: '',
                questionHtml: trimQuestionHtml(wrapper.innerHTML),
                supportHtml,
                typingText
            };
            return question._displayModel;
        }

        function setQuestionAside(text) {
            const asideNode = document.getElementById('question-aside');
            if (!asideNode) return;
            const nextText = String(text || '').trim();
            asideNode.textContent = nextText;
            asideNode.classList.toggle('hidden', !nextText);
        }

        function getReadingInputs() {
            return Array.from(document.querySelectorAll('.reading-char-input'));
        }

        function focusReadingInputAt(index) {
            const inputs = getReadingInputs();
            const input = inputs[index];
            if (!input || input.readOnly) return false;
            input.focus();
            input.select();
            return true;
        }

        function focusReadingInput(startIndex = 0) {
            const inputs = getReadingInputs();
            const resolvedStartIndex = Math.max(0, Number(startIndex) || 0);
            const focusTask = () => {
                for (let index = resolvedStartIndex; index < inputs.length; index += 1) {
                    if (focusReadingInputAt(index)) {
                        return;
                    }
                }
            };
            window.setTimeout(focusTask, 0);
        }

        function focusReadingInputAfterCommit(result) {
            if (!result || result.insertedCount <= 0) return;
            const inputs = getReadingInputs();
            if (result.nextIndex >= 0 && result.nextIndex < inputs.length) {
                focusReadingInput(result.nextIndex);
                return;
            }
            if (result.lastChangedIndex >= 0) {
                window.requestAnimationFrame(() => {
                    focusReadingInputAt(result.lastChangedIndex);
                });
            }
        }

        function handleReadingInputFocus(event) {
            const input = event.target;
            if (!input || input.readOnly) return;
            window.requestAnimationFrame(() => {
                if (!input.readOnly && document.activeElement === input) {
                    input.select();
                }
            });
        }

        function handleReadingInputClick(event) {
            const input = event.target;
            if (!input || !isAnswering || input.readOnly) return;
            window.requestAnimationFrame(() => {
                if (input.readOnly || document.activeElement !== input) return;
                input.focus();
                input.select();
            });
        }

        function handleReadingCompositionStart(event) {
            if (!event.target) return;
            event.target.dataset.composing = 'true';
            event.target.dataset.skipNextInput = 'false';
        }

        function handleReadingCompositionEnd(event, index) {
            const input = event.target;
            if (!input) return;
            input.dataset.composing = 'false';
            const result = commitReadingChars(index, input.value || event.data || '');
            input.dataset.skipNextInput = 'true';
            window.setTimeout(() => {
                if (input.dataset.skipNextInput === 'true') {
                    input.dataset.skipNextInput = 'false';
                }
            }, 0);
            updateReadingSubmitState();
            focusReadingInputAfterCommit(result);
        }

        function handleReadingInput(event, index) {
            const input = event.target;
            if (!input) return;
            if (event.isComposing || isReadingInputComposing(input)) {
                return;
            }
            if (input.dataset.skipNextInput === 'true') {
                input.dataset.skipNextInput = 'false';
                return;
            }
            const result = commitReadingChars(index, input.value);
            updateReadingSubmitState();
            focusReadingInputAfterCommit(result);
        }

        function handleReadingKeyDown(event, index) {
            if (event.isComposing || isReadingInputComposing(event.target)) {
                return;
            }
            if (event.key === 'Enter') {
                event.preventDefault();
                submitReadingAnswer();
                return;
            }

            const inputs = getReadingInputs();
            if (event.key === 'ArrowLeft') {
                const prevIndex = findPreviousEditableReadingIndex(inputs, index - 1);
                if (prevIndex !== -1) {
                    event.preventDefault();
                    focusReadingInputAt(prevIndex);
                }
                return;
            }
            if (event.key === 'ArrowRight') {
                const nextIndex = findNextEditableReadingIndex(inputs, index + 1);
                if (nextIndex !== -1) {
                    event.preventDefault();
                    focusReadingInputAt(nextIndex);
                }
                return;
            }
            if (event.key === 'Backspace') {
                event.preventDefault();
                if (event.target.value) {
                    event.target.value = '';
                    updateReadingSubmitState();
                    return;
                }
                const prevIndex = findPreviousEditableReadingIndex(inputs, index - 1);
                if (prevIndex !== -1) {
                    inputs[prevIndex].value = '';
                    focusReadingInputAt(prevIndex);
                }
                updateReadingSubmitState();
                return;
            }
            if (event.key === 'Delete') {
                event.preventDefault();
                event.target.value = '';
                updateReadingSubmitState();
            }
        }

        function handleReadingPaste(event, index) {
            event.preventDefault();
            const clipboard = event.clipboardData || window.clipboardData;
            const pastedText = clipboard ? clipboard.getData('text') : '';
            const result = commitReadingChars(index, pastedText);
            updateReadingSubmitState();
            focusReadingInputAfterCommit(result);
        }

        function findFirstIncompleteReadingIndex(question) {
            const inputs = getReadingInputs();
            const inputSlots = getReadingInputSlots(question);
            for (let index = 0; index < inputSlots.length; index += 1) {
                const currentChars = splitCommittedKanaChars(inputs[index] && inputs[index].value);
                if (currentChars.length !== 1) {
                    return index;
                }
            }
            return -1;
        }

        function updateReadingSubmitState(question = questions[currentQuestionIndex]) {
            const submitBtn = document.getElementById('reading-submit-btn');
            const grid = document.getElementById('reading-input-grid');
            if (!submitBtn || !question || question.answerMode !== 'input') return;
            const isComplete = findFirstIncompleteReadingIndex(question) === -1;
            submitBtn.disabled = !isComplete || !isAnswering;
            submitBtn.classList.toggle('disabled', submitBtn.disabled);
            submitBtn.setAttribute('aria-disabled', submitBtn.disabled ? 'true' : 'false');
            if (grid) {
                grid.classList.toggle('complete', isComplete);
            }
        }

        function collectReadingAnswer(question = questions[currentQuestionIndex]) {
            if (!question || !Array.isArray(question.readingSegments)) {
                return normalizeKanaAnswer(getReadingInputs().map((input) => input.value || '').join(''));
            }

            const inputs = getReadingInputs();
            let inputIndex = 0;
            const pieces = question.readingSegments.map((segment) => {
                if (!segment || segment.type !== 'input') {
                    return normalizeKanaAnswer(segment && segment.text);
                }
                const segmentLength = splitKanaChars(segment.answer).length;
                const value = inputs
                    .slice(inputIndex, inputIndex + segmentLength)
                    .map((input) => splitCommittedKanaChars(input && input.value)[0] || '')
                    .join('');
                inputIndex += segmentLength;
                return normalizeKanaAnswer(value);
            });

            return normalizeKanaAnswer(pieces.join(''));
        }

        function submitReadingAnswer() {
            if (!isAnswering) return;
            const question = questions[currentQuestionIndex];
            if (!question || question.answerMode !== 'input') return;
            if (getReadingInputs().some((input) => isReadingInputComposing(input))) return;
            const firstIncompleteIndex = findFirstIncompleteReadingIndex(question);
            if (firstIncompleteIndex !== -1) {
                focusReadingInput(firstIncompleteIndex);
                updateReadingSubmitState(question);
                return;
            }
            checkAnswer(null, collectReadingAnswer(question), false);
        }

        function useHint() {
            const question = questions[currentQuestionIndex];
            if (remainingHints <= 0 || !isAnswering || isHintUsed || !question || question.answerMode !== 'input') return;
            const inputs = getReadingInputs();
            const inputSlots = getReadingInputSlots(question);
            const hintIndex = inputs.findIndex((input) => (
                input &&
                !input.readOnly &&
                splitCommittedKanaChars(input.value).length === 0
            ));
            if (hintIndex === -1 || !inputSlots[hintIndex]) return;

            remainingHints -= 1;
            isHintUsed = true;
            const btn = document.getElementById('hint-btn');
            if (btn) {
                btn.textContent = `请求提示 (${remainingHints})`;
                btn.disabled = true;
                btn.classList.add('disabled');
                btn.setAttribute('aria-disabled', 'true');
            }
            inputs[hintIndex].value = inputSlots[hintIndex].answer;
            inputs[hintIndex].readOnly = true;
            inputs[hintIndex].classList.add('locked');
            inputs[hintIndex].setAttribute('aria-label', `${inputs[hintIndex].getAttribute('aria-label')}，提示已填入`);
            updateReadingSubmitState(question);

            const firstIncompleteIndex = findFirstIncompleteReadingIndex(question);
            if (firstIncompleteIndex !== -1) {
                focusReadingInput(firstIncompleteIndex);
            }
        }

        function useChoiceKanjiHint() {
            const question = questions[currentQuestionIndex];
            if (
                remainingHints <= 0 ||
                !isAnswering ||
                isHintUsed ||
                !questionHasChoiceKanjiHints(question)
            ) return;

            const hintNodes = Array.from(document.querySelectorAll('.action-option-kanji'));
            if (hintNodes.length === 0) return;

            remainingHints -= 1;
            isHintUsed = true;
            hintNodes.forEach((hintNode) => {
                hintNode.hidden = false;
                hintNode.setAttribute('aria-hidden', 'false');
            });
            updatePracticeQuestionFooter();
        }

        function hidePracticeQuestionFooter() {
            if (practiceQuestionFooter) {
                practiceQuestionFooter.classList.add('hidden');
            }
            if (practiceChoiceHintBtn) {
                practiceChoiceHintBtn.disabled = true;
            }
            if (practiceSkipBtn) {
                practiceSkipBtn.disabled = true;
            }
        }

        function updatePracticeQuestionFooter() {
            if (!practiceQuestionFooter || !practiceSkipBtn || !practiceChoiceHintBtn) return;
            const question = questions[currentQuestionIndex];
            const pendingQuestionCount = Math.max(0, questions.length - currentQuestionIndex);
            const canSkip = isAnswering && pendingQuestionCount > 1;
            const supportsChoiceHint = isAnswering && questionHasChoiceKanjiHints(question);
            const canUseChoiceHint = supportsChoiceHint && !isHintUsed && remainingHints > 0;
            const shouldShowFooter = isAnswering && (supportsChoiceHint || canSkip);

            practiceQuestionFooter.classList.toggle('hidden', !shouldShowFooter);
            practiceChoiceHintBtn.hidden = !supportsChoiceHint;
            practiceChoiceHintBtn.disabled = !canUseChoiceHint;
            practiceChoiceHintBtn.setAttribute('aria-disabled', canUseChoiceHint ? 'false' : 'true');
            if (practiceChoiceHintCount) {
                practiceChoiceHintCount.textContent = `${remainingHints} / ${MAX_SESSION_HINTS}`;
            }
            if (practiceQuestionFooterNote) {
                practiceQuestionFooterNote.hidden = !canSkip;
            }
            practiceSkipBtn.hidden = !canSkip;
            practiceSkipBtn.disabled = !canSkip;
        }

        function skipCurrentQuestion() {
            const pendingQuestionCount = Math.max(0, questions.length - currentQuestionIndex);
            if (!isAnswering || pendingQuestionCount <= 1) return;

            isAnswering = false;
            clearTimer();
            clearTypewriter('question');
            hidePracticeQuestionFooter();

            const skippedQuestions = questions.splice(currentQuestionIndex, 1);
            if (skippedQuestions.length === 0) return;
            questions.push(skippedQuestions[0]);
            renderQuestion();
        }

        function renderAnswerArea(question) {
            const answerArea = document.getElementById('challenge-answer-area');
            const feedback = document.getElementById('challenge-feedback');
            answerArea.classList.add('hidden');
            if (document.activeElement && typeof document.activeElement.blur === 'function') {
                document.activeElement.blur();
            }
            feedback.textContent = '';
            feedback.className = 'challenge-feedback';
            if (question.answerMode === 'input') {
                answerArea.innerHTML = buildReadingAnswerMarkup(question);
            } else {
                answerArea.innerHTML = buildChoiceAnswerMarkup(question);
                answerArea.querySelectorAll('.action-option[data-option-index]').forEach((buttonNode) => {
                    buttonNode.addEventListener('click', () => {
                        buttonNode.blur();
                        const selectedIndex = Number(buttonNode.dataset.optionIndex);
                        checkAnswer(buttonNode, question.options[selectedIndex]);
                    });
                });
            }
        }

        function revealCurrentQuestion() {
            const question = questions[currentQuestionIndex];
            const challengeQuestion = document.getElementById('challenge-question');
            const questionSupport = document.getElementById('question-support');
            const displayModel = getQuestionDisplayModel(question);

            setQuestionAside(displayModel.asideText);
            challengeQuestion.innerHTML = displayModel.questionHtml;
            if (questionSupport) {
                questionSupport.innerHTML = displayModel.supportHtml || '';
                questionSupport.classList.toggle('hidden', !displayModel.supportHtml);
            }

            renderAnswerArea(question);
            document.getElementById('challenge-answer-area').classList.remove('hidden');
            isAnswering = true;
            updatePracticeQuestionFooter();
            startTimer();
            if (question.answerMode === 'input') {
                updateReadingSubmitState(question);
                focusReadingInput(0);
            }

            if (currentQuestionIndex === 0) {
                dispatchPracticeState('enter', { questionIndex: 1, questionCount: questions.length });
            } else if (currentQuestionIndex === questions.length - 1) {
                dispatchPracticeState('near_clear', { questionIndex: questions.length, questionCount: questions.length });
            }
        }

        function renderQuestion() {
            clearTimer();
            clearTypewriter('question');
            hidePracticeQuestionFooter();
            if (pendingQuestionReveal) {
                clearTimeout(pendingQuestionReveal);
                pendingQuestionReveal = null;
            }

            const question = questions[currentQuestionIndex];
            if (!question) {
                renderSummary();
                return;
            }

            updateHud();
            isAnswering = false;
            isHintUsed = false;

            const answerArea = document.getElementById('challenge-answer-area');
            const feedback = document.getElementById('challenge-feedback');
            const challengeQuestion = document.getElementById('challenge-question');
            const typingCursor = document.getElementById('typing-cursor');
            const dialogueCounter = document.getElementById('dialogue-counter');
            const questionSupport = document.getElementById('question-support');
            const displayModel = getQuestionDisplayModel(question);

            dialogueCounter.textContent = `${currentQuestionIndex + 1} / ${questions.length}`;
            setQuestionAside(displayModel.asideText);
            challengeQuestion.innerText = '';
            typingCursor.className = 'typing-cursor';
            if (questionSupport) {
                questionSupport.innerHTML = '';
                questionSupport.classList.add('hidden');
            }
            answerArea.classList.add('hidden');
            answerArea.innerHTML = '';
            feedback.textContent = '';
            feedback.className = 'challenge-feedback';
            hideReviewNextAction();
            clearSentenceReviewAnalysis();

            runTypewriter({
                controllerName: 'question',
                target: challengeQuestion,
                cursor: typingCursor,
                text: displayModel.typingText,
                speed: 34,
                onComplete: () => {
                    pendingQuestionReveal = setTimeout(() => {
                        revealCurrentQuestion();
                    }, 180);
                }
            });
        }

        function markChoiceButtons(question, selected, isCorrect, isTimeout) {
            const buttons = document.querySelectorAll('.action-option');
            buttons.forEach((buttonNode) => {
                buttonNode.disabled = true;
                const optionIndex = Number(buttonNode.dataset.optionIndex);
                const optionValue = question.options[optionIndex];
                if (optionValue === question.correctAnswer) {
                    buttonNode.classList.add('correct-ans');
                }
                if (!isTimeout && optionValue === selected && !isCorrect) {
                    buttonNode.classList.add('wrong-ans');
                }
            });
        }

        function markReadingInputs(question, isCorrect) {
            const grid = document.getElementById('reading-input-grid');
            const inputs = getReadingInputs();
            const inputSlots = getReadingInputSlots(question);
            const hintBtn = document.getElementById('hint-btn');
            const submitBtn = document.getElementById('reading-submit-btn');

            inputs.forEach((input, index) => {
                input.readOnly = true;
                input.classList.remove('slot-correct', 'slot-wrong');
                const submittedChar = splitCommittedKanaChars(input.value)[0] || '';
                const expectedChar = inputSlots[index] ? inputSlots[index].answer : '';
                const isSlotCorrect = submittedChar === expectedChar;
                input.classList.add(isSlotCorrect ? 'slot-correct' : 'slot-wrong');
                if (!isSlotCorrect) {
                    input.setAttribute('aria-invalid', 'true');
                    input.setAttribute('aria-label', `${input.getAttribute('aria-label')}，此处有误`);
                } else {
                    input.removeAttribute('aria-invalid');
                }
            });
            if (grid) {
                grid.classList.remove('correct', 'wrong');
                grid.classList.add(isCorrect ? 'correct' : 'wrong');
            }
            if (hintBtn) {
                hintBtn.disabled = true;
                hintBtn.classList.add('disabled');
            }
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.classList.add('disabled');
            }
        }

        function checkAnswer(btn, selected, isTimeout = false) {
            if (!isAnswering) return;
            isAnswering = false;
            hidePracticeQuestionFooter();
            clearTimer();

            const question = questions[currentQuestionIndex];
            const shouldShowReviewAnalysis = isSentenceReviewMode(question);
            const expectedAnswer = question.answerMode === 'input'
                ? normalizeKanaAnswer(question.correctAnswer)
                : question.correctAnswer;
            const submittedAnswer = question.answerMode === 'input'
                ? normalizeKanaAnswer(selected)
                : selected;
            const isCorrect = !isTimeout && submittedAnswer === expectedAnswer;

            if (question.answerMode === 'input') {
                markReadingInputs(question, isCorrect);
            } else {
                markChoiceButtons(question, selected, isCorrect, isTimeout);
            }

            const feedback = document.getElementById('challenge-feedback');
            feedback.classList.remove('good', 'bad');

            if (isCorrect) {
                score += 1;
                answerStreak += 1;
                bestStreak = Math.max(bestStreak, answerStreak);
                feedback.textContent = answerStreak > 3 ? '很好，你的专注度非常高。' : '判断正确。';
                feedback.classList.add('good');
                if (isReviewPracticeMode() && practiceCore && typeof practiceCore.handleCorrectAnswer === 'function') {
                    practiceCore.handleCorrectAnswer(question, dailyPracticeType);
                } else if (shouldShowReviewAnalysis) {
                    removeSentenceReviewQuestion(question);
                }
                playSlashEffect();
                playDamageText(1, bestStreak >= 5 ? 'critical' : 'normal');
                const avatar = document.getElementById('enemy-avatar');
                avatar.classList.remove('hit');
                void avatar.offsetWidth;
                avatar.classList.add('hit');
                setTimeout(() => avatar.classList.remove('hit'), 500);
            } else {
                answerStreak = 0;
                rememberSessionWrongWord(question, selected, isTimeout);
                feedback.textContent = isTimeout ? '时间耗尽。在考场上犹豫也会失去分数。' : `差一点。正确答案是「${question.correctAnswer}」。请结合语境记忆。`;
                feedback.classList.add('bad');
                const dialogueBox = document.getElementById('dialogue-box');
                dialogueBox.classList.remove('shake');
                void dialogueBox.offsetWidth;
                dialogueBox.classList.add('shake');
                setTimeout(() => dialogueBox.classList.remove('shake'), 520);

                if (!(isChallengeMode && selectedDifficulty)) {
                    const recordResult = practiceCore && typeof practiceCore.handleWrongAnswer === 'function'
                        ? practiceCore.handleWrongAnswer(question, dailyPracticeType)
                        : null;
                    if (recordResult) {
                        if (recordResult.starred) showToast(`「${recordResult.wordId}」已被记入错题库。`);
                    } else {
                        const wordId = question.word.word;
                        restoreReviewKeyword(question.word);
                        const key = getVocabStarKey(wordId);
                        if (localStorage.getItem(key) !== 'true') {
                            localStorage.setItem(key, 'true');
                            showToast(`「${wordId}」已被记入错题库。`);
                        }
                        if (question.kind === 'sentence') {
                            recordSentenceQuestionWrong(question);
                        }
                    }
                }

                if (isChallengeMode && selectedDifficulty) {
                    const damage = difficultyMap[selectedDifficulty].damage;
                    hp = Math.max(0, hp - damage);
                    showHpDamage(damage);
                    playDamageText(damage, 'player');
                }
            }

            if (shouldShowReviewAnalysis) {
                renderSentenceReviewAnalysis(question);
            } else {
                clearSentenceReviewAnalysis();
            }

            clearedCount += 1;

            dispatchPracticeState(isCorrect ? 'answer_correct' : 'answer_wrong', {
                isCorrect,
                streak: answerStreak,
                questionIndex: currentQuestionIndex + 1,
                questionCount: questions.length,
                accuracy: clearedCount > 0 ? score / clearedCount : 0
            });

            if (isCorrect && answerStreak >= 3) {
                dispatchPracticeState('streak', {
                    isCorrect: true,
                    streak: answerStreak,
                    questionIndex: currentQuestionIndex + 1,
                    questionCount: questions.length,
                    accuracy: clearedCount > 0 ? score / clearedCount : 0
                });
            }

            updateHud();

            if (isChallengeMode && selectedDifficulty && hp <= 0) {
                pendingNextQuestion = setTimeout(renderSummary, 1500);
                return;
            }

            if (isReviewPracticeMode()) {
                showReviewNextAction();
                return;
            }

            const nextDelay = shouldShowReviewAnalysis ? 4800 : (isCorrect ? 1000 : 2000);
            pendingNextQuestion = setTimeout(nextQuestion, nextDelay);
        }

        function nextQuestion() {
            pendingNextQuestion = null;
            currentQuestionIndex += 1;
            if (currentQuestionIndex < questions.length) {
                renderQuestion();
            } else {
                renderSummary();
            }
        }


        function getQuestionTypeLabel(question) {
            if (!question) return '错题';
            if (question.kind === 'sentence') return '句子选词';
            if (question.kind === 'meaning') return '假名选义';
            if (question.kind === 'reading' || question.answerMode === 'input') return '读音填空';
            return '错题';
        }

        function getReviewSummaryReading(word) {
            const reading = String(word && word.reading || '').trim();
            if (reading) return reading;
            return extractKanaDisplayTextFromWordHtml(word && word.word_html, '');
        }

        function renderUnifiedVocabularySummary(context, options = {}) {
            if (!window.VocabularyResultSummary) return;
            const total = Number.isFinite(options.total) ? options.total : questions.length;
            const correct = Number.isFinite(options.correct) ? options.correct : score;
            window.VocabularyResultSummary.render({
                root: document.getElementById('view-summary'),
                title: options.title || context.challengeTitle,
                total,
                correct,
                wrongWords: sessionWrongWords,
                practiceType: dailyPracticeType,
                feedback: options.feedback || '',
                getDisplayText: getWordDisplayText,
                getReading: getReviewSummaryReading,
                getMeaning: extractPrimaryMeaning,
                temporaryUnitKey: SENTENCE_REVIEW_MODULE_KEY,
                temporaryUnitUrl: VOCABULARY_RETURN_URL,
                getWordId: getWordStorageId,
                onReturn: returnToVocabularyPage,
                onRestart: () => window.location.reload()
            });
        }

        function renderReviewSummary(context = getPracticeContext()) {
            renderUnifiedVocabularySummary(context, {
                title: '错题巩固完成',
                total: questions.length,
                correct: score,
                feedback: '这一轮的易错词已经重新整理过了，再看一遍仍不确定的词。'
            });
        }

        function getVocabularyResultFeedback(percentage) {
            if (percentage === 100) return '完美。你的基础非常扎实，继续保持这份专注。';
            if (percentage >= 90) return '表现出色。对于高阶形容词的掌握已成体系。';
            if (percentage >= 80) return '不错，注意再确认容易混淆的词义。';
            if (percentage >= 65) return '部分词汇还需要巩固，先回看本轮错词。';
            if (percentage >= 50) return '先把易错词重新梳理一遍，再进入下一组。';
            return '基础还不稳定，建议回到词卡重新记忆。';
        }

        function renderSummary(options = {}) {
            const endedEarly = Boolean(options && options.endedEarly);
            clearTimer();
            clearTypewriter('question');
            if (pendingQuestionReveal) {
                clearTimeout(pendingQuestionReveal);
                pendingQuestionReveal = null;
            }
            if (pendingNextQuestion) {
                clearTimeout(pendingNextQuestion);
                pendingNextQuestion = null;
            }

            switchView('view-summary');

            const context = getPracticeContext();

            if (context.mode === 'review' && !endedEarly) {

                renderReviewSummary(context);

                return;

            }

            const scoredQuestionCount = endedEarly ? clearedCount : questions.length;
            const percentage = scoredQuestionCount > 0 ? Math.round((score / scoredQuestionCount) * 100) : 0;
            if (!endedEarly) ensureRewardResult();
            const resultFeedback = endedEarly
                ? `已完成 ${clearedCount} / ${questions.length} 题，本轮仅统计已作答内容。`
                : getVocabularyResultFeedback(percentage);

            if (endedEarly) {
                dispatchPracticeState('exit', {
                    isCorrect: null,
                    streak: bestStreak,
                    questionIndex: clearedCount,
                    questionCount: questions.length,
                    accuracy: clearedCount > 0 ? score / clearedCount : 0,
                    meta: { endedEarly: true }
                });
            } else {
                dispatchPracticeState(percentage === 100 ? 'perfect_clear' : 'clear', {
                    isCorrect: true,
                    streak: bestStreak,
                    questionIndex: questions.length,
                    questionCount: questions.length,
                    accuracy: questions.length > 0 ? score / questions.length : 0
                });
            }

            renderUnifiedVocabularySummary(context, {
                title: context.challengeTitle,
                total: scoredQuestionCount,
                correct: score,
                feedback: resultFeedback
            });
        }

        function prepareQuestionSet() {
            const context = getPracticeContext();
            if (context.mode === 'review' && dailyPracticeType === 'sentence') {
                questions = getSentenceReviewQuestions();
                targetWords = questions.map((question) => question.word).filter(Boolean);
                return;
            }
            const eligiblePool = getEligibleWordsForPracticeType(context.pool, dailyPracticeType);
            const questionLimit = getQuestionLimitForContext(context, eligiblePool);
            targetWords = shuffleArray(eligiblePool).slice(0, Math.min(questionLimit, eligiblePool.length));
            if (targetWords.length === 0) {
                questions = [];
                return;
            }

            questions = targetWords.map((word) => {
                if (dailyPracticeType === 'reading') {
                    return buildReadingQuestionSpec(word);
                }
                if (dailyPracticeType === 'meaning') {
                    return buildMeaningQuestionSpec(word, eligiblePool);
                }
                return buildSentenceQuestionSpec(word);
            }).filter(Boolean);

            if (questions.length > 0) {
                questions = shuffle(questions);
            }
        }

            if (context.mode === 'stage' || context.mode === 'challenge') {
                return buildDialogueTypingText('凛（りん）', '这次是阶段练习。\n别误会，我只是提醒你仔细看修饰对象。');

        function installVocabularyPracticeCore() {
            if (!window.VocabularyPracticeCore || typeof window.VocabularyPracticeCore.create !== 'function') return;
            practiceCore = window.VocabularyPracticeCore.create({
                moduleKey: SENTENCE_REVIEW_MODULE_KEY,
                starKeyPrefix: VOCAB_STAR_KEY_PREFIX,
                practiceTypeLabels: DAILY_PRACTICE_TYPE_MAP,
                limits: { day: DAY_QUESTION_LIMIT, stage: STAGE_QUESTION_LIMIT, final: FINAL_QUESTION_LIMIT },
                wordsPerDay: typeof WORDS_PER_DAY !== 'undefined' ? WORDS_PER_DAY : 20,
                getFullWordList: () => typeof FULL_WORD_LIST !== 'undefined' && Array.isArray(FULL_WORD_LIST) ? FULL_WORD_LIST : [],
                getAllDefinedWords: () => typeof ALL_DEFINED_WORDS !== 'undefined' && Array.isArray(ALL_DEFINED_WORDS)
                    ? ALL_DEFINED_WORDS
                    : (typeof FULL_WORD_LIST !== 'undefined' && Array.isArray(FULL_WORD_LIST) ? FULL_WORD_LIST.filter((word) => word && word.word !== '（準備中）') : []),
                getDays: () => CURRICULUM_DAYS,
                getStages: () => CURRICULUM_STAGES,
                getGroups: () => CURRICULUM_GROUPS,
                getPracticeType: () => dailyPracticeType,
                getSelectedDifficulty: () => selectedDifficulty,
                escapeHtml,
                shuffleArray,
                getKanaDisplayText: extractKanaDisplayTextFromWordHtml,
                getWordDisplayText,
                formatTypingText: buildQuestionTypingText,
                formatQuestionHtml: (bodyHtml, supportText) => `${buildDialogueQuestionHtml(bodyHtml)}<br><br><span class="question-sub-text">${escapeHtml(supportText)}</span>`
            });
            window.__vocabularyPracticeCore = practiceCore;

            getVocabStarKey = practiceCore.getVocabStarKey;
            getWordStorageId = practiceCore.getWordStorageId;
            restoreReviewKeyword = practiceCore.restoreReviewKeyword;
            cloneLiteWord = practiceCore.cloneLiteWord;
            collectWordsByIndexes = practiceCore.collectWordsByIndexes;
            getDayWords = practiceCore.getDayWords;
            getStageWords = practiceCore.getStageWords;
            getFinalWords = practiceCore.getFinalWords;
            getStarredWords = practiceCore.getStarredWords;
            getQuestionLimitForContext = practiceCore.getQuestionLimitForContext;
            getReadingPromptForWord = practiceCore.getReadingPromptForWord;
            extractPrimaryMeaning = practiceCore.extractPrimaryMeaning;
            extractPrimaryUsage = practiceCore.extractPrimaryUsage;
            extractCommonCollocation = practiceCore.extractCommonCollocation;
            getEligibleWordsForPracticeType = practiceCore.getEligibleWordsForPracticeType;
            getSentenceCorrectAnswer = practiceCore.getSentenceCorrectAnswer;
            getSentenceSourceMeta = practiceCore.getSentenceSourceMeta;
            normalizeSentenceForTranslationMatch = practiceCore.normalizeSentenceForTranslationMatch;
            findCurrentPracticeSourceForSnapshot = practiceCore.findCurrentPracticeSourceForSnapshot;
            getCurrentSentenceTranslationForSnapshot = practiceCore.getCurrentSentenceTranslationForSnapshot;
            normalizeSentencePresetOptions = practiceCore.normalizeSentencePresetOptions;
            buildSentenceFallbackOptions = practiceCore.buildSentenceFallbackOptions;
            findWordBySentenceSnapshot = practiceCore.findWordBySentenceSnapshot;
            buildSentenceOptionDetails = practiceCore.buildSentenceOptionDetails;
            buildSentenceReviewAnalysis = practiceCore.buildSentenceReviewAnalysis;
            createSentenceQuestionSnapshot = practiceCore.createSentenceQuestionSnapshot;
            recordSentenceQuestionWrong = practiceCore.recordSentenceQuestionWrong;
            removeSentenceReviewQuestion = practiceCore.removeSentenceReviewQuestion;
            getSentenceReviewQuestions = practiceCore.getSentenceReviewQuestions;
            buildSentenceQuestionSpec = practiceCore.buildSentenceQuestionSpec;
            buildReadingQuestionSpec = practiceCore.buildReadingQuestionSpec;
            buildMeaningQuestionSpec = practiceCore.buildMeaningQuestionSpec;
            buildReviewSummaryItems = () => practiceCore.buildReviewSummaryItems(questions);
            prepareQuestionSet = function prepareQuestionSetWithCore() {
                const prepared = practiceCore.prepareQuestionSet(getPracticeContext(), dailyPracticeType);
                targetWords = prepared.targetWords;
                questions = prepared.questions;
            };
        }

        installVocabularyPracticeCore();

        document.getElementById('intro-story-panel').addEventListener('click', () => {
            finishCurrentTypewriter('intro');
        });

        document.getElementById('challenge-question-shell').addEventListener('click', () => {
            if (questionTypingController) {
                finishCurrentTypewriter('question');
            }
        });

        function startApp() {
            prepareQuestionSet();
            renderIntro();
        }

        startApp();
    </script>
    <script src="../../../shared/word-bank.js"></script>
    <script src="../../../shared/unified-header.js" data-kiki-unified-header-loader></script>
</body>
</html>

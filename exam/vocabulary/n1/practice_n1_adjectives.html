<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N1 形容詞 - 練習</title>
    <!-- 引入优雅的衬线与无衬线字体，契合文字游戏与沉浸阅读风格 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        html {
            -webkit-text-size-adjust: 100%;
        }

        :root {
            /* === 暖光理性辅导 ADV / 护眼原木色调色板 === */
            --bg-grad-start: #FDFBF7;      /* 暖白书页色 */
            --bg-grad-end: #F6EFE9;        /* 晨光浅杏色 */

            --panel-bg: #FFFFFF; /* 实色纸面，避免弹窗和结算面板发透 */
            --panel-border: rgba(210, 195, 180, 0.6); /* 柔和纸质边框 */

            --text-strong: #3F3732;        /* 强调标题/关键正文 */
            --text-main: #4A423E;          /* 主文本（深咖啡/墨褐，比纯黑更护眼） */
            --text-secondary: #625851;     /* 次正文（稳定可读） */
            --text-tertiary: #7E736B;      /* 弱提示（不再用 opacity 偷淡） */
            --text-ruby: #726861;          /* 注音/小标注 */
            --text-dim: var(--text-tertiary);
            --text-accent: #C27A62;        /* 剧情高亮色（赤陶橘，温暖理性） */

            --accent-green: #5C946E;       /* 沉稳森绿（正确/成功） */
            --accent-red: #D16B6B;         /* 柔和朱红（错误/警示） */
            --accent-hover: rgba(194, 122, 98, 0.08); /* 暖橘悬浮背景 */

            --glass-blur: blur(12px);      /* 毛玻璃滤镜 */
            --shadow-soft: 0 8px 24px rgba(180, 160, 145, 0.15); /* 浅色暖光阴影 */
            --shadow-glow: 0 0 12px rgba(194, 122, 98, 0.2); /* 橘色微光晕 */

            --font-ui: "Noto Sans SC", "Noto Sans JP", -apple-system, sans-serif;
            --font-serif: "Noto Serif SC", "Noto Serif JP", serif; /* 剧情主体使用衬线体 */

            --transition: 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-ui);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background: var(--bg-grad-end);
        }

        /* 纯 CSS 绘制的静谧氛围背景 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, var(--bg-grad-start) 0%, var(--bg-grad-end) 80%);
            z-index: -2;
        }

        /* 隐约的网格背景，增加秩序感和纸张感 */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        button, input {
            font: inherit;
        }

        /* 左上角返回按钮 */
        .page-back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 120;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--panel-border);
            backdrop-filter: var(--glass-blur);
            color: var(--text-secondary);
            font-family: var(--font-ui);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all var(--transition);
        }

        .page-back-btn:hover {
            color: var(--text-accent);
            background: #fff;
            border-color: var(--text-accent);
            box-shadow: var(--shadow-glow);
        }

        .practice-shell {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 88px 20px 40px;
            position: relative;
            z-index: 1;
        }

        .screen {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        .challenge-screen {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hidden {
            display: none !important;
        }

        body.is-review-mode .player-hud {
            display: none !important;
        }

        /* 面板通用设定（介绍/结算） */
        .intro-card {
            width: 100%;
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            padding: 50px 40px;
            box-shadow: var(--shadow-soft);
            position: relative;
            text-align: center;
        }

        /* 介绍界面 */
        .intro-dialogue-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            margin-bottom: 32px;
        }

        /* 头像通用样式，支持图片完美裁剪 */
        .intro-avatar, .enemy-avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 50%;
            border: 2px solid var(--panel-border);
            box-shadow: 0 4px 16px rgba(180, 160, 145, 0.2);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .intro-avatar img, .enemy-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: contrast(95%); /* 稍微柔和化图片 */
        }

        .intro-avatar {
            width: 100px;
            height: 100px;
        }

        .intro-dialogue-main {
            width: 100%;
            text-align: left;
        }

        .story-panel {
            min-height: 100px;
            cursor: pointer;
            background: rgba(245, 240, 235, 0.6);
            padding: 24px 30px;
            border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
        }

        .story-text, .typewriter-text {
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-main);
            font-family: var(--font-serif);
            font-weight: 600;
            white-space: pre-wrap;
            letter-spacing: 0.04em;
        }

        .story-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 12px;
            text-align: right;
            letter-spacing: 0.1em;
            font-weight: 500;
        }

        /* 游戏风打字游标 - 经典倒三角 */
        .typing-cursor::after {
            content: '▼';
            display: inline-block;
            font-size: 14px;
            color: var(--text-accent);
            margin-left: 6px;
            animation: cursorPulse 1s infinite alternate;
        }

        @keyframes cursorPulse {
            0% { opacity: 0.2; }
            100% { opacity: 1; text-shadow: 0 0 8px rgba(194, 122, 98, 0.4); }
        }

        /* 通用按钮 */
        .intro-actions {
            display: grid;
            gap: 16px;
            margin-top: 32px;
            border-top: 1px dashed rgba(0,0,0,0.1);
            padding-top: 32px;
        }

        .intro-primary-btn {
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            border: 1px solid var(--text-accent);
            background: rgba(194, 122, 98, 0.05);
            color: var(--text-accent);
            font-size: 16px;
            font-family: var(--font-ui);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.1em;
            text-align: center;
        }

        .intro-primary-btn:hover {
            background: var(--text-accent);
            color: #fff;
            box-shadow: var(--shadow-glow);
        }

        .intro-primary-btn:active,
        .action-option:active:not(:disabled) {
            transform: scale(0.99);
        }

        .difficulty-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .difficulty-btn {
            padding: 24px 16px;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: all var(--transition);
        }

        .difficulty-btn:hover {
            background: #fff;
            border-color: var(--text-accent);
            box-shadow: 0 4px 12px rgba(194, 122, 98, 0.15);
        }

        .difficulty-title {
            font-size: 16px;
            font-family: var(--font-ui);
            color: var(--text-main);
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .difficulty-copy {
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.65;
            text-align: center;
            white-space: pre-wrap;
            font-weight: 500;
        }

        /* === 核心战斗/剧情界面排布 === */
        .arena-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 16px;
        }

        /* 角色头部区 */
        .enemy-stage {
            position: relative;
            display: flex;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 16px;
            padding: 0 4px;
            min-height: 104px;
        }

        .enemy-side-stack {
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .enemy-avatar {
            width: 100px;
            height: 100px;
        }

        .enemy-avatar.hit {
            animation: damageShake 0.4s ease;
        }

        @keyframes damageShake {
            0%, 100% { transform: scale(1) translateX(0); filter: brightness(1); }
            25% { transform: scale(1.05) translateX(-4px); filter: brightness(1.05); }
            75% { transform: scale(1.05) translateX(4px); }
        }

        /* 理性角色轻微的悬浮代替活泼的跳动 */
        .sensei-breathe {
            animation: senseiBreathe 6s ease-in-out infinite;
        }

        @keyframes senseiBreathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .enemy-status-box {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--panel-border);
            backdrop-filter: var(--glass-blur);
            padding: 10px 14px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            width: auto;
            min-width: 120px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .enemy-name {
            color: var(--text-main);
            font-size: 13px;
            font-family: var(--font-ui);
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        .enemy-hp-bar-shell {
            width: 100%;
            height: 4px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 2px;
            overflow: hidden;
        }

        .enemy-hp-bar {
            height: 100%;
            background: var(--text-accent);
            transition: width 0.3s ease;
        }

        .enemy-aside-bubble {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: var(--glass-blur);
            color: var(--text-main);
            padding: 12px 18px;
            border-radius: 8px 8px 8px 0;
            font-family: var(--font-serif);
            font-size: 14px;
            box-shadow: var(--shadow-soft);
            max-width: 220px;
            display: none;
        }

        /* 游戏文本框 - 理性笔记本风格 */
        .dialogue-box {
            background: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            padding: 36px 40px 30px;
            box-shadow: var(--shadow-soft);
            backdrop-filter: var(--glass-blur);
            position: relative;
            min-height: 0;
        }

        .dialogue-type-label {
            color: var(--text-accent);
            padding: 0;
            border-radius: 4px;
            font-size: 13px;
            font-family: var(--font-ui);
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        .dialogue-topline {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }

        .dialogue-counter {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .question-focus-card {
            padding: 0;
        }

        .typewriter-text ruby {
            ruby-align: center;
        }

        .typewriter-text rt {
            font-size: 0.52em;
            color: var(--text-ruby);
            font-family: var(--font-ui);
            font-weight: 500;
        }

        .question-main-text {
            font-size: 20px;
            line-height: 1.68;
            font-weight: 600;
            color: var(--text-strong);
        }

        .question-support {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 10px;
        }

        .question-sub-text {
            color: var(--text-secondary);
            font-size: 14px;
            font-family: var(--font-ui);
            line-height: 1.68;
            background: rgba(0, 0, 0, 0.03);
            padding: 6px 10px;
            border-radius: 4px;
            display: inline-flex;
            border-left: 3px solid var(--text-secondary);
            max-width: 100%;
            font-weight: 500;
        }

        .blank-space {
            display: inline-block;
            min-width: 4em;
            height: 0.95em;
            margin: 0 0.2em;
            vertical-align: baseline;
            border-bottom: 1px solid var(--text-main);
            transform: translateY(0.02em);
        }

        .challenge-answer-area {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed rgba(0,0,0,0.1);
        }

        .challenge-feedback {
            min-height: 24px;
            margin-top: 24px;
            font-size: 15px;
            font-family: var(--font-serif);
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.05em;
            color: var(--text-strong);
        }

        .challenge-feedback.good { color: var(--accent-green); }
        .challenge-feedback.bad { color: var(--accent-red); }

        .challenge-analysis {
            margin-top: 14px;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid rgba(194, 122, 98, 0.16);
            background: #FFFDFB;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.8;
            text-align: left;
        }

        .challenge-analysis.hidden {
            display: none;
        }

        .challenge-analysis-title {
            display: block;
            margin-bottom: 6px;
            color: var(--text-accent);
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .challenge-analysis-block + .challenge-analysis-block {
            margin-top: 12px;
        }

        .challenge-analysis-label {
            display: block;
            margin-bottom: 4px;
            color: var(--text-strong);
            font-weight: 700;
        }

        .challenge-analysis-copy {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .challenge-analysis-line + .challenge-analysis-line {
            margin-top: 3px;
        }

        .challenge-analysis-term {
            color: var(--text-strong);
            font-weight: 700;
        }

        .challenge-analysis-option-list {
            display: grid;
            gap: 10px;
            margin-top: 8px;
        }

        .challenge-analysis-option {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid rgba(194, 122, 98, 0.14);
            background: #FFFFFF;
        }

        .challenge-analysis-option.is-correct {
            border-color: rgba(92, 148, 110, 0.32);
            background: #F7FBF7;
        }

        .challenge-analysis-option-head {
            color: var(--text-strong);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .challenge-analysis-option-copy {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.72;
        }

        .review-next-action {
            margin-top: 16px;
            display: flex;
            justify-content: center;
        }

        .review-next-action.hidden {
            display: none;
        }

        .review-next-btn {
            min-width: 150px;
            border: 1px solid var(--text-accent, #C27A62);
            border-radius: 8px;
            background: var(--text-accent, #C27A62);
            color: #fff;
            padding: 12px 26px;
            font-family: var(--font-ui);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(166, 78, 54, 0.16);
            transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
        }

        .review-next-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(166, 78, 54, 0.2);
        }

        .review-next-btn:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
            box-shadow: none;
        }

        /* 单列选项面板，规整感 */
        .choice-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .action-option {
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0,0,0,0.1);
            color: var(--text-main);
            text-align: left;
            padding: 14px 20px;
            font-size: 16px;
            font-family: var(--font-ui);
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.05em;
        }

        .action-option:hover:not(:disabled) {
            background: #fff;
            border-color: var(--text-accent);
            box-shadow: 0 4px 12px rgba(194, 122, 98, 0.1);
            color: var(--text-accent);
        }

        .action-option:disabled {
            cursor: default;
        }

        .action-option.correct-ans {
            background: rgba(92, 148, 110, 0.1);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .action-option.wrong-ans {
            background: rgba(209, 107, 107, 0.1);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .action-option:focus,
        .action-option:focus-visible {
            outline: none;
        }

        @media (hover: none), (pointer: coarse) {
            .action-option:hover:not(:disabled) {
                background: rgba(255, 255, 255, 0.8);
                border-color: rgba(0,0,0,0.1);
                box-shadow: none;
                color: var(--text-main);
            }

            .action-option:active:not(:disabled) {
                transform: none;
            }
        }

        /* 拼写输入模式 */
        .reading-answer-wrap {
            display: grid;
            gap: 24px;
        }

        .reading-input-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            gap: 12px;
        }

        .reading-char-input {
            width: calc(var(--reading-segment-length, 1) * 1.2em + 22px);
            min-width: 50px;
            height: 60px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid transparent;
            border-bottom: 2px solid rgba(0,0,0,0.15);
            border-radius: 4px 4px 0 0;
            text-align: center;
            padding: 0 8px;
            color: var(--text-main);
            font-size: 26px;
            font-family: var(--font-serif);
            outline: none;
            transition: all 0.2s;
        }

        .reading-fixed-segment {
            display: inline-flex;
            align-items: flex-end;
            min-height: 60px;
            padding: 0 2px 10px;
            color: var(--text-main);
            font-size: 28px;
            font-family: var(--font-serif);
            line-height: 1;
            white-space: nowrap;
        }

        .reading-char-input:focus {
            background: #fff;
            border-bottom-color: var(--text-accent);
            box-shadow: 0 4px 8px rgba(194, 122, 98, 0.1);
        }

        .reading-char-input.locked {
            background: rgba(0, 0, 0, 0.03);
            color: var(--text-secondary);
            border-bottom-style: dashed;
        }

        .reading-input-grid.correct .reading-char-input {
            border-bottom-color: var(--accent-green);
            color: var(--accent-green);
        }

        .reading-input-grid.correct .reading-fixed-segment {
            color: var(--accent-green);
        }

        .reading-input-grid.wrong .reading-char-input {
            border-bottom-color: var(--accent-red);
            color: var(--accent-red);
        }

        .reading-input-grid.wrong .reading-fixed-segment {
            color: var(--accent-red);
        }

        .reading-action-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .reading-action-btn {
            padding: 10px 24px;
            border-radius: 6px;
            border: 1px solid rgba(0,0,0,0.15);
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
        }

        .reading-action-btn:hover:not(:disabled) {
            color: var(--text-accent);
            background: rgba(255, 255, 255, 0.8);
            border-color: var(--text-accent);
        }

        #reading-submit-btn {
            color: var(--text-accent);
            border-color: var(--text-accent);
            background: rgba(194, 122, 98, 0.05);
        }

        .reading-feedback {
            font-size: 14px;
            font-family: var(--font-serif);
            font-weight: 600;
            min-height: 24px;
            text-align: center;
        }

        .reading-feedback.correct { color: var(--accent-green); }
        .reading-feedback.wrong { color: var(--accent-red); }

            const word = question && question.word;
            if (!word) return;
            const wordId = getWordStorageId(word) || getWordDisplayText(word);

            const sentenceTranslation = String(
                question.sentenceCn
                || question.cn
                || (question.reviewAnalysis && question.reviewAnalysis.sentenceTranslation)
                || ''
            ).trim();
            const detail = practiceCore && typeof practiceCore.buildResultWrongDetail === 'function'
                ? practiceCore.buildResultWrongDetail(question, submittedAnswer, isTimeout)
                : {
                questionType: getQuestionTypeLabel(question),
                prompt: String(question.typingText || getWordDisplayText(word) || '').trim(),
                submittedAnswer: isTimeout ? '未作答（超时）' : String(submittedAnswer || '未作答').trim(),
                correctAnswer: String(question.correctAnswer || '').trim(),
                translation: sentenceTranslation || extractPrimaryMeaning(word),
                translationLabel: sentenceTranslation ? '中文翻译' : '中文释义'
                };
            const summaryWord = { ...word, __resultWrongDetail: detail };

            if (sessionWrongWordIds.has(wordId)) {
                const existingIndex = sessionWrongWords.findIndex((item) => {
                    return (getWordStorageId(item) || getWordDisplayText(item)) === wordId;
                });
                if (existingIndex >= 0) sessionWrongWords[existingIndex] = summaryWord;
                return;
            }
            sessionWrongWordIds.add(wordId);
            sessionWrongWords.push(summaryWord);
        }

        function restoreReviewKeyword(word) {

        function collectWordsByIndexes(indexes) {
            if (!Array.isArray(indexes) || typeof FULL_WORD_LIST === 'undefined') {
                return [];
            }
            const collected = [];
            const seen = new Set();
            indexes.forEach((index) => {
                const word = FULL_WORD_LIST[index];
                if (!word || word.word === '（準備中）') return;
                const key = String(word.word || index);
                if (seen.has(key)) return;
                seen.add(key);
                collected.push(word);
            });
            return collected;
        }

        function getDayWords(dayId) {
            const day = getCurriculumDay(dayId);
            if (day) {
                return collectWordsByIndexes(day.wordIds);
            }
            if (typeof FULL_WORD_LIST === 'undefined') return [];
            const start = (dayId - 1) * WORDS_PER_DAY;
            const end = start + WORDS_PER_DAY;
            return FULL_WORD_LIST.slice(start, end).filter((word) => word.word !== '（準備中）');
        }

        function getStageWords(stageId) {
            const stage = getCurriculumStage(stageId);
            if (!stage) return [];
            const indexes = stage.dayIds.flatMap((dayId) => {

                return day ? day.wordIds : [];
            });
            return collectWordsByIndexes(indexes);

        function getFinalWords() {

        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function shuffle(array) {
            return shuffleArray(array);
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizeTextValue(value) {
            return String(value == null ? '' : value).trim();
        }

        function toHiragana(text) {
            const normalizedText = String(text == null ? '' : text).normalize('NFC');
            return normalizedText
                .replace(/[\u30a1-\u30f6]/g, (char) => String.fromCharCode(char.charCodeAt(0) - 0x60))
                .normalize('NFC');
        }

        function normalizeKanaAnswer(value) {
            return toHiragana(String(value == null ? '' : value).normalize('NFC').replace(/\s+/g, ''))
                .normalize('NFC');
        }

        function splitKanaChars(value) {
            return Array.from(normalizeKanaAnswer(value));
        }

        function splitCommittedKanaChars(value) {
            return splitKanaChars(value).filter((char) => /^[\u3041-\u3096\u309d\u309eー]$/u.test(char));
        }

        function isReadingInputComposing(input) {
            return Boolean(input && input.dataset && input.dataset.composing === 'true');
        }

        function findNextEditableReadingIndex(inputs, startIndex) {
            for (let index = Math.max(0, Number(startIndex) || 0); index < inputs.length; index += 1) {
                if (!inputs[index].readOnly) {
                    return index;
                }
            }
            return -1;
        }

        function findPreviousEditableReadingIndex(inputs, startIndex) {
            for (let index = Math.min(inputs.length - 1, Number(startIndex) || 0); index >= 0; index -= 1) {
                if (!inputs[index].readOnly) {
                    return index;
                }
            }
            return -1;
        }

        function commitReadingChars(startIndex, rawValue) {
            const inputs = getReadingInputs();
            const start = findNextEditableReadingIndex(inputs, startIndex);
            const chars = splitCommittedKanaChars(rawValue);
            if (start === -1) {
                return {
                    nextIndex: inputs.length,
                    lastChangedIndex: -1,
                    insertedCount: 0,
                    shouldAdvance: false
                };
            }
            if (chars.length === 0) {
                inputs[start].value = '';
                return {
                    nextIndex: start,
                    lastChangedIndex: start,
                    insertedCount: 0,
                    shouldAdvance: false
                };
            }

            let cursor = start;
            let insertedCount = 0;
            let lastChangedIndex = start;
            while (cursor !== -1 && insertedCount < chars.length) {
                const input = inputs[cursor];
                input.value = chars[insertedCount];
                insertedCount += 1;
                lastChangedIndex = cursor;
                cursor = findNextEditableReadingIndex(inputs, cursor + 1);
            }
            return {
                nextIndex: cursor === -1 ? inputs.length : cursor,
                lastChangedIndex,
                insertedCount,
                shouldAdvance: insertedCount > 0
            };
        }

        function getReadingHelper() {
            return window.VocabularyReadingHelper || null;
        }

        function getReadingPromptForWord(word) {
            const helper = getReadingHelper();
            if (helper && typeof helper.buildPrompt === 'function') {
                return helper.buildPrompt(word && word.word_html, word && word.word);
            }

            const fallbackSurface = normalizeTextValue(word && word.word);
            const fallbackKana = /[\u3040-\u30ffー]/.test(fallbackSurface)
                ? normalizeKanaAnswer(fallbackSurface)
                : '';

            return {
                surfaceText: fallbackSurface,
                fullKana: fallbackKana,
                segments: fallbackSurface ? [{ type: 'fixed', text: fallbackSurface }] : [],
                editableCount: 0,
                firstHint: ''
            };
        }

        function extractSurfaceTextFromWordHtml(wordHtml, fallbackText = '') {
            const helper = getReadingHelper();
            if (helper && typeof helper.getSurfaceText === 'function') {
                return helper.getSurfaceText(wordHtml, fallbackText);
            }
            return normalizeTextValue(fallbackText);
        }

        function extractKanjiReadingTextFromWordHtml(wordHtml, fallbackText = '') {
            const helper = getReadingHelper();
            if (helper && typeof helper.buildPrompt === 'function') {
                const prompt = helper.buildPrompt(wordHtml, fallbackText);
                return prompt && prompt.editableCount > 0 ? prompt.fullKana : '';
            }
            return '';
        }

        function extractKanaDisplayTextFromWordHtml(wordHtml, fallbackText = '') {
            const helper = getReadingHelper();
            if (helper && typeof helper.getKanaDisplayText === 'function') {
                return helper.getKanaDisplayText(wordHtml, fallbackText);
            }
            const fallback = normalizeTextValue(fallbackText);
            return /[\u3040-\u30ffー]/.test(fallback) ? toHiragana(fallback) : '';
        }

        function extractPrimaryMeaning(word) {
            return String(word && word.mean ? word.mean : '')
                .split(/[；;]/)
                .map((part) => part.trim())
                .find(Boolean) || '';
        }

        function getEligibleWordsForPracticeType(words, type) {
            const pool = Array.isArray(words) ? words : [];
            if (type === 'reading') {
                return pool.filter((word) => {
                    const prompt = getReadingPromptForWord(word);
                    return Boolean(prompt && prompt.surfaceText && prompt.fullKana && prompt.editableCount > 0);
                });
            }
            if (type === 'meaning') {
                return pool.filter((word) => {
                    const kanaText = extractKanaDisplayTextFromWordHtml(word && word.word_html, word && word.word);
                    const primaryMeaning = extractPrimaryMeaning(word);
                    return Boolean(kanaText && primaryMeaning);
                });
            }
            return pool.filter(Boolean);
        }

        function normalizeSentenceOptionValue(value) {
            return typeof value === 'string' ? value.trim() : '';
        }

        function getSentencePracticeItems(word) {
            const practiceSentence = word && word.practice
                ? (typeof word.practice.sentence === 'string'
                    ? word.practice.sentence
                    : (typeof word.practice.question === 'string' ? word.practice.question : ''))
                : '';
            if (!practiceSentence) {
                return [];
            }
            const answer = normalizeSentenceOptionValue(word.practice.answer);
            if (!answer) return [];
            return [{
                sourceKind: 'practice',
                sourceIndex: 0,
                sentence: practiceSentence,
                cn: typeof word.practice.cn === 'string' ? word.practice.cn.trim() : '',
                answer,
                options: Array.isArray(word.practice.options)
                    ? word.practice.options.map((option) => normalizeSentenceOptionValue(option)).filter(Boolean)
                    : [],
                analysis: typeof word.practice.analysis === 'string' ? word.practice.analysis.trim() : '',
                optionWordIds: Array.isArray(word.practice.optionWordIds)
                    ? word.practice.optionWordIds.map((wordId) => wordId == null ? null : String(wordId).trim())
                    : []
            }];
        }

        function getSentenceCorrectAnswer(word) {
            const practiceAnswer = normalizeSentenceOptionValue(word && word.practice && word.practice.answer);
            if (practiceAnswer) return practiceAnswer;

            const kanaDisplay = normalizeSentenceOptionValue(
                extractKanaDisplayTextFromWordHtml(word && word.word_html, word && word.word)
            );
            return kanaDisplay || normalizeSentenceOptionValue(word && word.word);
        }

        function getSentenceSourceMeta(word, practiceItem = null) {
            if (practiceItem) {
                return {
                    sourceKind: practiceItem.sourceKind || 'practice',
                    sourceIndex: Number.isFinite(practiceItem.sourceIndex) ? practiceItem.sourceIndex : 0,
                    sentence: practiceItem.sentence || '',
                    cn: practiceItem.cn || '',
                    analysis: practiceItem.analysis || '',
                    optionWordIds: Array.isArray(practiceItem.optionWordIds) ? practiceItem.optionWordIds : []
                };
            }

            const primaryPractice = getSentencePracticeItems(word)[0];
            if (primaryPractice) {
                return {
                    sourceKind: primaryPractice.sourceKind,
                    sourceIndex: primaryPractice.sourceIndex,
                    sentence: primaryPractice.sentence,
                    cn: primaryPractice.cn,
                    analysis: primaryPractice.analysis,
                    optionWordIds: primaryPractice.optionWordIds
                };
            }

            const example = Array.isArray(word && word.examples) && word.examples.length > 0
                ? word.examples[0]
                : { jp: '例文がありません。', cn: '' };

            return {
                sourceKind: 'example',
                sourceIndex: 0,
                sentence: example && example.jp ? example.jp : '例文がありません。',
                cn: example && example.cn ? example.cn : '',
                analysis: '',
                optionWordIds: []
            };
        }

        function normalizeSentenceForTranslationMatch(value) {
            return String(value || '')
                .replace(/<rt[^>]*>[\s\S]*?<\/rt>/g, '')
                .replace(/<rp[^>]*>[\s\S]*?<\/rp>/g, '')
                .replace(/<span class=['"][^'"]*\bblank-space\b[^'"]*['"]>\s*<\/span>/g, '[[BLANK]]')
                .replace(/<span class=['"]ex-highlight['"]>[\s\S]*?<\/span>/g, '[[BLANK]]')
                .replace(/____|_{2,}|＿{2,}|________/g, '[[BLANK]]')
                .replace(/<[^>]+>/g, '')
                .replace(/[「」『』"'\s。！？、，,.!！?？]/g, '')
                .replace(/\[\[BLANK\]\]/g, 'BLANK')
                .trim();
        }

        function findCurrentPracticeSourceForSnapshot(snapshot, baseWord) {
            const practiceItems = getSentencePracticeItems(baseWord);
            if (!practiceItems.length) return null;
            const sourceKind = String(snapshot && snapshot.sourceKind || 'practice');
            const parsedIndex = parseInt(snapshot && snapshot.sourceIndex, 10);
            const sourceIndex = Number.isFinite(parsedIndex) ? parsedIndex : 0;
            const bySource = practiceItems.find((item) => {
                return String(item && item.sourceKind || 'practice') === sourceKind
                    && Number(item && item.sourceIndex || 0) === sourceIndex;
            });
            if (bySource) return bySource;

            const questionId = String(snapshot && snapshot.questionId || '');
            const byQuestionId = practiceItems.find((item) => {
                const marker = '::' + String(item && item.sourceKind || 'practice') + '::' + Number(item && item.sourceIndex || 0);
                return questionId.endsWith(marker);
            });
            if (byQuestionId) return byQuestionId;

            const snapshotQuestion = normalizeSentenceForTranslationMatch(
                (snapshot && (snapshot.questionHtml || snapshot.sentence || snapshot.question || snapshot.typingText)) || ''
            );
            if (snapshotQuestion) {
                const bySentence = practiceItems.find((item) => {
                    const currentSentence = normalizeSentenceForTranslationMatch(item && item.sentence);
                    return currentSentence === snapshotQuestion
                        || (currentSentence && snapshotQuestion.includes(currentSentence))
                        || (snapshotQuestion && currentSentence.includes(snapshotQuestion));
                });
                if (bySentence) return bySentence;
            }

            const correctAnswer = normalizeSentenceOptionValue(snapshot && (snapshot.correctAnswer || snapshot.answer));
            if (correctAnswer) {
                const byAnswer = practiceItems.find((item) => normalizeSentenceOptionValue(item && item.answer) === correctAnswer);
                if (byAnswer) return byAnswer;
            }

            return practiceItems.length === 1 ? practiceItems[0] : null;
        }

        function getCurrentSentenceTranslationForSnapshot(snapshot, baseWord) {
            const practiceItem = findCurrentPracticeSourceForSnapshot(snapshot, baseWord);
            if (practiceItem && practiceItem.cn) return getSentenceSourceMeta(baseWord, practiceItem).cn || '';

            const sourceKind = String(snapshot && snapshot.sourceKind || 'practice');
            const parsedIndex = parseInt(snapshot && snapshot.sourceIndex, 10);
            const sourceIndex = Number.isFinite(parsedIndex) ? parsedIndex : 0;
            if (sourceKind === 'example') {
                const examples = Array.isArray(baseWord && baseWord.examples) ? baseWord.examples : [];
                return String(examples[sourceIndex] && examples[sourceIndex].cn || '').trim();
            }
            const savedAnalysis = snapshot && snapshot.reviewAnalysis ? snapshot.reviewAnalysis : null;
            const savedTranslation = savedAnalysis && typeof savedAnalysis.sentenceTranslation === 'string'
                ? savedAnalysis.sentenceTranslation.trim()
                : '';
            return savedTranslation || getSentenceSourceMeta(baseWord).cn || '';
        }

        function normalizeSentencePresetOptions(rawOptions, correctAnswer) {
            const normalized = [];
            const seen = new Set();

            (Array.isArray(rawOptions) ? rawOptions : []).forEach((option) => {
                const value = normalizeSentenceOptionValue(option);
                if (!value || seen.has(value)) return;
                seen.add(value);
                normalized.push(value);
            });

            if (!correctAnswer || !seen.has(correctAnswer) || normalized.length < 4) {
                return null;
            }

            return normalized.slice(0, 4);
        }

        function buildSentenceFallbackOptions(correctWord, correctAnswer) {
            const options = [];
            const seen = new Set();
            const normalizedCorrect = normalizeSentenceOptionValue(correctAnswer);

            if (normalizedCorrect) {
                seen.add(normalizedCorrect);
                options.push(normalizedCorrect);
            }

            const answerPool = shuffleArray(
                (Array.isArray(ALL_DEFINED_WORDS) ? ALL_DEFINED_WORDS : [])
                    .filter((candidate) => candidate && candidate.word !== (correctWord && correctWord.word))
                    .map((candidate) => normalizeSentenceOptionValue(candidate && candidate.practice && candidate.practice.answer))
                    .filter((value) => value && !seen.has(value))
            );

            answerPool.forEach((value) => {
                if (options.length >= 4 || seen.has(value)) return;
                seen.add(value);
                options.push(value);
            });

            if (options.length < 4) {
                const fallbackSelf = normalizeSentenceOptionValue(
                    extractKanaDisplayTextFromWordHtml(correctWord && correctWord.word_html, correctWord && correctWord.word)
                );
                if (fallbackSelf && !seen.has(fallbackSelf)) {
                    seen.add(fallbackSelf);
                    options.push(fallbackSelf);
                }
            }

            if (options.length < 4) {
                const surfaceSelf = normalizeSentenceOptionValue(correctWord && correctWord.word);
                if (surfaceSelf && !seen.has(surfaceSelf)) {
                    seen.add(surfaceSelf);
                    options.push(surfaceSelf);
                }
            }

            return options.slice(0, 4);
        }

        let sentenceAnswerLookupCache = null;

        function normalizeSentenceLookupValue(value) {
            const normalized = normalizeSentenceOptionValue(value);
            return normalized ? toHiragana(normalized) : '';
        }

        function htmlToPlainText(html, options = {}) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = String(html || '');
            if (options.stripRuby) {
                wrapper.querySelectorAll('rt, rp').forEach((node) => node.remove());
            }
            return wrapper.textContent.replace(/\s+/g, ' ').trim();
        }

        function htmlNodeToPlainText(node, options = {}) {
            if (!node) return '';
            const clone = node.cloneNode(true);
            if (options.stripRuby) {
                clone.querySelectorAll('rt, rp').forEach((child) => child.remove());
            }
            return clone.textContent.replace(/\s+/g, ' ').trim();
        }

        function getWordDisplayText(word) {
            return htmlToPlainText(word && word.word_html ? word.word_html : '', { stripRuby: true }) || String(word && word.word || '').trim();
        }

        function getSentenceLookupValuesForWord(word) {
            const values = [
                getWordStorageId(word),
                word && word.word,
                getWordDisplayText(word),
                extractKanaDisplayTextFromWordHtml(word && word.word_html, word && word.word)
            ];
            getSentencePracticeItems(word).forEach((item) => {
                values.push(item && item.answer);
            });
            const analysisHelper = window.VocabularySentenceAnalysis;
            if (analysisHelper && typeof analysisHelper.getLookupValuesForWord === 'function') {
                values.push(...analysisHelper.getLookupValuesForWord(word, {
                    getKanaDisplayText: (candidate) => extractKanaDisplayTextFromWordHtml(candidate && candidate.word_html, candidate && candidate.word),
                    getPracticeItems: getSentencePracticeItems
                }));
            }
            return values.map((value) => normalizeSentenceOptionValue(value)).filter(Boolean);
        }

        function addSentenceLookupCandidate(lookup, rawValue, candidate) {
            const key = normalizeSentenceLookupValue(rawValue);
            if (!key) return;
            if (!lookup.has(key)) lookup.set(key, []);
            const list = lookup.get(key);
            const candidateId = getWordStorageId(candidate);
            if (!list.some((item) => getWordStorageId(item) === candidateId)) {
                list.push(candidate);
            }
        }

        function buildSentenceAnswerLookup() {
            if (sentenceAnswerLookupCache) return sentenceAnswerLookupCache;
            const pool = Array.isArray(ALL_DEFINED_WORDS) ? ALL_DEFINED_WORDS : [];
            const lookup = new Map();
            pool.forEach((candidate) => {
                getSentenceLookupValuesForWord(candidate).forEach((value) => {
                    addSentenceLookupCandidate(lookup, value, candidate);
                });
            });
            sentenceAnswerLookupCache = lookup;
            return lookup;
        }

        function findWordByStorageId(wordId) {
            const normalizedWordId = String(wordId || '').trim();
            if (!normalizedWordId) return null;
            const pool = Array.isArray(ALL_DEFINED_WORDS) ? ALL_DEFINED_WORDS : [];
            return pool.find((candidate) => getWordStorageId(candidate) === normalizedWordId || String(candidate && candidate.word || '').trim() === normalizedWordId) || null;
        }

        function extractWordIdFromSentenceQuestionId(questionId) {
            const parts = String(questionId || '').trim().split('::');
            if (parts.length < 4) return '';
            const sourceKind = parts[parts.length - 2];
            if (!['practice', 'practiceItem', 'example'].includes(sourceKind)) return '';
            return parts.slice(1, -2).join('::').trim();
        }

        function findWordBySentenceSnapshot(snapshot) {
            const directIds = [
                snapshot && snapshot.wordId,
                snapshot && snapshot.wordLabel,
                snapshot && snapshot.word && snapshot.word.wordId,
                snapshot && snapshot.word && snapshot.word.id,
                snapshot && snapshot.word && snapshot.word.word,
                extractWordIdFromSentenceQuestionId(snapshot && snapshot.questionId)
            ];
            for (const id of directIds) {
                const word = findWordByStorageId(id);
                if (word) return word;
            }

            const pool = Array.isArray(ALL_DEFINED_WORDS) ? ALL_DEFINED_WORDS : [];
            const snapshotQuestion = normalizeSentenceForTranslationMatch(
                (snapshot && (snapshot.questionHtml || snapshot.sentence || snapshot.question || snapshot.typingText)) || ''
            );
            if (snapshotQuestion) {
                const byQuestion = pool.find((candidate) => {
                    return getSentencePracticeItems(candidate).some((item) => {
                        const currentSentence = normalizeSentenceForTranslationMatch(item && item.sentence);
                        return currentSentence === snapshotQuestion
                            || (currentSentence && snapshotQuestion.includes(currentSentence))
                            || (snapshotQuestion && currentSentence.includes(snapshotQuestion));
                    });
                });
                if (byQuestion) return byQuestion;
            }

            const correctAnswer = normalizeSentenceLookupValue(snapshot && (snapshot.correctAnswer || snapshot.answer));
            if (correctAnswer) {
                const matches = pool.filter((candidate) => {
                    return getSentencePracticeItems(candidate).some((item) => {
                        return normalizeSentenceLookupValue(item && item.answer) === correctAnswer;
                    });
                });
                if (matches.length === 1) return matches[0];
            }

            return snapshot && snapshot.word ? snapshot.word : { word: snapshot && snapshot.wordLabel || '' };
        }

        function pickUniqueSentenceCandidate(candidates, optionValue) {
            const unique = [];
            (Array.isArray(candidates) ? candidates : []).forEach((candidate) => {
                const candidateId = getWordStorageId(candidate);
                if (!candidateId || unique.some((item) => getWordStorageId(item) === candidateId)) return;
                unique.push(candidate);
            });
            if (unique.length <= 1) return unique[0] || null;

            const optionKey = normalizeSentenceLookupValue(optionValue);
            const exactMatches = unique.filter((candidate) => {
                return getSentenceLookupValuesForWord(candidate).some((value) => normalizeSentenceLookupValue(value) === optionKey);
            });
            return exactMatches.length === 1 ? exactMatches[0] : null;
        }

        const SENTENCE_COLLOCATION_OVERRIDES = Object.freeze({
            '香ばしい': { phrase: '香ばしい匂い', cn: '烤制食物散发出的焦香' },
            '芳しい': { phrase: '芳しい香り', cn: '芬芳的香气' },
            '目ぼしい': { phrase: '目ぼしい人', cn: '值得注意的人、有希望的人选' },
            '手厚い': { phrase: '手厚いもてなし', cn: '周到的招待' }
        });

        function formatCollocationText(phrase, cn) {
            const phraseText = String(phrase || '').replace(/\s+/g, ' ').trim();
            const cnText = String(cn || '').replace(/\s+/g, ' ').trim();
            if (!phraseText) return '';
            return cnText ? phraseText + '（' + cnText + '）' : phraseText;
        }

        function trimJapanesePhraseTail(text) {
            return String(text || '')
                .replace(/^(は|が|を|に|へ|で|と|も|から|まで|より|の|、|。|！|？)+/, '')
                .replace(/(は|が|を|に|へ|で|と|も|から|まで|より|、|。|！|？).*$/, '')
                .trim();
        }

        function buildCollocationFromExample(example) {
            if (!(example && example.jp)) return '';
            const wrapper = document.createElement('div');
            wrapper.innerHTML = example.jp;
            const plainText = htmlNodeToPlainText(wrapper, { stripRuby: true });
            const highlight = wrapper.querySelector('.ex-highlight');
            const highlightedText = highlight ? htmlNodeToPlainText(highlight, { stripRuby: true }) : '';

            if (highlightedText) {
                const index = plainText.indexOf(highlightedText);
                if (index >= 0) {
                    const afterText = plainText.slice(index + highlightedText.length);
                    const nextChunk = trimJapanesePhraseTail(afterText).match(/^[ぁ-んァ-ヶー一-龯々〆ヵヶ]{1,8}/)?.[0] || '';
                    if (nextChunk) {
                        return formatCollocationText(highlightedText + nextChunk, example.cn);
                    }
                }
                const beforeText = plainText.slice(0, index).split(/[。！？、]/).pop().trim();
                const compactBefore = beforeText.length > 12 ? beforeText.slice(-12) : beforeText;
                if (compactBefore && /[ぁ-んァ-ヶー一-龯々〆ヵヶ]$/.test(compactBefore)) {
                    return formatCollocationText(compactBefore + highlightedText, example.cn);
                }
                return formatCollocationText(highlightedText, example.cn);
            }

            const firstClause = plainText.split(/[。！？]/).map((part) => part.trim()).find(Boolean) || '';
            if (!firstClause) return '';
            const clipped = firstClause.length > 24 ? firstClause.slice(0, 24) + '…' : firstClause;
            return formatCollocationText(clipped, example.cn);
        }

        function extractCommonCollocation(word) {
            const analysisHelper = window.VocabularySentenceAnalysis;
            if (analysisHelper && typeof analysisHelper.getCollocation === 'function') {
                return analysisHelper.getCollocation(word);
            }
            const displayText = getWordDisplayText(word);
            const override = SENTENCE_COLLOCATION_OVERRIDES[displayText] || SENTENCE_COLLOCATION_OVERRIDES[String(word && word.word || '').trim()];
            if (override) return formatCollocationText(override.phrase, override.cn);

            const examples = Array.isArray(word && word.examples) ? word.examples : [];
            const highlightedExample = examples.find((item) => item && item.jp && String(item.jp).includes('ex-highlight'));
            const fallbackExample = examples.find((item) => item && item.jp);
            return buildCollocationFromExample(highlightedExample || fallbackExample);
        }

        function extractPrimaryUsage(word) {
            const analysisHelper = window.VocabularySentenceAnalysis;
            if (analysisHelper && typeof analysisHelper.getPrimaryUsage === 'function') {
                return analysisHelper.getPrimaryUsage(word);
            }
            const rawText = String(word && word.nuance ? word.nuance : '')
                .split('\n')
                .map((line) => line.trim().replace(/^\d+\.\s*/, ''))
                .find(Boolean);
            return rawText || extractPrimaryMeaning(word);
        }

        function resolveSentenceOptionWord(word, optionValue, correctAnswer, optionWordIds, optionIndex) {
            const explicitWordId = Array.isArray(optionWordIds) ? optionWordIds[optionIndex] : null;
            if (explicitWordId) {
                const explicitWord = findWordByStorageId(explicitWordId);
                if (explicitWord) return explicitWord;
            }
            if (normalizeSentenceLookupValue(optionValue) === normalizeSentenceLookupValue(correctAnswer)) {
                return word;
            }
            const candidates = buildSentenceAnswerLookup().get(normalizeSentenceLookupValue(optionValue)) || [];
            return pickUniqueSentenceCandidate(candidates, optionValue);
        }

        function buildSentenceOptionDetails(word, options, correctAnswer, optionWordIds) {
            return (Array.isArray(options) ? options : []).map((optionValue, optionIndex) => {
                const resolvedWord = resolveSentenceOptionWord(word, optionValue, correctAnswer, optionWordIds, optionIndex);
                const analysisHelper = window.VocabularySentenceAnalysis;
                if (analysisHelper && typeof analysisHelper.buildOptionDetail === 'function') {
                    return analysisHelper.buildOptionDetail({
                        optionValue,
                        resolvedWord,
                        isCorrect: normalizeSentenceLookupValue(optionValue) === normalizeSentenceLookupValue(correctAnswer),
                        getWordId: getWordStorageId
                    });
                }
                const meaning = resolvedWord ? extractPrimaryMeaning(resolvedWord) : '';
                const usage = resolvedWord ? extractPrimaryUsage(resolvedWord) : meaning;
                const collocation = resolvedWord ? extractCommonCollocation(resolvedWord) : '';
                return {
                    value: optionValue,
                    wordId: getWordStorageId(resolvedWord),
                    wordLabel: resolvedWord && resolvedWord.word ? resolvedWord.word : optionValue,
                    meaning,
                    usage,
                    collocation,
                    isResolved: Boolean(resolvedWord),
                    isCorrect: normalizeSentenceLookupValue(optionValue) === normalizeSentenceLookupValue(correctAnswer)
                };
            });
        }

        function buildSentenceCorrectAnalysis(word, explicitAnalysis, optionDetails) {
            if (explicitAnalysis) return explicitAnalysis;
            const correctOption = Array.isArray(optionDetails) ? optionDetails.find((item) => item && item.isCorrect) : null;
            const parts = [];
            const meaning = correctOption && correctOption.meaning ? correctOption.meaning : extractPrimaryMeaning(word);
            const usage = correctOption && correctOption.usage ? correctOption.usage : extractPrimaryUsage(word);
            const collocation = correctOption && correctOption.collocation ? correctOption.collocation : extractCommonCollocation(word);
            if (meaning) parts.push('释义：' + meaning);
            if (usage && usage !== meaning) parts.push('用法：' + usage);
            if (collocation) parts.push('常见搭配：' + collocation);
            return parts.join('\n');
        }

        function createSentenceQuestionId(word, sourceKind, sourceIndex) {
            return SENTENCE_REVIEW_MODULE_KEY + '::' + getWordStorageId(word) + '::' + sourceKind + '::' + sourceIndex;
        }

        function buildSentenceReviewAnalysis(word, sentenceTranslation, explicitAnalysis, optionDetails) {
            const analysisHelper = window.VocabularySentenceAnalysis;
            if (analysisHelper && typeof analysisHelper.buildReviewAnalysis === 'function') {
                return analysisHelper.buildReviewAnalysis({
                    word,
                    sentenceTranslation,
                    optionDetails,
                    getWordId: getWordStorageId
                });
            }
            return {
                sentenceTranslation: sentenceTranslation || '',
                correctAnalysis: buildSentenceCorrectAnalysis(word, explicitAnalysis, optionDetails),
                options: Array.isArray(optionDetails) ? optionDetails : []
            };
        }

        function createSentenceQuestionSnapshot(question) {
            if (!question || question.kind !== 'sentence') return null;
            return {
                questionId: question.questionId,
                moduleKey: SENTENCE_REVIEW_MODULE_KEY,
                wordId: getWordStorageId(question.word),
                wordLabel: question.word && question.word.word ? question.word.word : '',
                sourceKind: question.sourceKind || 'practice',
                sourceIndex: Number.isFinite(question.sourceIndex) ? question.sourceIndex : 0,
                kind: 'sentence',
                answerMode: 'choice',
                questionHtml: question.questionHtml,
                sentenceCn: question.sentenceCn || '',
                cn: question.cn || '',
                correctAnswer: question.correctAnswer,
                options: Array.isArray(question.options) ? question.options.slice() : [],
                optionWordIds: Array.isArray(question.optionWordIds) ? question.optionWordIds.slice() : [],
                optionDetails: Array.isArray(question.optionDetails) ? question.optionDetails.map((item) => ({ ...item })) : [],
                reviewAnalysis: question.reviewAnalysis ? {
                    sentenceTranslation: question.reviewAnalysis.sentenceTranslation || '',
                    correct: question.reviewAnalysis.correct ? { ...question.reviewAnalysis.correct } : null,
                    distractors: Array.isArray(question.reviewAnalysis.distractors)
                        ? question.reviewAnalysis.distractors.map((item) => ({ ...item }))
                        : [],
                    correctAnalysis: question.reviewAnalysis.correctAnalysis || '',
                    options: Array.isArray(question.reviewAnalysis.options)
                        ? question.reviewAnalysis.options.map((item) => ({ ...item }))
                        : []
                } : null,
                typingText: question.typingText || '',
                hintText: question.hintText || '',
                word: cloneLiteWord(question.word)
            };
        }

        function isSentenceReviewMode(question = questions[currentQuestionIndex]) {
            const context = getPracticeContext();
            return Boolean(
                context &&
                context.mode === 'review' &&
                dailyPracticeType === 'sentence' &&
                question &&
                question.kind === 'sentence'
            );
        }

        function clearSentenceReviewAnalysis() {
            if (!challengeAnalysis) return;
            challengeAnalysis.innerHTML = '';
            challengeAnalysis.classList.add('hidden');
        }

        function renderSentenceReviewAnalysis(question) {
            if (!challengeAnalysis) return;
            const reviewAnalysis = question && question.reviewAnalysis;
            if (!reviewAnalysis) {
                clearSentenceReviewAnalysis();
                return;
            }
            const analysisHelper = window.VocabularySentenceAnalysis;
            if (analysisHelper && typeof analysisHelper.renderReviewAnalysis === 'function') {
                const analysisHtml = analysisHelper.renderReviewAnalysis(reviewAnalysis, { escapeHtml });
                if (analysisHtml) {
                    challengeAnalysis.innerHTML = analysisHtml;
                    challengeAnalysis.classList.remove('hidden');
                    return;
                }
            }

            const blocks = [];
            if (reviewAnalysis.sentenceTranslation) {
                blocks.push('<div class="challenge-analysis-block"><span class="challenge-analysis-label">句子翻译</span><div class="challenge-analysis-copy">' + escapeHtml(reviewAnalysis.sentenceTranslation) + '</div></div>');
            }
            if (reviewAnalysis.correctAnalysis) {
                blocks.push('<div class="challenge-analysis-block"><span class="challenge-analysis-label">正确项说明</span><div class="challenge-analysis-copy">' + escapeHtml(reviewAnalysis.correctAnalysis).replace(/\n/g, '<br>') + '</div></div>');
            }

            const distractorOptions = Array.isArray(reviewAnalysis.options)
                ? reviewAnalysis.options.filter((option) => option && !option.isCorrect)
                : [];
            if (distractorOptions.length > 0) {
                const optionsHtml = distractorOptions.map((option) => {
                    const detailLines = [];
                    if (option.meaning) detailLines.push('释义：' + escapeHtml(option.meaning));
                    if (option.usage) detailLines.push('用法：' + escapeHtml(option.usage));
                    if (option.collocation) detailLines.push('常见搭配：' + escapeHtml(option.collocation));
                    if (detailLines.length === 0) {
                        detailLines.push('形式：' + escapeHtml(option.value || ''));
                        detailLines.push('解析：请结合题干语境与其他选项排除。');
                    }
                    return '<div class="challenge-analysis-option"><div class="challenge-analysis-option-head">' + escapeHtml(option.wordLabel || option.value || '') + '</div><div class="challenge-analysis-option-copy">' + detailLines.join('<br>') + '</div></div>';
                }).join('');
                blocks.push('<div class="challenge-analysis-block"><span class="challenge-analysis-label">选项辨析</span><div class="challenge-analysis-option-list">' + optionsHtml + '</div></div>');
            }

            challengeAnalysis.innerHTML = '<span class="challenge-analysis-title">解析</span>' + blocks.join('');
            challengeAnalysis.classList.remove('hidden');
        }

        function recordSentenceQuestionWrong(question) {
            if (!sentenceReviewStore || !question || question.kind !== 'sentence') return;
            const snapshot = createSentenceQuestionSnapshot(question);
            if (!snapshot || !snapshot.questionId || !snapshot.wordId) return;
            sentenceReviewStore.saveQuestion(SENTENCE_REVIEW_MODULE_KEY, snapshot);
            sentenceReviewStore.incrementWordMistakeCount(SENTENCE_REVIEW_MODULE_KEY, snapshot.wordId, 1);
        }

        function removeSentenceReviewQuestion(question) {
            if (!sentenceReviewStore || !question || !question.questionId) return;
            sentenceReviewStore.removeQuestion(SENTENCE_REVIEW_MODULE_KEY, question.questionId);
        }

        function shouldRebuildSentenceReviewQuestion(snapshot, baseWord, practiceItem) {
            if (!practiceItem) return false;
            const snapshotKind = String(snapshot && snapshot.sourceKind || 'practice');
            const snapshotIndex = Number.isFinite(parseInt(snapshot && snapshot.sourceIndex, 10))
                ? parseInt(snapshot && snapshot.sourceIndex, 10)
                : 0;
            const currentKind = String(practiceItem && practiceItem.sourceKind || 'practice');
            const currentIndex = Number(practiceItem && practiceItem.sourceIndex || 0);
            if (snapshotKind !== currentKind || snapshotIndex !== currentIndex) return true;

            const snapshotQuestion = normalizeSentenceForTranslationMatch(
                (snapshot && (snapshot.questionHtml || snapshot.sentence || snapshot.question || snapshot.typingText)) || ''
            );
            const currentSentence = normalizeSentenceForTranslationMatch(practiceItem && practiceItem.sentence);
            if (currentSentence && snapshotQuestion && !snapshotQuestion.includes(currentSentence) && !currentSentence.includes(snapshotQuestion)) {
                return true;
            }

            const sourceTranslation = String(practiceItem && practiceItem.cn || '').trim();
            return Boolean(sourceTranslation && String(snapshot && snapshot.questionHtml || '').includes(sourceTranslation));
        }

        function getSentenceReviewQuestions() {
            if (!sentenceReviewStore) return [];
            return sentenceReviewStore.listQuestions(SENTENCE_REVIEW_MODULE_KEY)
                .map((snapshot) => {
                    if (!snapshot || snapshot.kind !== 'sentence' || !snapshot.questionId) return null;
                    const baseWord = findWordBySentenceSnapshot(snapshot);
                    const practiceItem = findCurrentPracticeSourceForSnapshot(snapshot, baseWord);
                    const rebuiltQuestion = shouldRebuildSentenceReviewQuestion(snapshot, baseWord, practiceItem)
                        ? buildSentenceQuestionSpec(baseWord, practiceItem)
                        : null;
                    const correctAnswer = rebuiltQuestion ? rebuiltQuestion.correctAnswer : snapshot.correctAnswer;
                    const options = rebuiltQuestion && Array.isArray(rebuiltQuestion.options)
                        ? rebuiltQuestion.options.slice()
                        : (Array.isArray(snapshot.options) ? snapshot.options.slice() : []);
                    const optionWordIds = rebuiltQuestion && Array.isArray(rebuiltQuestion.optionWordIds)
                        ? rebuiltQuestion.optionWordIds.slice()
                        : (Array.isArray(snapshot.optionWordIds) ? snapshot.optionWordIds : []);
                    const optionDetails = buildSentenceOptionDetails(baseWord, options, correctAnswer, optionWordIds);
                    const savedAnalysis = snapshot.reviewAnalysis || {};
                    const savedCorrectAnalysis = String(savedAnalysis.correctAnalysis || '').trim();
                    const explicitAnalysis = savedCorrectAnalysis && !/^释义：/m.test(savedCorrectAnalysis) ? savedCorrectAnalysis : '';
                    const currentSentenceTranslation = getCurrentSentenceTranslationForSnapshot(snapshot, baseWord);
                    const reviewAnalysis = buildSentenceReviewAnalysis(
                        baseWord,
                        currentSentenceTranslation,
                        explicitAnalysis,
                        optionDetails
                    );
                    return {
                        ...snapshot,
                        ...(rebuiltQuestion ? {
                            sourceKind: rebuiltQuestion.sourceKind,
                            sourceIndex: rebuiltQuestion.sourceIndex,
                            questionHtml: rebuiltQuestion.questionHtml,
                            cn: rebuiltQuestion.cn || '',
                            sentenceCn: rebuiltQuestion.sentenceCn || '',
                            correctAnswer,
                            typingText: rebuiltQuestion.typingText || ''
                        } : {}),
                        questionId: snapshot.questionId,
                        kind: 'sentence',
                        answerMode: 'choice',
                        word: baseWord,
                        options,
                        optionWordIds,
                        optionDetails,
                        reviewAnalysis
                    };
                })
                .filter(Boolean);
        }

        function normalizeDialogueBodyText(text) {
            return String(text || '')
                .replace(/\r\n?/g, '\n')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{2,}/g, '\n')
                .trim();
        }

        function buildDialogueTypingText(speaker, bodyText) {
            return `${speaker}：\n「${normalizeDialogueBodyText(bodyText)}」`;
        }

        function buildQuestionTypingText(bodyText) {
            return `「${normalizeDialogueBodyText(bodyText)}」`;
        }

        function buildDialogueQuestionHtml(bodyHtml) {
            const normalizedHtml = String(bodyHtml || '').replace(/(?:<br>\s*)+$/g, '').trim();
            return `「${normalizedHtml}」`;
        }

        function buildSentenceQuestionSpec(word, practiceItem = null) {
            const sourceMeta = getSentenceSourceMeta(word, practiceItem);
            let questionHtml = sourceMeta.sentence;
            let questionCn = sourceMeta.cn || '';

            let richSentence = questionHtml;

            const highlightRegex = /<span class=['"]ex-highlight['"]>(.*?)<\/span>/g;
            const renderedBlankRegex = /<span class=['"][^'"]*\bblank-space\b[^'"]*['"]>\s*<\/span>/g;
            const existingBlankRegex = /(_{2,}|＿{2,}|\(\s*\)|（\s*）)/g;

            if (richSentence.match(renderedBlankRegex)) {
                richSentence = richSentence.replace(renderedBlankRegex, '[[BLANK]]');
            } else if (richSentence.match(highlightRegex)) {
                richSentence = richSentence.replace(highlightRegex, '[[BLANK]]');
            } else if (richSentence.match(existingBlankRegex)) {
                richSentence = richSentence.replace(existingBlankRegex, '[[BLANK]]');
            } else {
                const escapeRegExp = (string) => string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const stem = word.word.length > 1 ? word.word.slice(0, -1) : word.word;
                const stemRegex = new RegExp(`${escapeRegExp(stem)}[ぁ-ん]*`);
                if (stemRegex.test(richSentence)) {
                    richSentence = richSentence.replace(stemRegex, '[[BLANK]]');
                } else {
                    richSentence += ' [[BLANK]]';
                }
            }

            let plainSentence = richSentence.replace(/<[^>]+>/g, '').replace(/\[\[BLANK\]\]/g, '________');
            richSentence = richSentence.replace(/\[\[BLANK\]\]/g, '<span class="blank-space"></span>');

            const correctAnswer = getSentenceCorrectAnswer(word);
            const presetOptions = normalizeSentencePresetOptions(
                practiceItem && Array.isArray(practiceItem.options)
                    ? practiceItem.options
                    : word && word.practice && word.practice.options,
                correctAnswer
            );
            const optionPool = presetOptions || buildSentenceFallbackOptions(word, correctAnswer);
            if (!correctAnswer || optionPool.length < 2) return null;
            const options = shuffle(optionPool.slice());
            const optionDetails = buildSentenceOptionDetails(word, options, correctAnswer, sourceMeta.optionWordIds);
            const reviewAnalysis = buildSentenceReviewAnalysis(word, questionCn, sourceMeta.analysis, optionDetails);

            return {
                kind: 'sentence',
                answerMode: 'choice',
                questionId: createSentenceQuestionId(word, sourceMeta.sourceKind, sourceMeta.sourceIndex),
                sourceKind: sourceMeta.sourceKind,
                sourceIndex: sourceMeta.sourceIndex,
                word,
                questionHtml: `${buildDialogueQuestionHtml(richSentence)}<br><br><span class="question-sub-text">结合语境，选择最合适的词汇。</span>`,
                cn: questionCn,
                sentenceCn: questionCn,
                correctAnswer,
                options,
                optionDetails,
                optionWordIds: Array.isArray(sourceMeta.optionWordIds) ? sourceMeta.optionWordIds.slice() : [],
                reviewAnalysis,
                hintText: '',
                typingText: buildQuestionTypingText(plainSentence)
            };
        }

        function buildReadingQuestionSpec(word) {
            const prompt = getReadingPromptForWord(word);
            if (!prompt || !prompt.surfaceText || !prompt.fullKana || prompt.editableCount <= 0) return null;

            return {
                kind: 'reading',
                answerMode: 'input',
                word,
                questionHtml: `${buildDialogueQuestionHtml(escapeHtml(prompt.surfaceText))}<br><br><span class="question-sub-text">请准确拼写出该词的读音。</span>`,
                cn: '',
                correctAnswer: prompt.fullKana,
                options: [],
                readingSegments: prompt.segments,
                editableCount: prompt.editableCount,
                inputLength: prompt.editableCount,
                hintText: prompt.firstHint,
                firstHint: prompt.firstHint,
                typingText: buildQuestionTypingText(prompt.surfaceText)
            };
        }

        function buildMeaningDistractors(correctWord, sourcePool) {
            const correctMeaning = extractPrimaryMeaning(correctWord);
            const pool = [];
            const seen = new Set([correctMeaning]);
            const globalWords = typeof ALL_DEFINED_WORDS !== 'undefined' && Array.isArray(ALL_DEFINED_WORDS)
                ? ALL_DEFINED_WORDS
                : [];
            const candidates = shuffleArray([...(Array.isArray(sourcePool) ? sourcePool : []), ...globalWords]);
            candidates.forEach((word) => {
                if (!word || word.word === correctWord.word) return;
                const meaning = extractPrimaryMeaning(word);
                if (!meaning || seen.has(meaning)) return;
                seen.add(meaning);
                pool.push(meaning);
            });
            return pool.slice(0, 3);
        }

        function buildMeaningQuestionSpec(word, sourcePool) {
            const kanaText = extractKanaDisplayTextFromWordHtml(word && word.word_html, word && word.word);
            const primaryMeaning = extractPrimaryMeaning(word);
            if (!kanaText || !primaryMeaning) return null;
            const distractors = buildMeaningDistractors(word, sourcePool);
            if (distractors.length < 3) return null;

            return {
                kind: 'meaning',
                answerMode: 'choice',
                word,
                questionHtml: `${buildDialogueQuestionHtml(escapeHtml(kanaText))}<br><br><span class="question-sub-text">它的核心释义是什么？请仔细辨析。</span>`,
                cn: '',
                correctAnswer: primaryMeaning,
                options: shuffle([primaryMeaning, ...distractors]),
                hintText: '',
                typingText: buildQuestionTypingText(kanaText)
            };
        }

        function clearTimer() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
        }

        function startTimer() {
            clearTimer();
            const timerShell = document.getElementById('timer-shell');
            const timerBar = document.getElementById('timer-bar');
            if (!(isChallengeMode && selectedDifficulty === 'hell')) {
                timerShell.classList.add('hidden');
                timerBar.classList.remove('warning');
                timerBar.style.width = '100%';
                return;
            }

            timerShell.classList.remove('hidden');
            timeLeft = 10;
            totalTime = 10000;
            timerBar.classList.remove('warning');
            timerBar.style.width = '100%';

            timerId = setInterval(() => {
                timeLeft -= 0.05;
                const percentage = Math.max(0, (timeLeft * 1000) / totalTime * 100);
                timerBar.style.width = `${percentage}%`;
                if (percentage <= 30) {
                    timerBar.classList.add('warning');
                }
                if (timeLeft <= 0) {
                    clearTimer();
                    handleTimeout();
                }
            }, 50);
        }

        function handleTimeout() {
            if (!isAnswering) return;
            checkAnswer(null, null, true);
        }

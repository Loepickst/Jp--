<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N2 課題理解 - 2020</title>
    <!-- 使用与练习页一致的书面/印刷感字体组合 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../shared/site-fonts.css">
    <link rel="stylesheet" href="../../../shared/listening-practice-redesign.css?v=20260811-tooltip-all">
    <link rel="stylesheet" href="../shared/follow-listening.css?v=20260814-n2-manual-2010-7-r1">
</head>
<body>

    <header>
        <a href="../index.html" class="back-btn" id="backButton">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            戻る
        </a>
        <h1 id="yearLabel">課題理解 (N2)</h1>
        <div style="width: 60px;"></div>
    </header>

    <div class="practice-container mode-practice" id="appContainer">
        
        <div class="card-header">
            <div class="header-left">
                <select id="questionSelect" class="question-select" onchange="changeQuestion(this.value)"></select>
                <button type="button" id="markBtn" class="mark-btn" onclick="toggleMark()" title="付箋を貼る (标记/收藏)" aria-label="付箋を貼る">🐶</button>
            </div>
            <div class="mode-switch">
                <button id="btnPractice" class="active" onclick="setMode('practice')">✎ 演習ノート</button>
                <button id="btnExplanation" onclick="setMode('explanation')">✔ 赤ペン解説</button>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="right-panel" id="rightPanel">
                
                <!-- 听力原文与翻译区块 (练习模式下隐藏) -->
                <div class="transcript-section sketch-box" id="transcriptBlock">
                    <!-- 问题区块 -->
                    <div class="question-box">
                        <div id="questionText"></div>
                        <div class="translation" id="questionTrans"></div>
                    </div>

                    <!-- 对话区块 -->
                    <div class="conversation-box" id="conversationText">
                        <!-- 由JS填充对话内容 -->
                    </div>
                </div>

                <div class="question-image-area" id="questionImageArea" aria-live="polite">
                    <img id="questionImage" alt="">
                </div>

                <!-- 选项列表 (练习模式下保持可见) -->
                <ul class="options-list" id="optionsList"></ul>
            </div>
        </div>
    </div>

    <!-- 底部音频播放器 -->
    <div class="audio-wrapper">
        <div class="custom-audio-player">
            <div class="now-playing-box">
                <div class="track-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <div class="now-playing-content">
                    <div class="track-header-row">
                        <div class="track-info">
                            <div class="track-title" id="trackTitle">問題 1</div>
                            <div class="track-subtitle" id="trackSubtitle" style="display:none;"></div>
                        </div>
                        <div class="time-group">
                            <span class="time-display time-current" id="timeCurrent">0:00</span>
                            <span class="time-display time-divider" style="margin: 0 4px;">/</span>
                            <span class="time-display time-duration desktop-time" id="timeDurationDesktop">0:00</span>
                            <span class="time-display time-duration mobile-time" id="timeDurationMobile" style="display: none;">-0:00</span>
                        </div>
                    </div>
                    <div class="progress-area">
                        <div class="progress-container" id="progressContainer">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 控制组 -->
            <div class="player-controls">
                <button id="prevBtn" class="ctrl-btn nav-btn" onclick="prevQuestion()" title="前へ">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h2v12H3zM13 6v12L5 12zM21 6v12L13 12z"/></svg>
                </button>
                <button id="rewindBtn" class="ctrl-btn skip-btn" title="6秒戻る">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><text x="12" y="16.5" font-size="8.5" font-weight="900" font-family="sans-serif" stroke-width="0" fill="currentColor" text-anchor="middle">6</text></svg>
                </button>
                <button class="ctrl-btn play-btn" id="playBtn">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="forwardBtn" class="ctrl-btn skip-btn" title="6秒進む">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><text x="12" y="16.5" font-size="8.5" font-weight="900" font-family="sans-serif" stroke-width="0" fill="currentColor" text-anchor="middle">6</text></svg>
                </button>
                <button id="nextBtn" class="ctrl-btn nav-btn" onclick="nextQuestion()" title="次へ">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6v12L11 12zM11 6v12L19 12zM19 6h2v12H19z"/></svg>
                </button>
                <button id="loopBtn" class="ctrl-btn loop-btn" title="ループ再生">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                </button>
                <button id="speedBtn" class="ctrl-btn speed-btn" title="再生速度">1.0x</button>
            </div>
            
            <audio id="audioElement" preload="metadata"></audio>
        </div>
    </div>

    <div id="wordTooltip" class="custom-tooltip"></div>

    <script src="../../../shared/audio-player-theme.js?v=20260811-integrated-options"></script>
    <script src="../../../shared/listening-progress.js"></script>
    <script src="../../../../../shared/study-quest-test-runtime.js"></script>
    <script src="../../../../../shared/study-quest-test-boot.js"></script>
    <script src="../../../shared/listening-reward-hooks.js"></script>
    <script src="../shared/follow-listening-timelines.js?v=20260814-n2-manual-2010-7-r1"></script>
    <script src="../shared/follow-listening.js?v=20260814-n2-follow-header-r2"></script>
    <script>
        // --- Data Structure ---
        const examData = {
  "N2-2020-12": {
    "label": "2020年12月 (N2)",
    "questions": [
      {
        "id": 1,
        "question": "駅のホームで女の人と駅員が話しています。女の人はこのあとまず何をしますか。",
        "questionTrans": "（在车站站台上，女人和站员在说话。女人接下来首先要做什么？）",
        "audio": "../assets/audio/2020.12-1.mp3",
        "dialogue": [
          { "speaker": "女", "text": "あのう、すみません。赤い傘の忘れ物なかったでしょうか。このあたりにおいたと思って<span class=\"keyword\" data-tooltip=\"探す：寻找\">探してみた</span>んですが、ないんです。一時間ぐらい前なんですけど。", "trans": "（那个，打扰一下。请问有没有捡到一把红色的伞？我记得是放在这附近了，但找了一圈没找着。大概是一个小时前丢的。）" },
          { "speaker": "男", "text": "傘ですか。<span class=\"highlight-wrong explain-wrong\" data-explain=\"保洁员刚才确实在站台，但站员并没有让女士去找她问，而是直接指引她去办事处。\">②さっきまで掃除の人がいましたけどね。</span><span class=\"highlight-correct\">③<span class=\"keyword\" data-tooltip=\"見つかる：找到\">見つかった</span>忘れ物は駅の事務所に置いてあるので。行って聞いてみてください。改札の隣です。</span>", "trans": "（伞啊。刚才保洁阿姨倒还在这一块儿。找回来的失物一般都收在车站的办事处了。您去那边问问看吧，就在检票口旁边。）" },
          { "speaker": "女", "text": "ありがとうございます。", "trans": "（谢谢。）" },
          { "speaker": "男", "text": "<span class=\"highlight-wrong explain-wrong\" data-explain=\"站员原话说的是‘如果办事处没有的话’才去失物中心，这是后续的备选方案，而非当下的首要行动。\">④もし事務所になかったら、隣の山川駅の忘れ物センターに聞いてみてもいいかもしれませんね。</span><span class=\"keyword\" data-tooltip=\"まれに：偶尔\">まれに</span>拾った方がそちらに<span class=\"keyword\" data-tooltip=\"お届けになる：送到\">お届けになる</span>こともありますから。", "trans": "（要是办事处那边也没有，您也可以试着问问隔壁山川站的失物招领中心。有时候捡到的人会顺手交到那边去。）" },
          { "speaker": "女", "text": "分かりました。", "trans": "（明白了。）" }
        ],
        "options": [
          { "text": "ホームで忘れ物をさがす", "trans": "（在站台找遗失物）", "correct": false, "explain": "女士开头就提到“找了一圈没找着”，说明在站台寻找已经是发生过的动作。随后站员指引她去办事处，所以她接下来不需要继续在站台瞎找了。" },
          { "text": "掃除の人に忘れ物がないか聞く", "trans": "（问清扫人员有没有遗失物）", "correct": false, "explain": "站员提到保洁员只是为了说明刚才有人在附近，但他给出的实质性建议是去检票口旁边的办事处，并未指示女士去盘问保洁员。" },
          { "text": "事務所で忘れ物がないかたずねる", "trans": "（去事务所询问有没有遗失物）", "correct": true, "explain": "对应原文站员的指示：“找回来的失物一般都收在车站的办事处了。您去那边问问看吧”，这是指引女士当下首要去执行的动作。" },
          { "text": "忘れ物センターに問い合わせる", "trans": "（联系失物中心）", "correct": false, "explain": "根据原文“要是办事处那边也没有……”，去失物招领中心是建立在办事处没找到的前提下的备选方案，不是眼下第一步要做的事。" }
        ]
      },
      {
        "id": 2,
        "question": "会社で男の人と女の人が話しています。男の人は語学の勉強のためにまず何をしますか。",
        "questionTrans": "（在公司，男人和女人在说话。男人为了学习语言首先要做什么？）",
        "audio": "../assets/audio/2020.12-2.mp3",
        "dialogue": [
          { "speaker": "男", "text": "この間、課長に、来年あたり海外勤務になるかもしれないから、<span class=\"keyword\" data-tooltip=\"準備する：准备\">準備しておく</span>ようにって言われたんですよ。", "trans": "（前阵子科长跟我透了个底，说明年左右可能会派我出国常驻，让我趁早准备准备。）" },
          { "speaker": "女", "text": "そう？", "trans": "（是吗？）" },
          { "speaker": "男", "text": "今のうちに語学の勉強をしなきゃって思ってるんですが、何かいい方法ありませんか。", "trans": "（我就琢磨着得趁现在赶紧把外语捡起来，你有什么好门道没？）" },
          { "speaker": "女", "text": "そうね、<span class=\"highlight-wrong explain-wrong\" data-explain=\"女士确实推荐了公司培训，但男士紧接着说自己加班出差多抽不出空，所以实际上并没有采纳。\">①うちの会社でも語学の研修やってるでしょう。参加してる？</span>", "trans": "（我想想啊，咱们公司内部不是有外语培训班嘛，你报了没？）" },
          { "speaker": "男", "text": "残業や出張が多いので、なかなか。", "trans": "（平时不是加班就是出差，实在抽不出空去啊。）" },
          { "speaker": "女", "text": "じゃ、通信教育がいいんじゃない？<span class=\"highlight-correct\">②移動中も勉強出来るし。高くなくて、いいの知ってるから、あとでメールで教えようか。</span>", "trans": "（那试试报个网课呗？路上通勤的时候也能跟着学。而且费用也不高，我刚好知道个挺靠谱的，回头把链接发你邮箱。）" },
          { "speaker": "男", "text": "<span class=\"highlight-correct\">②ええ、ぜひ。時間を<span class=\"keyword\" data-tooltip=\"有効に：有效\">有効に</span><span class=\"keyword\" data-tooltip=\"活用する：利用\">活用できて</span>いいですね。</span>", "trans": "（行啊，那就多谢啦。能把碎片时间用起来确实挺好。）" },
          { "speaker": "女", "text": "ただ、あれは聞くのには慣れても、話すのがね。<span class=\"highlight-wrong explain-wrong\" data-explain=\"认识外国朋友是在‘耳朵稍微习惯点儿了’之后的下一阶段计划，现在做还为时过早。\">③少し<span class=\"keyword\" data-tooltip=\"耳が慣れる：习惯听力\">耳が慣れて</span>きたら、外国人の友達紹介するから、あってみるといいよ。</span>話すと会話の練習にもなるし。実践が一番だからね。", "trans": "（不过那种网课用来练听力还行，练口语就差点意思了。等你耳朵稍微习惯点儿了，我介绍几个外国朋友给你认识，大家平时出来坐坐。能开口交流的话正好练练嘴皮子。毕竟实战出真知嘛。）" },
          { "speaker": "男", "text": "何から何まですみません。慣れたらお願いします。", "trans": "（真是太麻烦你了。等我学顺手了可得仰仗你帮忙啊。）" },
          { "speaker": "女", "text": "あとは<span class=\"highlight-wrong explain-wrong\" data-explain=\"报名考试是等‘实力提升后’再去尝试的事，并不是当前的初步行动。\">④語学試験に申し込んでみるのもいいんじゃない？</span>目標があれば、一人でも勉強を続けようっていう気持ちになるし。", "trans": "（另外，也可以考虑报个外语考试试试水？毕竟有个盼头的话，一个人单刷也会比较有动力。）" },
          { "speaker": "男", "text": "そうですね。<span class=\"keyword\" data-tooltip=\"力がつく：提升实力\">力がついて</span>きたらやってみます。", "trans": "（有道理。等我水平再稍微上去点儿了就去报个名。）" }
        ],
        "options": [
          { "text": "会社のけんしゅうに参加する", "trans": "（参加公司的培训）", "correct": false, "explain": "女士一开始确实提到了公司内部的语言培训，但男士立马诉苦说自己“平时不是加班就是出差，实在抽不出空去”，直接否定了这个方案。" },
          { "text": "通信教育を受ける", "trans": "（接受通信教育）", "correct": true, "explain": "在排除了公司培训后，女士推荐了时间灵活的网课（通信教育），男士觉得这样能有效利用时间并给出了明确肯定的答复（ええ、ぜひ），这是他接下来的首要动作。" },
          { "text": "外国人の友達と話す", "trans": "（和外国朋友说话）", "correct": false, "explain": "原文里女士加了个前提条件：“等你耳朵稍微习惯点儿了”。这说明找外国朋友练口语是听力有起色之后的进阶计划，不是刚起步时要做的。" },
          { "text": "試験に申し込む", "trans": "（报名考试）", "correct": false, "explain": "针对报名考试的提议，男士的回答是“等我水平再稍微上去点儿了就去报个名”。显然这也是属于未来的长期规划，而非眼下的第一步。" }
        ]
      },
      {
        "id": 3,
        "question": "会社で女の人と男の人が話しています。女の人は倉庫に入るとき、どの順番で入口のボタンを押さなければなりませんか。",
        "questionTrans": "（在公司，女人和男人在说话。女人进仓库时需要按什么顺序按入口按钮？）",
        "audio": "../assets/audio/2020.12-3.mp3",
        "image": "../assets/images/2020.12-3.png",
        "dialogue": [
          { "speaker": "女", "text": "すみません。地下の倉庫に行って、資料を<span class=\"keyword\" data-tooltip=\"取ってくる：拿来\">取ってきたい</span>んですが、入口の開け方がわからなくて。", "trans": "（打扰一下。我想去地下仓库拿点资料，但这入口的门我不知道咋开。）" },
          { "speaker": "男", "text": "ああ、最近、管理が<span class=\"keyword\" data-tooltip=\"厳しい：严格\">厳しく</span>なって、入口の横のボタンを<span class=\"keyword\" data-tooltip=\"押す：按\">押さない</span>とだめなんだよ。倉庫は三つあるけど、何番の？", "trans": "（哦，最近这块儿管得比较严，得按入口旁边的密码键盘才行。底下有三个仓库，你要去几号？）" },
          { "speaker": "女", "text": "ええと、二番です。", "trans": "（嗯，是二号。）" },
          { "speaker": "男", "text": "じゃ、倉庫の番号は002だね。それと、暗証番号も必要だよ。", "trans": "（那仓库编号就是002。对了，还需要输密码的哦。）" },
          { "speaker": "女", "text": "そうですか。暗証番号は？", "trans": "（这样啊。密码是？）" },
          { "speaker": "男", "text": "<span class=\"highlight-correct\">④725だよ。ドアの横のボタンを暗証番号、「開く」のボタン、倉庫の番号、「開く」のボタンの順で押して。</span>そうすれば、すぐドアが開くから。", "trans": "（密码是725。你按门旁边的键盘时，依次输入密码、按一下“打开”、输入仓库编号、再按一下“打开”。按完门自己就开了。）" },
          { "speaker": "女", "text": "<span class=\"highlight-wrong explain-wrong\" data-explain=\"女士复述的步骤有遗漏且顺序颠倒，她把仓库编号放在了前面，并且少按了一次“打开”。\">①②③暗証番号、開く、倉庫の番号。</span>", "trans": "（先密码，按打开，然后输入仓库号。）" },
          { "speaker": "男", "text": "<span class=\"highlight-correct\">④そのあとに、「開く」だよ。</span>", "trans": "（弄完这些最后还得再按一下“打开”。）" },
          { "speaker": "女", "text": "はい、わかりました。ありがとうございます。", "trans": "（好的，明白了。谢谢。）" }
        ],
        "options": [
          { "text": "〇〇②→開く→⑦②⑤", "trans": "（002→打开→725）", "correct": false, "explain": "起步顺序就错了。男士在讲解流程时，强调第一步要先输入密码（725），而不是先输仓库编号（002）。" },
          { "text": "〇〇②→開く→⑦②⑤→開く", "trans": "（002→打开→725→打开）", "correct": false, "explain": "错误原因同上，一上来不该将仓库编号放在首位输入，顺序全乱了。" },
          { "text": "⑦②⑤→開く→〇〇②", "trans": "（725→打开→002）", "correct": false, "explain": "前半段的操作是对的，但根据男士最后的纠正“弄完这些最后还得再按一下‘打开’”，这个选项漏掉了收尾的开门动作。" },
          { "text": "⑦②⑤→開く→〇〇②→開く", "trans": "（725→打开→002→打开）", "correct": true, "explain": "完美契合男士给出的指令：依次输入密码（725）→按“打开”→输入仓库号（002）→再按“打开”。" }
        ]
      },
      {
        "id": 4,
        "question": "ホテルの受付で女の人と男の人が話しています。女の人はどこでパソコンを使いますか。",
        "questionTrans": "（在酒店前台，女人和男人在说话。女人会在哪里使用电脑？）",
        "audio": "../assets/audio/2020.12-4.mp3",
        "dialogue": [

        let currentExamKey = "N2-2020-12";
let currentQuestionIndex = 0;
        let preferredMode = 'practice'; 
        const LISTENING_TYPE = 'task-comprehension';
        const LISTENING_LEVEL = 'n2';

        const listeningRewardHooks = window.StudyQuestListeningRewards && window.StudyQuestListeningRewards.create({
            type: LISTENING_TYPE,
            level: LISTENING_LEVEL,
            getExamKey: () => currentExamKey,
            getCurrentQuestionIndex: () => currentQuestionIndex,
            getQuestions: () => (examData[currentExamKey] && examData[currentExamKey].questions) || [],
            buildIndexUrl: () => '../index.html',
            buildRetryUrl: (examKey) => {
                const params = new URLSearchParams();
                if (examKey) params.set('year', examKey);
                return params.toString() ? `${window.location.pathname}?${params.toString()}` : window.location.pathname;
            }
        });

        // --- Initialization ---
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const yearParam = urlParams.get('year');
            const modeParam = urlParams.get('mode');
            
            const targetKey = yearParam ? `N2-${yearParam}` : currentExamKey;

            if (examData[targetKey]) {
                currentExamKey = targetKey;
                if (window.ListeningProgress) {
                    window.ListeningProgress.setLastPractice(LISTENING_TYPE, LISTENING_LEVEL, currentExamKey);
                }

                if (modeParam === 'review') {
                    const marks = getMarks();
                    if (marks.length === 0) {
                        alert('付箋を貼った問題はありません。(No marked questions)');
                    } else {
                        const originalQuestions = examData[currentExamKey].questions;
                        const filtered = originalQuestions.filter(q => marks.includes(q.id));
                        if (filtered.length > 0) {
                            examData[currentExamKey].questions = filtered;
                            setTimeout(() => {
                                const lbl = document.getElementById('yearLabel');
                                if(lbl) lbl.innerHTML += ' <span style="background:var(--marker-yellow); color:var(--graphite); font-size:12px; margin-left:8px; padding:2px 8px; border-radius:2px 8px 2px 6px / 6px 2px 8px 2px; border:1.5px solid var(--graphite);">✔ 復習ノート</span>';
                            }, 100);
                        } else {
                            alert('付箋を貼った問題が見つかりませんでした。');
                        }
                    }
                }
            } else if (!examData[currentExamKey]) {
                currentExamKey = Object.keys(examData)[0];
            }

            const yearLabel = document.getElementById('yearLabel');
            if (yearLabel && modeParam !== 'review') {
                yearLabel.textContent = examData[currentExamKey].label;
            }

            updateQuestionSelect();
            if (window.setupListeningPlayer) {
                window.setupListeningPlayer({
                    subtitle: document.title.replace(/\s*\((N1|N2|N3)\)\s*$/, ''),
                    skipSeconds: 10
                });
            }
            if (listeningRewardHooks) listeningRewardHooks.startRun();
            renderQuestion();
        }

        // --- Mark Logic ---
        function getMarks() {
            if (!window.ListeningProgress) return [];
            return window.ListeningProgress.getMistakeIds(LISTENING_TYPE, LISTENING_LEVEL, currentExamKey) || [];
        }

        function saveMarks(marks) {
            if (window.ListeningProgress) {
                window.ListeningProgress.setMistakeIds(LISTENING_TYPE, LISTENING_LEVEL, currentExamKey, marks);
            }
        }

        function toggleMark() {
            if (!examData[currentExamKey] || !examData[currentExamKey].questions[currentQuestionIndex]) return;

            const marks = getMarks();
            const qId = examData[currentExamKey].questions[currentQuestionIndex].id;
            const index = marks.indexOf(qId);

            if (index === -1) {
                marks.push(qId);
                saveMarks(marks);
                updateMarkUI();
                return;
            }

            marks.splice(index, 1);
            saveMarks(marks);

            updateMarkUI();
        }

        function updateMarkUI() {
            if (!examData[currentExamKey] || !examData[currentExamKey].questions[currentQuestionIndex]) return;
            const marks = getMarks();
            const qId = examData[currentExamKey].questions[currentQuestionIndex].id;
            const btn = document.getElementById('markBtn');
            if (marks.includes(qId)) btn.classList.add('active');
            else btn.classList.remove('active');
        }

        function updateQuestionSelect() {
            const select = document.getElementById('questionSelect');
            select.innerHTML = '';
            
            const questions = examData[currentExamKey].questions;
            questions.forEach((q, index) => {
                const option = document.createElement('option');
                option.value = index; 
                option.textContent = `問題 ${q.id}`;
                select.appendChild(option);
            });
        }

        function changeQuestion(index) {
            currentQuestionIndex = parseInt(index);
            renderQuestion();
        }

        // --- Answer Selection ---
        function selectOption(element) {
            const container = document.getElementById('appContainer');
            if (!container.classList.contains('mode-practice')) return;
            if (element.parentElement.querySelector('.judged-correct') || element.parentElement.querySelector('.judged-wrong')) return;

            const siblings = element.parentElement.children;
            for (let i = 0; i < siblings.length; i++) {
                siblings[i].classList.remove('selected');
                const btn = siblings[i].querySelector('.inline-confirm-btn');
                if (btn) btn.remove();
            }

            element.classList.add('selected');
            
            const btn = document.createElement('button');
            btn.id = 'inlineConfirmBtn';
            btn.className = 'inline-confirm-btn';
            btn.textContent = '確認';
            btn.onclick = (e) => {
                e.stopPropagation();
                checkAnswer();
            };
            element.appendChild(btn);
        }

        function checkAnswer() {
            const container = document.getElementById('appContainer');
            const selected = container.querySelector('.options-list li.selected');
            if (!selected) return;

            const currentMode = new URLSearchParams(window.location.search).get('mode');
            const isChallengeMode = currentMode === 'challenge' && window.__LISTENING_RANDOM_EXAM__ === true;
            const index = parseInt(selected.getAttribute('data-index'));
            const question = examData[currentExamKey].questions[currentQuestionIndex];
            const options = container.querySelectorAll('.options-list li');

            const isCorrect = question.options[index].correct;
            if (listeningRewardHooks) listeningRewardHooks.handleAnswer(isCorrect);

            if (isChallengeMode) {
                if (!isCorrect) {
                    const marks = getMarks();
                    if (!marks.includes(question.id)) {
                        marks.push(question.id);
                        saveMarks(marks);
                        updateMarkUI();
                    }
                }

                const confirmBtn = document.getElementById('inlineConfirmBtn');
                if (confirmBtn) confirmBtn.remove();

                container.dataset.sqChallengeAnswered = '1';
                container.classList.remove('judged');
                options.forEach((opt) => {
                    opt.style.pointerEvents = 'none';
                });
                return;
            }

            container.classList.add('judged');

            if (isCorrect) {
                selected.classList.add('judged-correct');
            } else {
                selected.classList.add('judged-wrong');
                question.options.forEach((opt, i) => {
                    if (opt.correct) options[i].classList.add('judged-correct');
                });

                const marks = getMarks();
                if (!marks.includes(question.id)) {
                    marks.push(question.id);
                    saveMarks(marks);
                    updateMarkUI();
                }
            }

            const confirmBtn = document.getElementById('inlineConfirmBtn');
            if (confirmBtn) confirmBtn.remove();

            setTimeout(() => {
                setMode('explanation', false);
            }, 1000);
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                setMode(preferredMode, false);
                renderQuestion();
            }
        }

        function nextQuestion() {
            const questions = examData[currentExamKey].questions;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                setMode(preferredMode, false);
                renderQuestion();
            }
        }

        // --- Render Content ---
        function renderQuestion() {
            const container = document.getElementById('appContainer');
            if (container) container.classList.remove('judged');

        const data = examData[currentExamKey].questions[currentQuestionIndex];
        const scriptData = data.script || data;
        const total = examData[currentExamKey].questions.length;

            updateMarkUI();
            document.getElementById('questionSelect').value = currentQuestionIndex;
            if (window.updateListeningPlayer) {
                window.updateListeningPlayer({
                    title: `問題 ${data.id}`,
                    audioSrc: data.audio,
                    hasPrev: currentQuestionIndex > 0,
                    hasNext: currentQuestionIndex < total - 1
                });
        }

        // Transcript Update (分割问题与对话内容)
        document.getElementById('questionText').innerHTML = scriptData.question || '';
        document.getElementById('questionTrans').innerHTML = scriptData.questionTrans || '';
            const questionImageArea = document.getElementById('questionImageArea');
            const questionImage = document.getElementById('questionImage');
            if (questionImageArea && questionImage) {
                if (data.image) {
                    questionImage.src = data.image;
                    questionImage.alt = `${examData[currentExamKey].label} 問題 ${data.id} 题图`;
                    questionImageArea.style.display = 'block';
                } else {
                    questionImage.removeAttribute('src');
                    questionImage.alt = '';
                    questionImageArea.style.display = 'none';
                }
            }
        const conversationHtml = (scriptData.dialogue || []).map(line => `
            <div class="conversation-line">
                <span class="speaker-name">${line.speaker}</span>
                <div class="speaker-text">
                        <div>${line.text}</div>
                        <div class="translation">${line.trans}</div>
                    </div>
                </div>
            `).join('');
            document.getElementById('conversationText').innerHTML = conversationHtml;

            // Options Update
            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';
            data.options.forEach((opt, idx) => {
                const li = document.createElement('li');
                if (opt.correct) li.classList.add('correct-answer');
                li.setAttribute('data-index', idx);
                li.onclick = () => selectOption(li);

                li.innerHTML = `
                    <span class="options-num">${idx + 1}</span>
                    <div class="option-content">

                    <div class="option-text">${opt.text}</div>
                    <div class="translation">${opt.translation || opt.trans || ''}</div>
                </div>
            `;
                optionsList.appendChild(li);
            });

            if (listeningRewardHooks) listeningRewardHooks.onQuestionRendered();
        }

        // --- Mode Switching ---
        function setMode(mode, updatePreference = true) {
            if (updatePreference) preferredMode = mode;

            const container = document.getElementById('appContainer');
            const btnPractice = document.getElementById('btnPractice');
            const btnExplanation = document.getElementById('btnExplanation');
            const tooltip = document.getElementById('wordTooltip');

            const confirmBtn = document.getElementById('inlineConfirmBtn');
            if (confirmBtn) confirmBtn.remove();
            tooltip.style.display = 'none';

            if (mode === 'practice') {
                container.classList.remove('mode-explanation');
                container.classList.add('mode-practice');
                btnPractice.classList.add('active');
                btnExplanation.classList.remove('active');
            } else {
                container.classList.remove('mode-practice');
                container.classList.add('mode-explanation');
                btnExplanation.classList.add('active');
                btnPractice.classList.remove('active');

                // 滚动至顶部以查看听力原文
                setTimeout(() => {
                    const transcriptSection = document.getElementById('transcriptBlock');
                    const anchorTarget = transcriptSection || document.querySelector('.content-wrapper');
                    if (anchorTarget) {
                        const headerOffset = window.innerWidth <= 768 ? 112 : 132;
                        const elementPosition = anchorTarget.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                        window.scrollTo({ top: offsetPosition, behavior: "smooth" });
                    }
                }, 100);
            }
        }

        // --- Tooltip Logic ---
        function showTooltip(event, text) {
            event.stopPropagation();
            const tooltip = document.getElementById('wordTooltip');
            tooltip.innerText = text;
            tooltip.style.display = 'block';
            
            const targetRect = event.target.getBoundingClientRect();
            setTimeout(() => {
                const width = tooltip.offsetWidth, height = tooltip.offsetHeight;
                const top = targetRect.top + window.scrollY - height - 10; 
                let left = targetRect.left + window.scrollX + (targetRect.width / 2) - (width / 2);
                if (left < 10) left = 10;
                if (left + width > window.innerWidth - 10) left = window.innerWidth - width - 10;
                
                const targetCenterX = targetRect.left + window.scrollX + (targetRect.width / 2);
                tooltip.style.setProperty('--arrow-left', `${targetCenterX - left}px`);
                tooltip.style.top = `${top}px`; tooltip.style.left = `${left}px`;
            }, 0);
        }

        function getTooltipText(target) {
            if (!target) return '';
            if (target.dataset.tooltip) return target.dataset.tooltip;
            if (target.dataset.explain) return target.dataset.explain;
            if (target.classList.contains('highlight-correct')) {
                const exam = examData[currentExamKey];
                const data = exam && exam.questions ? exam.questions[currentQuestionIndex] : null;
                const correctOption = data && data.options ? data.options.find(opt => opt.correct) : null;
                return correctOption ? correctOption.explain : '';
            }
            return '';
        }

        document.addEventListener('click', (event) => {
            const clickedElement = event.target instanceof Element ? event.target : event.target.parentElement;
            const target = clickedElement ? clickedElement.closest('.keyword, .highlight-correct, .highlight-wrong, .explain-correct, .explain-wrong') : null;
            const tooltipText = getTooltipText(target);

            if (tooltipText) {
                showTooltip(event, tooltipText);
                return;
            }

            const tooltip = document.getElementById('wordTooltip');
            if (tooltip.style.display === 'block') tooltip.style.display = 'none';
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>

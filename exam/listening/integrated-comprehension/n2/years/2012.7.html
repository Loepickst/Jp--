<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <!-- 使用与练习页一致的书面/印刷感字体组合 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">

<body>

    <header>
        <a href="../index.html" class="back-btn" id="backButton">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            戻る
        </a>
        <h1 id="yearLabel">統合理解 (N2)</h1>
        <div style="width: 60px;"></div>
    </header>

    <div class="practice-container mode-practice" id="appContainer">
        
        <div class="card-header">
            <div class="header-left">
                <select id="questionSelect" class="question-select" onchange="changeQuestion(this.value)"></select>
                <button type="button" id="markBtn" class="mark-btn" onclick="toggleMark()" title="付箋を貼る (标记/收藏)" aria-label="付箋を貼る">🐶</button>
            </div>
            <div class="mode-switch">
                <button id="btnPractice" class="active" onclick="setMode('practice')">✎ 演習ノート</button>
                <button id="btnExplanation" onclick="setMode('explanation')">✔ 赤ペン解説</button>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="right-panel" id="rightPanel">
                
                <!-- 听力原文与翻译区块 (练习模式下隐藏) -->
                <div class="transcript-section sketch-box" id="transcriptBlock">
                    <!-- 问题区块 -->
                    <div class="question-box">
                        <div id="questionText"></div>
                        <div class="translation" id="questionTrans"></div>
                    </div>

                    <!-- 独白或对话区块 -->
                    <div class="conversation-box" id="conversationText">
                        <!-- 由JS填充独白或对话内容 -->
                    </div>
                </div>

                <div class="question-image-area" id="questionImageArea" aria-live="polite">
                    <img id="questionImage" alt="">
                </div>

                <!-- 选项列表 (练习模式下保持可见) -->
                <div id="optionsContainer"></div>
            </div>
        </div>
    </div>

    <!-- 底部音频播放器 -->
    <div class="audio-wrapper">
        <div class="custom-audio-player">
            <div class="now-playing-box">
                <div class="track-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <div class="now-playing-content">
                    <div class="track-header-row">
                        <div class="track-info">
                            <div class="track-title" id="trackTitle">問題 1</div>
                            <div class="track-subtitle" id="trackSubtitle" style="display:none;"></div>
                        </div>
                        <div class="time-group">
                            <span class="time-display time-current" id="timeCurrent">0:00</span>
                            <span class="time-display time-divider" style="margin: 0 4px;">/</span>
                            <span class="time-display time-duration desktop-time" id="timeDurationDesktop">0:00</span>
                            <span class="time-display time-duration mobile-time" id="timeDurationMobile" style="display: none;">-0:00</span>
                        </div>
                    </div>
                    <div class="progress-area">
                        <div class="progress-container" id="progressContainer">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 控制组 -->
            <div class="player-controls">
                <button id="prevBtn" class="ctrl-btn nav-btn" onclick="prevQuestion()" title="前へ">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h2v12H3zM13 6v12L5 12zM21 6v12L13 12z"/></svg>
                </button>
                <button id="rewindBtn" class="ctrl-btn skip-btn" title="6秒戻る">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><text x="12" y="16.5" font-size="8.5" font-weight="900" font-family="sans-serif" stroke-width="0" fill="currentColor" text-anchor="middle">6</text></svg>
                </button>
                <button class="ctrl-btn play-btn" id="playBtn">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="forwardBtn" class="ctrl-btn skip-btn" title="6秒進む">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><text x="12" y="16.5" font-size="8.5" font-weight="900" font-family="sans-serif" stroke-width="0" fill="currentColor" text-anchor="middle">6</text></svg>
                </button>
                <button id="nextBtn" class="ctrl-btn nav-btn" onclick="nextQuestion()" title="次へ">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6v12L11 12zM11 6v12L19 12zM19 6h2v12H19z"/></svg>
                </button>
                <button id="loopBtn" class="ctrl-btn loop-btn" title="ループ再生">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                </button>
                <button id="speedBtn" class="ctrl-btn speed-btn" title="再生速度">1.0x</button>
            </div>
            
            <audio id="audioElement" preload="metadata"></audio>
        </div>
    </div>

    <div id="wordTooltip" class="custom-tooltip"></div>

                                { 
                                    speaker: "女2", 
                                    text: "へえ、それより、<span class=\"highlight-correct\"><span class=\"opt-tag tag-correct\">③</span><span class=\"keyword\" onclick=\"showTooltip(event, '【やっぱり優しさを強調したいよねえ】（果然还是想强调温柔的一面呢）：明确针对约会的意向。对应广播中提到的“想让自己看起来温柔时推荐粉色”，锁定约会服装颜色。')\">やっぱり優しさを強調したいよねえ。</span></span>", 
                                    trans: "（哎，比起那个，我果然还是想多展现一点温柔呢。）" 
                                },
                                { 
                                    speaker: "女1", 
                                    text: "あ、そうか。でも、何でもいいけど。まずは<span class=\"keyword\" onclick=\"showTooltip(event, '【まずは落ち着かなくちゃ】（首先你得冷静下来）：女1指出了女2当前的状态（不冷静），进而引出关于今晚休息的建议。')\">落ち着かなくちゃ。</span>今日の夜はよく寝たほうがいいんじゃない。", 
                                    trans: "（啊，这样啊。其实穿什么都行啦。首先你得冷静下来才行。今晚你最好还是好好睡一觉哦。）" 
                                },
                                { 
                                    speaker: "女2", 
                                    text: "うん、確かにね。<span class=\"highlight-correct\"><span class=\"opt-tag tag-correct\">①</span>（※よく眠れるよう青い物を着て寝る）</span>", 
                                    trans: "（嗯，确实是呢。）" 
                                }
                            ]
                        },
                        subQuestions: [
                            {
                                question: "質問１：明日のデートに、どんな色の服を着て行くといいですか。",
                                questionTrans: "（问题1：明天的约会，穿什么颜色的衣服去比较好？）",
                                options: [
                                    { 
                                        text: "青色", 
                                        translation: "（蓝色）", 
                                        correct: false,
                                        explanation: "蓝色对应“让人心情平静、无法安眠时”，用于今晚睡觉，而非明天约会。" 
                                    },
                                    { 
                                        text: "赤色", 
                                        translation: "（红色）", 
                                        correct: false,
                                        explanation: "女1提议穿红色展现积极印象，但女2拒绝了，表示更想强调温柔。" 
                                    },
                                    { 
                                        text: "ピンク色", 
                                        translation: "（粉色）", 
                                        correct: true,
                                        explanation: "正确。女2明确表示“想强调温柔的一面（優しさを強調したい）”，根据广播内容，“想让自己看起来温柔时推荐粉色”。" 
                                    },
                                    { 
                                        text: "オレンジ色", 
                                        translation: "（橙色）", 
                                        correct: false,
                                        explanation: "橙色对应“让人产生快乐的心情、寂寞时穿”，对话中女1仅感叹了橙色的作用，并没有将其定为约会用。" 
                                    }
                                ]
                            },
                            {
                                question: "質問２：今日の夜は、どんな色の物を着て寝るといいですか。",
                                questionTrans: "（问题2：今天晚上，穿什么颜色的衣服睡觉比较好？）",
                                options: [
                                    { 
                                        text: "青色", 
                                        translation: "（蓝色）", 
                                        correct: true,
                                        explanation: "正确。女1指出女2目前状态是“必须冷静下来（落ち着かなくちゃ）”，并建议她今晚好好睡觉。根据广播，“心绪不宁、无法安眠时推荐蓝色”。" 
                                    },
                                    { 
                                        text: "赤色", 
                                        translation: "（红色）", 
                                        correct: false,
                                        explanation: "红色是“没有精神时”穿的，不符合女2当前需要冷静和睡觉的状态。" 
                                    },
                                    { 
                                        text: "ピンク色", 
                                        translation: "（粉色）", 
                                        correct: false,
                                        explanation: "粉色是明天约会时打算穿的颜色，用于展现温柔。" 
                                    },
                                    { 
                                        text: "オレンジ色", 
                                        translation: "（橙色）", 
                                        correct: false,
                                        explanation: "橙色用于感到寂寞、需要快乐心情时，不符合睡前需求。" 
                                    }
                                ]
                            }
                        ]
                    }
                ]
            }
        };

        let currentExamKey = "N2-2012-07-Integrated"; 
        let currentQuestionIndex = 0;
        let preferredMode = 'practice'; 
        const LISTENING_TYPE = 'integrated-comprehension'; 
        const LISTENING_LEVEL = 'n2';

        const listeningRewardHooks = window.StudyQuestListeningRewards && window.StudyQuestListeningRewards.create({
            type: LISTENING_TYPE,
            level: LISTENING_LEVEL,
            getExamKey: () => currentExamKey,
            getCurrentQuestionIndex: () => currentQuestionIndex,
            getQuestions: () => (examData[currentExamKey] && examData[currentExamKey].questions) || [],
            buildIndexUrl: () => '../index.html'
        });

        // --- Initialization ---
        function init() {
            const yearLabel = document.getElementById('yearLabel');
            if (yearLabel) yearLabel.textContent = examData[currentExamKey].label;

            updateQuestionSelect();
            window.setupListeningPlayer({
                subtitle: document.title.replace(/\s*\((N1|N2|N3)\)\s*$/, ''),
                skipSeconds: 10
            });
            if (listeningRewardHooks) listeningRewardHooks.startRun();
            renderQuestion();
        }

        function getMarks() { return window.ListeningProgress.getMistakeIds(LISTENING_TYPE, LISTENING_LEVEL, currentExamKey); }
        function saveMarks(marks) { window.ListeningProgress.setMistakeIds(LISTENING_TYPE, LISTENING_LEVEL, currentExamKey, marks); }

        function toggleMark() {
            if (!examData[currentExamKey] || !examData[currentExamKey].questions[currentQuestionIndex]) return;
            const marks = getMarks();
            const qId = examData[currentExamKey].questions[currentQuestionIndex].id;
            const index = marks.indexOf(qId);
            if (index === -1) marks.push(qId); else marks.splice(index, 1);
            saveMarks(marks);
            updateMarkUI();
        }

        function updateMarkUI() {
            if (!examData[currentExamKey] || !examData[currentExamKey].questions[currentQuestionIndex]) return;
            const marks = getMarks();
            const qId = examData[currentExamKey].questions[currentQuestionIndex].id;
            const btn = document.getElementById('markBtn');
            if (marks.includes(qId)) btn.classList.add('active'); else btn.classList.remove('active');
        }

        function updateQuestionSelect() {
            const select = document.getElementById('questionSelect');
            select.innerHTML = '';
            const questions = examData[currentExamKey].questions;
            questions.forEach((q, index) => {
                const option = document.createElement('option');
                option.value = index; 
                option.textContent = `問題 ${q.id}`;
                select.appendChild(option);
            });
        }

        function changeQuestion(index) {
            currentQuestionIndex = parseInt(index);
            renderQuestion();
        }

        function selectOption(element) {
            const container = document.getElementById('appContainer');
            if (!container.classList.contains('mode-practice')) return;
            if (element.parentElement.querySelector('.judged-correct') || element.parentElement.querySelector('.judged-wrong')) return;

            const siblings = element.parentElement.children;
            for (let i = 0; i < siblings.length; i++) {
                siblings[i].classList.remove('selected');
                const btn = siblings[i].querySelector('.inline-confirm-btn');
                if (btn) btn.remove();
            }

            element.classList.add('selected');
            
            // 检查当前题目的所有选项列表是否都已经选择了答案（支持一拖二多题判定）
            const allUls = container.querySelectorAll('.options-list');
            const allSelected = container.querySelectorAll('.options-list li.selected');

            if (allUls.length === allSelected.length) {
                // 清理掉其他题目的提交按钮，仅在当前选择的项目上生成确认按钮
                const existingBtns = container.querySelectorAll('.inline-confirm-btn');
                existingBtns.forEach(btn => btn.remove());

                const btn = document.createElement('button');
                btn.className = 'inline-confirm-btn';
                btn.textContent = '確認';
                btn.onclick = (e) => { e.stopPropagation(); checkAnswer(); };
                element.appendChild(btn);
            }
        }

        function checkAnswer() {
            const container = document.getElementById('appContainer');
            const question = examData[currentExamKey].questions[currentQuestionIndex];
            const allUls = container.querySelectorAll('.options-list');
            let allCorrect = true;

            allUls.forEach(ulElement => {
                const selected = ulElement.querySelector('li.selected');
                if (!selected) return;
                
                // 支持多题 (subQuestions) 判断
                const qIdx = parseInt(ulElement.getAttribute('data-qidx') || "0");
                const optsData = question.subQuestions ? question.subQuestions[qIdx].options : question.options;

                const index = parseInt(selected.getAttribute('data-index'));
                const isCorrect = optsData[index].correct;
                if (!isCorrect) allCorrect = false;

                ulElement.classList.add('judged');
                if (isCorrect) {
                    selected.classList.add('judged-correct');
                } else {
                    selected.classList.add('judged-wrong');
                    optsData.forEach((opt, i) => { if (opt.correct) ulElement.children[i].classList.add('judged-correct'); });
                }
            });

            if (listeningRewardHooks) listeningRewardHooks.handleAnswer(allCorrect);
            container.classList.add('judged');
            const confirmBtns = container.querySelectorAll('.inline-confirm-btn');
            confirmBtns.forEach(btn => btn.remove());
            setTimeout(() => { setMode('explanation', false); }, 1000);
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                setMode(preferredMode, false);
                renderQuestion();
            }
        }

        function nextQuestion() {
            const questions = examData[currentExamKey].questions;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                setMode(preferredMode, false);
                renderQuestion();
            }
        }

        function renderQuestion() {
            const container = document.getElementById('appContainer');
            if (container) container.classList.remove('judged');
            const data = examData[currentExamKey].questions[currentQuestionIndex];
            const total = examData[currentExamKey].questions.length;

            updateMarkUI();
            document.getElementById('questionSelect').value = currentQuestionIndex;
            window.updateListeningPlayer({
                title: `問題 ${data.id}`,
                audioSrc: data.audio,
                hasPrev: currentQuestionIndex > 0,
                hasNext: currentQuestionIndex < total - 1
            });

            document.getElementById('questionText').innerHTML = data.script.question;
            document.getElementById('questionTrans').innerHTML = data.script.questionTrans;
            
            const conversationHtml = data.script.dialogue.map(line => `
                <div class="conversation-line">
                    <span class="speaker-name">${line.speaker}</span>
                    <div class="speaker-text">
                        <div>${line.text}</div>
                        <div class="translation">${line.trans}</div>
                    </div>
                </div>
            `).join('');
            document.getElementById('conversationText').innerHTML = conversationHtml;

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            const createOptionsList = (options, qIdx, numberOnly = false) => {
                const ul = document.createElement('ul');
                ul.className = numberOnly ? 'options-list number-only-options' : 'options-list';
                ul.setAttribute('data-qidx', qIdx);
                options.forEach((opt, idx) => {
                    const li = document.createElement('li');
                    if (opt.correct) li.classList.add('correct-answer');
                    li.setAttribute('data-index', idx);
                    li.onclick = () => selectOption(li);
                    li.innerHTML = `
                        <span class="options-num">${idx + 1}</span>
                        <div class="option-content">
                            <div class="option-text">${opt.text}</div>
                            <div class="translation">${opt.translation}</div>
                            ${opt.explanation ? `<div class="option-explanation">${opt.explanation}</div>` : ''}
                        </div>
                    `;
                    ul.appendChild(li);
                });
                return ul;
            };

            // 动态支持 subQuestions 或 单一 options
            if (data.subQuestions) {
                data.subQuestions.forEach((subQ, idx) => {
                    const wrapper = document.createElement('div');
                    wrapper.style.marginBottom = '24px';
                    const title = document.createElement('div');
                    title.style.fontWeight = '700';
                    title.style.color = 'var(--graphite)';
                    title.style.marginBottom = '12px';
                    title.style.fontSize = '15px';
                    title.innerHTML = `${subQ.question}<div class="translation" style="display:block; margin-top:4px; padding-top:0; border-top:none;">${subQ.questionTrans}</div>`;
                    wrapper.appendChild(title);
                    wrapper.appendChild(createOptionsList(subQ.options, idx));
                    optionsContainer.appendChild(wrapper);
                });
            } else {
                optionsContainer.appendChild(createOptionsList(data.options, 0, true));
            }
        }

        function setMode(mode, updatePreference = true) {
            if (updatePreference) preferredMode = mode;
            const container = document.getElementById('appContainer');
            const btnPractice = document.getElementById('btnPractice');
            const btnExplanation = document.getElementById('btnExplanation');
            const tooltip = document.getElementById('wordTooltip');
            tooltip.style.display = 'none';

            if (mode === 'practice') {
                container.classList.remove('mode-explanation');
                container.classList.add('mode-practice');
                btnPractice.classList.add('active');
                btnExplanation.classList.remove('active');
            } else {
                container.classList.remove('mode-practice');
                container.classList.add('mode-explanation');
                btnExplanation.classList.add('active');
                btnPractice.classList.remove('active');
            }
        }

        function showTooltip(event, text) {
            event.stopPropagation();
            const tooltip = document.getElementById('wordTooltip');
            tooltip.innerText = text;
            tooltip.style.display = 'block';
            const targetRect = event.target.getBoundingClientRect();
            setTimeout(() => {
                const width = tooltip.offsetWidth, height = tooltip.offsetHeight;
                const top = targetRect.top + window.scrollY - height - 10; 
                let left = targetRect.left + window.scrollX + (targetRect.width / 2) - (width / 2);
                if (left < 10) left = 10;
                if (left + width > window.innerWidth - 10) left = window.innerWidth - width - 10;
                const targetCenterX = targetRect.left + window.scrollX + (targetRect.width / 2);
                tooltip.style.setProperty('--arrow-left', `${targetCenterX - left}px`);
                tooltip.style.top = `${top}px`; tooltip.style.left = `${left}px`;
            }, 0);
        }

        document.addEventListener('click', () => {
            const tooltip = document.getElementById('wordTooltip');
            if (tooltip.style.display === 'block') tooltip.style.display = 'none';
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
    <script src="../../../../../shared/word-bank.js"></script>
    <script src="../../../../../shared/unified-header.js" data-kiki-unified-header-loader></script>
</body>

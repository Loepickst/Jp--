                            dialogue: [

                                    trans: "（感谢大家今天来参加说明会。下面为大家介绍现在可以注册的4个志愿者项目。首先1号，是陪孩子们玩的志愿者。主要是为育儿一代提供支持。后面的3个是针对老年人的生活支援，首先2号是打理庭院。这是除草、打理草坪的室外作业，希望由体力充沛的人来承担。然后3号，是帮忙整理房间。有很多老年人反映说想收拾房间，但搬动重物很吃力，所以这次我们新加了这个项目。4号是电脑指导。老年人中有很多想要学会使用互联网的需求，所以懂怎么教人使用电脑的人，务必请来帮忙。）" 
                                },
                                { 
                                    speaker: "男", 
                                    text: "ゆみ子は子供好きだから、子育てサポートだよね。", 
                                    trans: "（由美子你喜欢小孩，选育儿支持对吧。）" 
                                },
                                { 
                                    speaker: "女", 
                                    text: "えっ？そうね。そう思ってたけど、<span class=\"highlight-wrong\"><span class=\"keyword\" onclick=\"showTooltip(event, '【腰痛めてるからしばらくは無理ね】（腰受伤了最近不太行呢）：条件否定。因为腰伤，排除了原本想选的“1号：带小孩”。')\">腰痛めてるからしばらくは無理ね。</span></span>", 
                                    trans: "（哎？是啊。我本来是这么打算的，但我腰受伤了，最近一段时间都不太行呢。）" 
                                },
                                { 
                                    speaker: "男", 
                                    text: "あ、そうか。じゃあ、<span class=\"highlight-wrong\">体を使う作業は無理</span>だよね。", 
                                    trans: "（啊，这样啊。那，需要体力的活儿你也干不了了吧。）" 
                                },
                                { 
                                    speaker: "女", 
                                    text: "うん、だから<span class=\"highlight-correct\"><span class=\"keyword\" onclick=\"showTooltip(event, '【できるのは1つしかない】（能做的就只有一个了）：最终决定表达。因为腰伤不能做体力活，排除了2号（庭院）和3号（搬重物整理），只剩下不需要体力的“4号：电脑指导”。')\">できるのは1つしかない。</span></span>あなたは。", 
                                    trans: "（嗯，所以我能做的就只有一个了。你呢。）" 
                                },
                                { 
                                    speaker: "男", 
                                    text: "<span class=\"highlight-wrong\"><span class=\"keyword\" onclick=\"showTooltip(event, '【子供は苦手だし...片付けは苦手だからな】（我不擅长应付小孩...也不擅长收拾）：条件排除。排除了1号（带小孩）和3号（整理房间）。')\">子供は苦手だし</span></span>、<span class=\"highlight-correct\"><span class=\"keyword\" onclick=\"showTooltip(event, '【体を動かすのがいいんだけど】（倒是挺想活动身体的）：积极意向。结合排除掉的选项，完美锁定了剩下的体力活“2号：打理庭院”。')\">体を動かすのがいいんだけど</span></span>、<span class=\"highlight-wrong\">片付けは苦手だからな。</span>", 
                                    trans: "（我不擅长应付小孩，倒是挺想活动身体的，不过我也不擅长收拾整理啊。）" 
                                },
                                { 
                                    speaker: "女", 
                                    text: "そうよね。じゃあ、決まりね。", 
                                    trans: "（说得也是。那，就这么定下来了呢。）" 
                                }
                            ]
                        },
                        subQuestions: [
                            {
                                question: "女の人はどのボランティアに登録しますか。",
                                questionTrans: "（女人要注册哪个志愿者项目？）",
                                options: [
                                    { 
                                        text: "1番", 
                                        translation: "（1号）", 
                                        correct: false,
                                        explanation: "虽然女方喜欢小孩，但因为腰受伤了，目前做不了带小孩的活动（1号）。" 
                                    },
                                    { 
                                        text: "2番", 
                                        translation: "（2号）", 
                                        correct: false,
                                        explanation: "这是需要体力的室外作业（打理庭院），不适合腰受伤的女方。" 
                                    },
                                    { 
                                        text: "3番", 
                                        translation: "（3号）", 
                                        correct: false,
                                        explanation: "需要搬动重物（整理房间），属于体力活，同样不适合腰受伤的女方。" 
                                    },
                                    { 
                                        text: "4番", 
                                        translation: "（4号）", 
                                        correct: true,
                                        explanation: "正确。女方因为腰伤无法做任何体力活，排除了前三项，表示“能做的就剩下一个了”，即不需要体力的4号（电脑指导）。" 
                                    }
                                ]
                            },
                            {
                                question: "男の人はどのボランティアに登録しますか。",
                                questionTrans: "（男人要注册哪个志愿者项目？）",
                                options: [
                                    { 
                                        text: "1番", 
                                        translation: "（1号）", 
                                        correct: false,
                                        explanation: "男方明确表示“不擅长应付小孩”，故排除1号（陪孩子玩）。" 
                                    },
                                    { 
                                        text: "2番", 
                                        translation: "（2号）", 
                                        correct: true,
                                        explanation: "正确。男方表示“想活动身体”，但又“不擅长收拾整理”，排除了3号（整理房间）后，锁定了同样能活动身体的2号（打理庭院）。" 
                                    },
                                    { 
                                        text: "3番", 
                                        translation: "（3号）", 
                                        correct: false,
                                        explanation: "虽然能活动身体，但男方明确表示“不擅长收拾整理”，故排除3号（整理房间）。" 
                                    },
                                    { 
                                        text: "4番", 
                                        translation: "（4号）", 
                                        correct: false,
                                        explanation: "男方希望参加能活动身体的项目，4号（电脑指导）不符合他的需求。" 
                                    }
                                ]
                            }
                        ]
                    }
                ]
            }
        };

        let currentExamKey = "N2-2015-12-Integrated"; 
        let currentQuestionIndex = 0;
        let preferredMode = 'practice'; 
        const LISTENING_TYPE = 'integrated-comprehension'; 
        const LISTENING_LEVEL = 'n2';

        const listeningRewardHooks = window.StudyQuestListeningRewards && window.StudyQuestListeningRewards.create({
            type: LISTENING_TYPE,
            level: LISTENING_LEVEL,
            getExamKey: () => currentExamKey,
            getCurrentQuestionIndex: () => currentQuestionIndex,
            getQuestions: () => (examData[currentExamKey] && examData[currentExamKey].questions) || [],
            buildIndexUrl: () => '../index.html',
            buildRetryUrl: (examKey) => {
                const params = new URLSearchParams();
                if (examKey) params.set('year', examKey);
                return params.toString() ? `${window.location.pathname}?${params.toString()}` : window.location.pathname;
            }
        });

        // --- Initialization ---
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const yearParam = urlParams.get('year');
            const modeParam = urlParams.get('mode');
            
            const targetKey = yearParam ? `N2-${yearParam}-Integrated` : currentExamKey;

            if (examData[targetKey]) {
                currentExamKey = targetKey;
                window.ListeningProgress.setLastPractice(LISTENING_TYPE, LISTENING_LEVEL, currentExamKey);

                if (modeParam === 'review') {
                    const marks = getMarks();
                    if (marks.length === 0) {
                        alert('付箋を貼った問題はありません。(No marked questions)');
                    } else {
                        const originalQuestions = examData[currentExamKey].questions;
                        const filtered = originalQuestions.filter(q => marks.includes(q.id));
                        if (filtered.length > 0) {
                            examData[currentExamKey].questions = filtered;
                            setTimeout(() => {
                                const lbl = document.getElementById('yearLabel');
                                if(lbl) lbl.innerHTML += ' <span style="background:var(--marker-yellow); color:var(--graphite); font-size:12px; margin-left:8px; padding:2px 8px; border-radius:2px 8px 2px 6px / 6px 2px 8px 2px; border:1.5px solid var(--graphite);">✔ 復習ノート</span>';
                            }, 100);
                        } else {
                            alert('付箋を貼った問題が見つかりませんでした。');
                        }
                    }
                }
            } else if (!examData[currentExamKey]) {
                currentExamKey = Object.keys(examData)[0];
            }

            const yearLabel = document.getElementById('yearLabel');
            if (yearLabel && modeParam !== 'review') {
                yearLabel.textContent = examData[currentExamKey].label;
            }

            updateQuestionSelect();
            window.setupListeningPlayer({
                subtitle: document.title.replace(/\s*\((N1|N2|N3)\)\s*$/, ''),
                skipSeconds: 10
            });
            if (listeningRewardHooks) listeningRewardHooks.startRun();
            renderQuestion();
        }

        // --- Mark Logic ---
        function getMarks() {
            return window.ListeningProgress.getMistakeIds(LISTENING_TYPE, LISTENING_LEVEL, currentExamKey);
        }

        function saveMarks(marks) {
            window.ListeningProgress.setMistakeIds(LISTENING_TYPE, LISTENING_LEVEL, currentExamKey, marks);
        }

        function toggleMark() {
            if (!examData[currentExamKey] || !examData[currentExamKey].questions[currentQuestionIndex]) return;

            const marks = getMarks();
            const qId = examData[currentExamKey].questions[currentQuestionIndex].id;
            const index = marks.indexOf(qId);

            if (index === -1) {
                marks.push(qId);
                saveMarks(marks);
                updateMarkUI();
                return;
            }

            marks.splice(index, 1);
            saveMarks(marks);

            updateMarkUI();
        }

        function updateMarkUI() {
            if (!examData[currentExamKey] || !examData[currentExamKey].questions[currentQuestionIndex]) return;
            const marks = getMarks();
            const qId = examData[currentExamKey].questions[currentQuestionIndex].id;
            const btn = document.getElementById('markBtn');
            if (marks.includes(qId)) btn.classList.add('active');
            else btn.classList.remove('active');
        }

        function updateQuestionSelect() {
            const select = document.getElementById('questionSelect');
            select.innerHTML = '';
            
            const questions = examData[currentExamKey].questions;
            questions.forEach((q, index) => {
                const option = document.createElement('option');
                option.value = index; 
                option.textContent = `問題 ${q.id}`;
                select.appendChild(option);
            });
        }

        function changeQuestion(index) {
            currentQuestionIndex = parseInt(index);
            renderQuestion();
        }

        // --- Answer Selection ---
        function selectOption(element) {
            const container = document.getElementById('appContainer');
            if (!container.classList.contains('mode-practice')) return;
            if (element.parentElement.querySelector('.judged-correct') || element.parentElement.querySelector('.judged-wrong')) return;

            const siblings = element.parentElement.children;
            for (let i = 0; i < siblings.length; i++) {
                siblings[i].classList.remove('selected');
                const btn = siblings[i].querySelector('.inline-confirm-btn');
                if (btn) btn.remove();
            }

            element.classList.add('selected');
            
            const allUls = container.querySelectorAll('.options-list');
            const allSelected = container.querySelectorAll('.options-list li.selected');

            // 只有当页面上所有的小题都选择了答案时，才显示确认按钮
            if (allUls.length === allSelected.length) {
                // 清除可能残留的确认按钮
                const existingBtns = container.querySelectorAll('.inline-confirm-btn');
                existingBtns.forEach(btn => btn.remove());

                const btn = document.createElement('button');
                btn.className = 'inline-confirm-btn';
                btn.textContent = '確認';
                btn.onclick = (e) => {
                    e.stopPropagation();
                    checkAnswer();
                };
                element.appendChild(btn);
            }
        }

        function checkAnswer() {
            const container = document.getElementById('appContainer');
            const currentMode = new URLSearchParams(window.location.search).get('mode');
            const isChallengeMode = currentMode === 'challenge' && window.__LISTENING_RANDOM_EXAM__ === true;
            const question = examData[currentExamKey].questions[currentQuestionIndex];
            
            const allUls = container.querySelectorAll('.options-list');
            let allCorrect = true;

            // 遍历并判定所有的小题
            allUls.forEach(ulElement => {
                const selected = ulElement.querySelector('li.selected');
                if (!selected) return;

                const qIdx = parseInt(ulElement.getAttribute('data-qidx') || "0");
                const optsData = question.subQuestions ? question.subQuestions[qIdx].options : question.options;
                
                const index = parseInt(selected.getAttribute('data-index'));
                const isCorrect = optsData[index].correct;

                if (!isCorrect) allCorrect = false;

                if (isChallengeMode) {
                    ulElement.classList.add('judged');
                    Array.from(ulElement.children).forEach((opt) => {
                        opt.style.pointerEvents = 'none';
                    });
                } else {
                    ulElement.classList.add('judged');
                    if (isCorrect) {
                        selected.classList.add('judged-correct');
                    } else {
                        selected.classList.add('judged-wrong');
                        optsData.forEach((opt, i) => {
                            if (opt.correct) ulElement.children[i].classList.add('judged-correct');
                        });
                    }
                }
            });

            if (listeningRewardHooks) listeningRewardHooks.handleAnswer(allCorrect);

            if (isChallengeMode) {
                if (!allCorrect) {
                    const marks = getMarks();
                    if (!marks.includes(question.id)) {
                        marks.push(question.id);
                        saveMarks(marks);
                        updateMarkUI();
                    }
                }
                container.dataset.sqChallengeAnswered = '1';
                container.classList.remove('judged');
            } else {
                container.classList.add('judged');
                if (!allCorrect) {
                    const marks = getMarks();
                    if (!marks.includes(question.id)) {
                        marks.push(question.id);
                        saveMarks(marks);
                        updateMarkUI();
                    }
                }
            }

            const confirmBtns = container.querySelectorAll('.inline-confirm-btn');
            confirmBtns.forEach(btn => btn.remove());

            setTimeout(() => {
                setMode('explanation', false);
            }, 1000);
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                setMode(preferredMode, false);
                renderQuestion();
            }
        }

        function nextQuestion() {
            const questions = examData[currentExamKey].questions;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                setMode(preferredMode, false);
                renderQuestion();
            }
        }

        // --- Render Content ---
        function renderQuestion() {
            const container = document.getElementById('appContainer');
            if (container) container.classList.remove('judged');

            const data = examData[currentExamKey].questions[currentQuestionIndex];
            const total = examData[currentExamKey].questions.length;

            updateMarkUI();
            document.getElementById('questionSelect').value = currentQuestionIndex;
            window.updateListeningPlayer({
                title: `問題 ${data.id}`,
                audioSrc: data.audio,
                hasPrev: currentQuestionIndex > 0,
                hasNext: currentQuestionIndex < total - 1
            });

            // Transcript Update
            document.getElementById('questionText').innerHTML = data.script.question;
            document.getElementById('questionTrans').innerHTML = data.script.questionTrans;
            const questionImageArea = document.getElementById('questionImageArea');
            const questionImage = document.getElementById('questionImage');
            if (questionImageArea && questionImage) {
                if (data.image) {
                    questionImage.src = data.image;
                    questionImage.alt = `${examData[currentExamKey].label} 問題 ${data.id} 题图`;
                    questionImageArea.style.display = 'block';
                } else {
                    questionImage.removeAttribute('src');
                    questionImage.alt = '';
                    questionImageArea.style.display = 'none';
                }
            }
            const conversationHtml = data.script.dialogue.map(line => `
                <div class="conversation-line">
                    <span class="speaker-name">${line.speaker}</span>
                    <div class="speaker-text">
                        <div>${line.text}</div>
                        <div class="translation">${line.trans}</div>
                    </div>
                </div>
            `).join('');
            document.getElementById('conversationText').innerHTML = conversationHtml;

            // Options Update (支持单题及“一拖二”题型)
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            const createOptionsList = (options, qIdx, numberOnly = false) => {
                const ul = document.createElement('ul');
                ul.className = numberOnly ? 'options-list number-only-options' : 'options-list';
                ul.setAttribute('data-qidx', qIdx);
                options.forEach((opt, idx) => {
                    const li = document.createElement('li');
                    if (opt.correct) li.classList.add('correct-answer');
                    li.setAttribute('data-index', idx);
                    li.onclick = () => selectOption(li);

                    li.innerHTML = `
                        <span class="options-num">${idx + 1}</span>
                        <div class="option-content">
                            <div class="option-text">${opt.text}</div>
                            <div class="translation">${opt.translation}</div>
                            ${opt.explanation ? `<div class="option-explanation">${opt.explanation}</div>` : ''}
                        </div>
                    `;
                    ul.appendChild(li);
                });
                return ul;
            };

            if (data.subQuestions) {
                data.subQuestions.forEach((subQ, idx) => {
                    const wrapper = document.createElement('div');
                    wrapper.style.marginBottom = '24px';
                    
                    const title = document.createElement('div');
                    title.style.fontWeight = '700';
                    title.style.color = 'var(--graphite)';
                    title.style.marginBottom = '12px';
                    title.style.fontSize = '15px';
                    title.innerHTML = `質問 ${idx + 1}：${subQ.question}<div class="translation" style="display:block; margin-top:4px; padding-top:0; border-top:none;">${subQ.questionTrans}</div>`;
                    
                    wrapper.appendChild(title);
                    wrapper.appendChild(createOptionsList(subQ.options, idx));
                    optionsContainer.appendChild(wrapper);
                });
            } else {
                optionsContainer.appendChild(createOptionsList(data.options, 0, true));
            }

            if (listeningRewardHooks) listeningRewardHooks.onQuestionRendered();
        }

        // --- Mode Switching ---
        function setMode(mode, updatePreference = true) {
            if (updatePreference) preferredMode = mode;

            const container = document.getElementById('appContainer');
            const btnPractice = document.getElementById('btnPractice');
            const btnExplanation = document.getElementById('btnExplanation');
            const tooltip = document.getElementById('wordTooltip');

            const confirmBtns = document.querySelectorAll('.inline-confirm-btn');
            confirmBtns.forEach(btn => btn.remove());
            tooltip.style.display = 'none';

            if (mode === 'practice') {
                container.classList.remove('mode-explanation');
                container.classList.add('mode-practice');
                btnPractice.classList.add('active');
                btnExplanation.classList.remove('active');
            } else {
                container.classList.remove('mode-practice');
                container.classList.add('mode-explanation');
                btnExplanation.classList.add('active');
                btnPractice.classList.remove('active');

                // 滚动至顶部以查看听力原文
                setTimeout(() => {
                    const transcriptSection = document.getElementById('transcriptBlock');
                    const anchorTarget = transcriptSection || document.querySelector('.content-wrapper');
                    if (anchorTarget) {
                        const headerOffset = window.innerWidth <= 768 ? 112 : 132;
                        const elementPosition = anchorTarget.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                        window.scrollTo({ top: offsetPosition, behavior: "smooth" });
                    }
                }, 100);
            }
        }

        // --- Tooltip Logic ---
        function showTooltip(event, text) {
            event.stopPropagation();
            const tooltip = document.getElementById('wordTooltip');
            tooltip.innerText = text;
            tooltip.style.display = 'block';
            
            const targetRect = event.target.getBoundingClientRect();
            setTimeout(() => {
                const width = tooltip.offsetWidth, height = tooltip.offsetHeight;
                const top = targetRect.top + window.scrollY - height - 10; 
                let left = targetRect.left + window.scrollX + (targetRect.width / 2) - (width / 2);
                if (left < 10) left = 10;
                if (left + width > window.innerWidth - 10) left = window.innerWidth - width - 10;
                
                const targetCenterX = targetRect.left + window.scrollX + (targetRect.width / 2);
                tooltip.style.setProperty('--arrow-left', `${targetCenterX - left}px`);
                tooltip.style.top = `${top}px`; tooltip.style.left = `${left}px`;
            }, 0);
        }

        document.addEventListener('click', () => {
            const tooltip = document.getElementById('wordTooltip');
            if (tooltip.style.display === 'block') tooltip.style.display = 'none';
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>

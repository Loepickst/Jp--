<html lang="zh-CN">
<head>

<body>

        <div style="width: 60px;"></div>

    <div class="practice-container mode-practice" id="appContainer">
        
        <div class="card-header">
            <div class="header-left">
                <select id="questionSelect" class="question-select" onchange="changeQuestion(this.value)">
                    <!-- Options populated by JS -->
                </select>
                <button type="button" id="markBtn" class="mark-btn" onclick="toggleMark()" title="付箋を貼る (标记/收藏)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                </button>
            </div>
            <div class="mode-switch">
                <button id="btnPractice" class="active" onclick="setMode('practice')">✎ 演習ノート</button>
                <button id="btnExplanation" onclick="setMode('explanation')">✔ 赤ペン添削</button>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="left-panel">
                <div class="img-frame sketch-box">
                    <img src="" alt="对话场景" id="sceneImage" style="display: none;">
                </div>
            </div>
            
            <div class="right-panel" id="rightPanel">
                <div class="dialogue-block" id="dialogueBlock"></div>
                <ul class="options-list" id="optionsList"></ul>
            </div>
        </div>
    </div>

    <div class="audio-wrapper">
        <div class="custom-audio-player">
            <!-- 播放信息区 -->
            <div class="now-playing-box">
                <div class="track-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>

                <div class="now-playing-content">
                    <div class="track-header-row">
                        <div class="track-info">
                            <div class="track-title" id="trackTitle">TRACK 1</div>
                            <div class="track-subtitle" id="trackSubtitle" style="display: none;"></div>
                        </div>
                        <div class="time-group">
                            <span class="time-display time-current" id="timeCurrent">0:00</span>
                            <span class="time-display time-divider" style="margin: 0 4px;">/</span>
                            <span class="time-display time-duration desktop-time" id="timeDurationDesktop">0:00</span>
                            <span class="time-display time-duration mobile-time" id="timeDurationMobile" style="display: none;">-0:00</span>
                        </div>
                    </div>
                    <div class="progress-area">
                        <div class="progress-container" id="progressContainer">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="player-controls">
                <button id="prevBtn" class="ctrl-btn nav-btn" onclick="prevQuestion()" title="前へ">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h2v12H3zM13 6v12L5 12zM21 6v12L13 12z"/></svg>
                </button>

                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><text x="12" y="16.5" font-size="8.5" font-weight="900" font-family="sans-serif" stroke-width="0" fill="currentColor" text-anchor="middle">6</text></svg>
                </button>
                <button class="ctrl-btn play-btn" id="playBtn">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="forwardBtn" class="ctrl-btn skip-btn" title="6秒進む">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><text x="12" y="16.5" font-size="8.5" font-weight="900" font-family="sans-serif" stroke-width="0" fill="currentColor" text-anchor="middle">6</text></svg>
                </button>
                <button id="nextBtn" class="ctrl-btn nav-btn" onclick="nextQuestion()" title="次へ">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6v12L11 12zM11 6v12L19 12zM19 6h2v12H19z"/></svg>
                </button>
                <button id="loopBtn" class="ctrl-btn loop-btn" title="ループ再生">

                </button>
                <button id="speedBtn" class="ctrl-btn speed-btn" title="再生速度">1.0x</button>
            </div>

            <audio id="audioElement" preload="metadata"></audio>
        </div>
    </div>

    <div id="wordTooltip" class="custom-tooltip"></div>

        let currentExamKey = "2020-07";
        let currentQuestionIndex = 0;
        let preferredMode = 'practice'; // Track user's preferred mode
        const LISTENING_TYPE = 'immediate-response';
        const LISTENING_LEVEL = 'n1';


        const listeningRewardHooks = window.StudyQuestListeningRewards && window.StudyQuestListeningRewards.create({
            type: LISTENING_TYPE,
            level: LISTENING_LEVEL,
            getExamKey: () => currentExamKey,
            getCurrentQuestionIndex: () => currentQuestionIndex,
            getQuestions: () => (examData[currentExamKey] && examData[currentExamKey].questions) || [],
            buildIndexUrl: () => '../index.html',
            buildRetryUrl: (examKey) => {
                const params = new URLSearchParams();
                if (examKey) params.set('year', examKey);
                return params.toString() ? `${window.location.pathname}?${params.toString()}` : window.location.pathname;
            }
        });

        // --- Initialization ---
        function init() {
            // 1. Get Year from URL or default
            const urlParams = new URLSearchParams(window.location.search);
            const yearParam = urlParams.get('year');
            const modeParam = urlParams.get('mode');
            
            // Check if valid
            if (yearParam && examData[yearParam]) {
                currentExamKey = yearParam;
                // Save last practice session
                window.ListeningProgress.setLastPractice(LISTENING_TYPE, LISTENING_LEVEL, currentExamKey);

                // --- REVIEW MODE LOGIC ---
                if (modeParam === 'review') {
                    const marks = getMarks();
                    if (marks.length === 0) {
                        alert('マークされた問題はありません。(No marked questions)');
                    } else {
                        const originalQuestions = examData[currentExamKey].questions;
                        const filtered = originalQuestions.filter(q => marks.includes(q.id));
                        
                        if (filtered.length > 0) {
                            examData[currentExamKey].questions = filtered;
                            setTimeout(() => {
                                const lbl = document.getElementById('yearLabel');
                                if(lbl) {
                                    lbl.innerHTML += ' <span style="color:var(--text-sub); font-size:0.8em;">(✎ 復習モード)</span>';
                                }
                            }, 100);
                        } else {
                             alert('マークされた問題が見つかりませんでした。(Questions not found)');
                        }
                    }
                }
            } else {
                // Default to first key if not specified or invalid
                const keys = Object.keys(examData);
                if (keys.length > 0) {
                    currentExamKey = keys[0];
                }
            }

            // 2. Set Year Label
            const yearLabel = document.getElementById('yearLabel');
            if (yearLabel && examData[currentExamKey]) {
                yearLabel.textContent = examData[currentExamKey].label;
            }

            // 3. Populate Question Select
            updateQuestionSelect();

            window.setupListeningPlayer({
                subtitle: document.title.replace(/\s*\((N1|N2|N3)\)\s*$/, '')
            });

            // 4. Initial Render
            if (listeningRewardHooks) listeningRewardHooks.startRun();
            renderQuestion();
        }

        // --- Mark/Bookmark Logic ---
        function getMarks() {
            return window.ListeningProgress.getMistakeIds(LISTENING_TYPE, LISTENING_LEVEL, currentExamKey);
        }

        function saveMarks(marks) {
            window.ListeningProgress.setMistakeIds(LISTENING_TYPE, LISTENING_LEVEL, currentExamKey, marks);
        }

        function toggleMark() {
            if (!examData[currentExamKey] || !examData[currentExamKey].questions[currentQuestionIndex]) return;

            const marks = getMarks();
            const qId = examData[currentExamKey].questions[currentQuestionIndex].id;
            const index = marks.indexOf(qId);

            if (index === -1) {
                marks.push(qId);
                saveMarks(marks);
                updateMarkUI();
                return;
            }

            marks.splice(index, 1);
            saveMarks(marks);

            updateMarkUI();
        }

        function updateMarkUI() {
            const marks = getMarks();
            // Guard clause if questions aren't loaded yet
            if (!examData[currentExamKey] || !examData[currentExamKey].questions[currentQuestionIndex]) return;
            
            const qId = examData[currentExamKey].questions[currentQuestionIndex].id;
            const btn = document.getElementById('markBtn');
            
            if (marks.includes(qId)) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        function updateQuestionSelect() {
            const select = document.getElementById('questionSelect');
            select.innerHTML = '';
            
            if (!examData[currentExamKey] || !examData[currentExamKey].questions) return;

            const questions = examData[currentExamKey].questions;
            questions.forEach((q, index) => {
                const option = document.createElement('option');
                option.value = index; // Use index as value for easier handling
                option.textContent = `問題 ${q.id}`;
                select.appendChild(option);
            });
        }

        function changeQuestion(index) {
            currentQuestionIndex = parseInt(index);
            renderQuestion();
        }

        function selectOption(element) {
            // Only active in practice mode
            const container = document.getElementById('appContainer');
            if (!container.classList.contains('mode-practice')) return;
            
            // Do not change selection if already judged
            if (element.parentElement.querySelector('.judged-correct') || element.parentElement.querySelector('.judged-wrong')) return;

            // Remove selected from siblings
            const siblings = element.parentElement.children;
            for (let i = 0; i < siblings.length; i++) {
                siblings[i].classList.remove('selected');
            }
            
            // Remove existing inline confirm button if any
            const existingBtn = document.getElementById('inlineConfirmBtn');
            if (existingBtn) existingBtn.remove();

            // Add to clicked
            element.classList.add('selected');
            
            // Create and append inline confirm button
            const btn = document.createElement('button');
            btn.id = 'inlineConfirmBtn';
            btn.className = 'inline-confirm-btn';
            btn.textContent = '確認';
            btn.onclick = (e) => {
                e.stopPropagation();
                checkAnswer();
            };
            element.appendChild(btn);
        }

        function checkAnswer() {
            const container = document.getElementById('appContainer');
            const selected = container.querySelector('.options-list li.selected');
            if (!selected) return;

            const currentMode = new URLSearchParams(window.location.search).get('mode');
            const isChallengeMode = currentMode === 'challenge' && window.__LISTENING_RANDOM_EXAM__ === true;
            const index = parseInt(selected.getAttribute('data-index'));
            const question = examData[currentExamKey].questions[currentQuestionIndex];
            const options = container.querySelectorAll('.options-list li');

            const isCorrect = question.options[index].correct;
            if (listeningRewardHooks) listeningRewardHooks.handleAnswer(isCorrect);

            if (isChallengeMode) {
                if (!isCorrect) {
                    const marks = getMarks();
                    if (!marks.includes(question.id)) {
                        marks.push(question.id);
                        saveMarks(marks);
                        updateMarkUI();
                    }
                }

                const confirmBtn = document.getElementById('inlineConfirmBtn');
                if (confirmBtn) confirmBtn.remove();

                container.dataset.sqChallengeAnswered = '1';
                container.classList.remove('judged');
                options.forEach((opt) => {
                    opt.style.pointerEvents = 'none';
                });
                return;
            }

            container.classList.add('judged');

            if (isCorrect) {
                selected.classList.add('judged-correct');
            } else {
                selected.classList.add('judged-wrong');
                question.options.forEach((opt, i) => {
                    if (opt.correct) options[i].classList.add('judged-correct');
                });

                const marks = getMarks();
                if (!marks.includes(question.id)) {
                    marks.push(question.id);
                    saveMarks(marks);
                    updateMarkUI();
                }
            }

            const confirmBtn = document.getElementById('inlineConfirmBtn');
            if (confirmBtn) confirmBtn.remove();

            setTimeout(() => {
                setMode('explanation', false);
            }, 1000);
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                setMode(preferredMode, false); // Restore preferred mode
                renderQuestion();
            }
        }

        function nextQuestion() {
            const questions = examData[currentExamKey].questions;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                setMode(preferredMode, false); // Restore preferred mode
                renderQuestion();
            }
        }

        function renderQuestion() {
            const container = document.getElementById('appContainer');
            if (container) container.classList.remove('judged');

            // Safety check for empty data
            if (!examData[currentExamKey] || !examData[currentExamKey].questions || examData[currentExamKey].questions.length === 0) {
                const dialogueBlock = document.getElementById('dialogueBlock');
                if (dialogueBlock) {
                    dialogueBlock.innerHTML = '<div class="dialogue-text" style="color:#888; text-align:center;">（この年度の問題はまだ登録されていません）</div>';
                }
                const optionsList = document.getElementById('optionsList');
                if (optionsList) optionsList.innerHTML = '';
                
                document.getElementById('markBtn').disabled = true;
                window.updateListeningPlayer({
                    title: '問題 -',
                    audioSrc: '',
                    hasPrev: false,
                    hasNext: false
                });
                
                return;
            }

            document.getElementById('markBtn').disabled = false;

            const data = examData[currentExamKey].questions[currentQuestionIndex];
            const total = examData[currentExamKey].questions.length;

            // Update Mark UI
            updateMarkUI();

            // Update Select Box
            const select = document.getElementById('questionSelect');
            if (select) {
                select.value = currentQuestionIndex;
            }
            window.updateListeningPlayer({
                title: `問題 ${data.id}`,
                audioSrc: data.audio,
                hasPrev: currentQuestionIndex > 0,
                hasNext: currentQuestionIndex < total - 1
            });

            // Update Image
            const img = document.getElementById('sceneImage');
            if (data.image) {
                img.src = data.image;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }

            // Update Dialogue
            const dialogueBlock = document.getElementById('dialogueBlock');
            dialogueBlock.innerHTML = `
                <div class="dialogue-text">${data.dialogueHtml}</div>
                <div class="translation">${data.translation}</div>
            `;

            // Update Options
            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';
            data.options.forEach((opt, idx) => {
                const li = document.createElement('li');
                if (opt.correct) li.classList.add('correct-answer');
                li.setAttribute('data-index', idx);
                
                // Add click handler for selection (Practice Mode)
                li.onclick = () => selectOption(li);

                li.innerHTML = `
                    <span class="options-num">${idx + 1}</span>
                    <div class="option-content">
                        <span class="placeholder-text">選択肢</span>
                        <div class="option-text">${opt.text}</div>
                        <div class="translation">${opt.translation}</div>
                    </div>
                `;
                optionsList.appendChild(li);
            });

            if (listeningRewardHooks) listeningRewardHooks.onQuestionRendered();
        }

        function setMode(mode, updatePreference = true) {
            if (updatePreference) {
                preferredMode = mode;
            }

            const container = document.getElementById('appContainer');
            const btnPractice = document.getElementById('btnPractice');
            const btnExplanation = document.getElementById('btnExplanation');
            const tooltip = document.getElementById('wordTooltip');

            // Remove inline confirm button if exists (fix bug where button persists when switching to explanation)
            const confirmBtn = document.getElementById('inlineConfirmBtn');
            if (confirmBtn) confirmBtn.remove();

            tooltip.style.display = 'none';

            if (mode === 'practice') {
                container.classList.remove('mode-explanation');
                container.classList.add('mode-practice');
                btnPractice.classList.add('active');
                btnExplanation.classList.remove('active');
            } else {
                container.classList.remove('mode-practice');
                container.classList.add('mode-explanation');
                btnExplanation.classList.add('active');
                btnPractice.classList.remove('active');

                 // Auto-scroll to show image and explanation
                setTimeout(() => {
                    const contentWrapper = document.querySelector('.content-wrapper');
                    if (contentWrapper) {
                        // Calculate offset to account for sticky header (approx 80px)
                        const headerOffset = 100;
                        const elementPosition = contentWrapper.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                    
                        window.scrollTo({
                            top: offsetPosition,
                            behavior: "smooth"
                        });
                    }
                }, 100);
        }
        }

        function showTooltip(event, text) {
            event.stopPropagation();
            
            const tooltip = document.getElementById('wordTooltip');
            tooltip.innerText = text;
            tooltip.style.display = 'block';
            
            const targetRect = event.target.getBoundingClientRect();
            
            setTimeout(() => {
                const tooltipWidth = tooltip.offsetWidth;
                const tooltipHeight = tooltip.offsetHeight;
                
                const top = targetRect.top + window.scrollY - tooltipHeight - 10; 
                let left = targetRect.left + window.scrollX + (targetRect.width / 2) - (tooltipWidth / 2);
                
                // Prevent tooltip from going off-screen
                if (left < 10) left = 10;
                if (left + tooltipWidth > window.innerWidth - 10) {
                    left = window.innerWidth - tooltipWidth - 10;
                }

                // Adjust arrow position to point to the target
                const targetCenterX = targetRect.left + window.scrollX + (targetRect.width / 2);
                const arrowLeft = targetCenterX - left;
                tooltip.style.setProperty('--arrow-left', `${arrowLeft}px`);
                
                tooltip.style.top = `${top}px`;
                tooltip.style.left = `${left}px`;
            }, 0);
        }

        document.addEventListener('click', function() {
            const tooltip = document.getElementById('wordTooltip');
            if (tooltip.style.display === 'block') {
                tooltip.style.display = 'none';
            }
        });
        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);
    </script>

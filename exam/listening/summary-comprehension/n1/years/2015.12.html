<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>概要理解 - 聴解練習 (N1 STAGE)</title>
    <!-- 使用与练习页一致的书面/印刷感字体组合 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../shared/site-fonts.css">
    <link rel="stylesheet" href="../../../shared/listening-practice-redesign.css?v=20260811-tooltip-all">
</head>
<body>

    <header>
        <a href="../index.html" class="back-btn" id="backButton">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            戻る
        </a>
        <h1 id="yearLabel">概要理解 (N1)</h1>
        <div style="width: 60px;"></div>
    </header>

    <div class="practice-container mode-practice" id="appContainer">
        
        <div class="card-header">
            <div class="header-left">
                <select id="questionSelect" class="question-select" onchange="changeQuestion(this.value)"></select>
                <button type="button" id="markBtn" class="mark-btn" onclick="toggleMark()" title="付箋を貼る (标记/收藏)" aria-label="付箋を貼る">🐶</button>
            </div>
            <div class="mode-switch">
                <button id="btnPractice" class="active" onclick="setMode('practice')">✎ 演習ノート</button>
                <button id="btnExplanation" onclick="setMode('explanation')">✔ 赤ペン解説</button>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="right-panel" id="rightPanel">
                
                <!-- 听力原文与翻译区块 (练习模式下隐藏) -->
                <div class="transcript-section sketch-box" id="transcriptBlock">
                    <!-- 問題区块 -->
                    <div class="question-box">
                        <div id="questionText"></div>
                        <div class="translation" id="questionTrans"></div>
                    </div>

                    <!-- 对话区块 -->
                    <div class="conversation-box" id="conversationText">
                        <!-- 由JS填充对话内容 -->
                    </div>
                </div>

                <div class="question-image-area" id="questionImageArea" aria-live="polite">
                    <img id="questionImage" alt="">
                </div>

                <!-- 选项列表 (练习模式下部分隐藏，模拟盲听) -->
                <ul class="options-list" id="optionsList"></ul>
            </div>
        </div>
    </div>

    <!-- 底部音频播放器 -->
    <div class="audio-wrapper">
        <div class="custom-audio-player">
            <div class="now-playing-box">
                <div class="track-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <div class="now-playing-content">
                    <div class="track-header-row">
                        <div class="track-info">
                            <div class="track-title" id="trackTitle">問題 1</div>
                            <div class="track-subtitle" id="trackSubtitle" style="display:none;"></div>
                        </div>
                        <div class="time-group">
                            <span class="time-display time-current" id="timeCurrent">0:00</span>
                            <span class="time-display time-divider" style="margin: 0 4px;">/</span>
                            <span class="time-display time-duration desktop-time" id="timeDurationDesktop">0:00</span>
                            <span class="time-display time-duration mobile-time" id="timeDurationMobile" style="display: none;">-0:00</span>
                        </div>
                    </div>
                    <div class="progress-area">
                        <div class="progress-container" id="progressContainer">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 控制组 -->
            <div class="player-controls">
                <button id="prevBtn" class="ctrl-btn nav-btn" onclick="prevQuestion()" title="前へ">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h2v12H3zM13 6v12L5 12zM21 6v12L13 12z"/></svg>
                </button>
                <button id="rewindBtn" class="ctrl-btn skip-btn" title="6秒戻る">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><text x="12" y="16.5" font-size="8.5" font-weight="900" font-family="sans-serif" stroke-width="0" fill="currentColor" text-anchor="middle">6</text></svg>
                </button>
                <button class="ctrl-btn play-btn" id="playBtn">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="forwardBtn" class="ctrl-btn skip-btn" title="6秒進む">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><text x="12" y="16.5" font-size="8.5" font-weight="900" font-family="sans-serif" stroke-width="0" fill="currentColor" text-anchor="middle">6</text></svg>
                </button>
                <button id="nextBtn" class="ctrl-btn nav-btn" onclick="nextQuestion()" title="次へ">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6v12L11 12zM11 6v12L19 12zM19 6h2v12H19z"/></svg>
                </button>
                <button id="loopBtn" class="ctrl-btn loop-btn" title="ループ再生">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                </button>
                <button id="speedBtn" class="ctrl-btn speed-btn" title="再生速度">1.0x</button>
            </div>
            
            <audio id="audioElement" preload="metadata"></audio>
        </div>
    </div>

    <div id="wordTooltip" class="custom-tooltip"></div>

    <script src="../../../shared/audio-player-theme.js?v=20260811-integrated-options"></script>
    <script src="../../../shared/listening-progress.js"></script>
    <script src="../../../shared/listening-reward-hooks.js"></script>
<script>
        // --- Data Structure (针对概要理解 Summary Comprehension 的特制数据) ---
        const examData = {
            "N1-2015-12-概要理解": {
                label: "2015年12月 (N1)",
                questions: [
                    {
                        id: 1,
                        audio: "../assets/audio/2015.12-1.mp3",
                        script: {
                            question: "一番：ラジオで女の人が話しています。女の人は何について話していますか。",
                            questionTrans: "（第一题：在广播里女人正在讲话。女人在谈论什么？）",
                            dialogue: [
                                {
                                    speaker: "女",
                                    text: "最近、家やオフィスに<span class=\"keyword\" onclick=\"showTooltip(event, '防災（ぼうさい）：防灾。')\">防災</span>用ヘルメットを置くところが増えていますが、<span class=\"highlight-wrong\"><span class=\"opt-tag tag-wrong\">①</span><span class=\"explain-wrong\" onclick=\"showTooltip(event, '关于选项1，女人一开始提到“大家是不是很苦恼放在哪里”，这只是为了引出折叠头盔这个商品，并没有去探讨“合适的保管场所”在哪里，排除。')\"><span class=\"keyword\" onclick=\"showTooltip(event, '保管（ほかん）：保管，存放。')\">保管</span>場所に困っている人も多いのではないでしょうか。</span></span>",
                                    trans: "（最近，在家里或办公室放置防灾头盔的地方变多了，但是不是也有很多人在苦恼该存放在哪呢？）"

                                {
                                    speaker: "女",
                                    text: "そんな中、人気を集めている商品があります。<span class=\"highlight-correct\"><span class=\"opt-tag tag-correct\">④</span><span class=\"explain-correct\" onclick=\"showTooltip(event, '女人明确点出核心话题：某防灾用品厂家开发的【折叠式头盔（折りたたみ式のヘルメットです）】。后续内容全都是在介绍它的特点（材质、强度、轻便、易组装等），符合选项4。')\">ある防災用品メーカーが開発した<span class=\"keyword\" onclick=\"showTooltip(event, '折（お）りたたむ：折叠。')\">折りたたみ</span>式のヘルメットです。</span></span>",
                                    trans: "（在这种情况下，有一款商品正聚集着人气。是某防灾用品厂家开发的折叠式头盔。）"
                                },
                                {
                                    speaker: "女",
                                    text: "<span class=\"highlight-wrong\"><span class=\"opt-tag tag-wrong\">②</span><span class=\"explain-wrong\" onclick=\"showTooltip(event, '关于选项2，文中虽然提到了【使用了独自开发的树脂材料（独自に開発した樹脂素材が使われていて）】，但并未提及开发过程中的“艰辛或劳苦”，排除。')\"><span class=\"keyword\" onclick=\"showTooltip(event, '独自（どくじ）：独自，独特。')\">独自</span>に開発した<span class=\"keyword\" onclick=\"showTooltip(event, '樹脂（じゅし）：树脂。')\">樹脂</span><span class=\"keyword\" onclick=\"showTooltip(event, '素材（そざい）：材料，素材。')\">素材</span>が使われていて</span></span>、<span class=\"keyword\" onclick=\"showTooltip(event, '強度（きょうど）：强度。')\">強度</span>はそのままで、折り畳みが可能となっています。軽くて組み立ても簡単です。",
                                    trans: "（它使用了独自开发的树脂材料，强度保持不变，却能够折叠。既轻便，组装也很简单。）"

                                {
                                    speaker: "女",
                                    text: "<span class=\"highlight-wrong\"><span class=\"opt-tag tag-wrong\">③</span><span class=\"explain-wrong\" onclick=\"showTooltip(event, '关于选项3，文中最后提到去年卖了1万多个，是为了证明其高人气，并没有探讨“销售方法”，排除。')\">昨年は1万個以上も売れたそうです。</span></span>",

                        options: [
                            { text: "防災用品の適切な保管場所", translation: "（防灾用品合适的保管场所）", correct: false },
                            { text: "新しい防災用品の開発の苦労", translation: "（开发新防灾用品的艰辛）", correct: false },
                            { text: "新しいヘルメットの販売方法", translation: "（新头盔的销售方法）", correct: false },
                            { text: "ある防災用ヘルメットの特徴", translation: "（某防灾用头盔的特点）", correct: true }
                        ]
                    },
                    {
                        id: 2,
                        audio: "../assets/audio/2015.12-2.mp3",
                        script: {
                            question: "二番：テレビでアナウンサーが話しています。アナウンサーは何について話していますか。",
                            questionTrans: "（第二题：在电视上播音员正在讲话。播音员在谈论什么？）",
                            dialogue: [
                                { speaker: "男", text: "<span class=\"highlight-correct\"><span class=\"opt-tag tag-correct\">①</span><span class=\"explain-correct\" onclick=\"showTooltip(event, '男播音员在开头提出【去海外留学的日本学生正在减少（海外に留学する日本人学生が減少しています）】的现象后，后续全文都在列举学费涨价、可能对求职不利、企业不重视海外经验等具体的影响因素。这说明整段报道都在探讨留学生减少的真正原因，符合选项1。')\">この十年、海外に留学する日本人学生が減少しています。</span></span>若者が海外との交流に<span class=\"keyword\" onclick=\"showTooltip(event, '消極的（しょうきょくてき）：消极的。')\">消極的</span>になっているからだという声も聞かれます。", trans: "（这十年间，去海外留学的日本学生正在减少。也有人说这是因为年轻人对与海外交流变得消极了。）" },

                                { speaker: "男", text: "<span class=\"highlight-wrong\"><span class=\"opt-tag tag-wrong\">④</span><span class=\"explain-wrong\" onclick=\"showTooltip(event, '关于选项4，报道中提到的“求职活动”和“录用”是指在日本国内找工作时留学经历是否有利，并非探讨“在海外就业”的困难与否，可以排除。')\">また、<span class=\"keyword\" onclick=\"showTooltip(event, '採用（さいよう）：录用，采用。')\">採用</span>の際、海外経験の<span class=\"keyword\" onclick=\"showTooltip(event, '有無（うむ）：有无。')\">有無</span>を<span class=\"keyword\" onclick=\"showTooltip(event, '重視（じゅうし）：重视。')\">重視</span>しない企業が少なくないことなどもあるようです。</span></span>", trans: "（此外，在录用时，不重视有无海外经验的企业也不在少数，似乎也有这方面的原因。）" },
                                { speaker: "男", text: "<span class=\"highlight-wrong\"><span class=\"opt-tag tag-wrong\">②③</span><span class=\"explain-wrong\" onclick=\"showTooltip(event, '关于选项2，播音员探讨的是日本学生去“海外留学”，而不是“来日本的留学生”，可以直接排除。关于选项3，报道中只分析了年轻人不去留学的现实原因（实情），并未探讨“如何让”年轻人产生兴趣的具体方法，因此排除。')\">となれば、<span class=\"keyword\" onclick=\"showTooltip(event, '一概（いちがい）に：一概，无例外地（常接否定）。')\">一概に</span>若者が消極的になったせいだとも言えません。こうした<span class=\"keyword\" onclick=\"showTooltip(event, '実情（じつじょう）：实情，实际情况。')\">実情</span>もあるのです。</span></span>", trans: "（这么说来，也不能一概而论说是年轻人变得消极导致的。也是有这些实际情况的。）" }
                            ]
                        },
                        options: [
                            { text: "留学する日本人学生が減っている原因", translation: "（去海外留学的日本学生减少的原因）", correct: true },
                            { text: "日本への留学生を増やす計画", translation: "（增加来日本的留学生的计划）", correct: false },
                            { text: "若者に留学に興味を持たせる方法", translation: "（让年轻人对留学产生兴趣的方法）", correct: false },
                            { text: "海外で就職することの難しさ", translation: "（在海外就业的困难程度）", correct: false }

                    {

                        audio: "../assets/audio/2015.12-3.mp3",
                        script: {
                            question: "三番：ラジオでアナウンサーが話しています。アナウンサーは何について話していますか。",
                            questionTrans: "（第三题：在广播里播音员正在讲话。播音员在谈论什么？）",

                                { speaker: "男", text: "夏は海や山といった<span class=\"keyword\" onclick=\"showTooltip(event, '行楽地（こうらくち）：游览胜地。')\">行楽地</span>にお出かけになる機会も多いと思いますが、雷に注意することが必要な季節です。", trans: "（夏天去海边或山里等游览胜地游玩的机会变多了，但这也是一个需要注意雷电的季节。）" },
                                { speaker: "男", text: "ごろごろといった音が聞こえたら、<span class=\"keyword\" onclick=\"showTooltip(event, 'いかに：无论多么。')\">いかに</span>小さい音であれ、まだ大丈夫だと<span class=\"keyword\" onclick=\"showTooltip(event, '過信（かしん）：过分相信，盲目自信。')\">過信</span>せず、すぐに<span class=\"keyword\" onclick=\"showTooltip(event, '避難（ひなん）：避难，躲避。')\">避難</span>する必要があります。", trans: "（一旦听到轰隆轰隆的声音，不管声音多小，都不要盲目自信觉得“还不要紧”，必须马上避难。）" },

                                { speaker: "男", text: "<span class=\"highlight-wrong\"><span class=\"opt-tag tag-wrong\">①②③</span><span class=\"explain-wrong\" onclick=\"showTooltip(event, '关于前三个选项，文中提到海边和山里只是作为游玩地的举例，并没有探讨哪些地区更容易发生雷电（排除1）；也没有提及雷电造成的具体人员或财产伤亡（排除2）；更没有从科学角度解释雷电是如何形成的（排除3）。')\">もし、海や山などにいて、適切な避難場所がない場合には、高い木などのそばから離れて低い<span class=\"keyword\" onclick=\"showTooltip(event, '姿勢（しせい）：姿势。')\">姿勢</span>を取ることが大切です。</span></span>", trans: "（如果身在海边或山里等，没有合适的避难场所时，离开高大的树木等旁边、采取低姿势是非常重要的。）" }

                                { speaker: "女", text: "<span class=\"highlight-correct\"><span class=\"opt-tag tag-correct\">③</span><span class=\"explain-correct\" onclick=\"showTooltip(event, '老师先抛出大家习以为常的谦让行为，接着用【在任何社会都能这么说吗？】进行转折，引出了关于不同社会规则的探讨。后续列举少数民族的例子正是为了论证【对话的方式因社会而异（会話の仕方は社会によって異なるものだ）】，符合选项3。')\">とある少数民族はこのようなとき、話を止めず、お互いに<span class=\"keyword\" onclick=\"showTooltip(event, '延々（えんえん）：没完没了，绵延不绝。')\">延々と</span>しゃべり続けるといいます。</span></span>", trans: "（据说某个少数民族在遇到这种情况时，不会停下来，而是互相没完没了地继续说下去。）" },

                                { speaker: "男", text: "<span class=\"highlight-wrong\"><span class=\"opt-tag tag-wrong\">①③④</span><span class=\"explain-wrong\" onclick=\"showTooltip(event, '关于选项1，文中提到缺乏接班人只是背景，并没有提出解决这个问题的方法。关于选项3，文中提到的是野生野猪破坏农作物，而不是“家畜”。关于选项4，文中提到害怕山羊（不是野猪）破坏无人岛的生态系统，而且野猪只是因为没有草丛藏身而不来了，排除了这三个选项。')\">桜町では、野生のいのししによる農作物の被害も増えていましたが、<span class=\"keyword\" onclick=\"showTooltip(event, '草（くさ）むら：草丛。')\">草むら</span>がなくなったことで、警戒心の強いいのししは身を隠す場所を失って、<span class=\"keyword\" onclick=\"showTooltip(event, '寄（よ）り付（つ）く：靠近，挨近。')\">寄り付かなく</span>なったそうです。</span></span>", trans: "（在樱町，虽然野生野猪对农作物的破坏也在增加，但据说因为草丛没了，警惕性很强的野猪失去了藏身之处，也就不再靠近了。）" }
                            ]
                        },
                        options: [
                            { text: "農家の後継者不足を解消する方法", translation: "（消除农户缺乏接班人的方法）", correct: false },
                            { text: "農家の作業にヤギを活用している例", translation: "（在农活中活用山羊的例子）", correct: true },
                            { text: "家畜による農作物被害の増加", translation: "（家畜对农作物破坏的增加）", correct: false },
                            { text: "いのししによる生態系の破壊", translation: "（野猪对生态系统的破坏）", correct: false }

                    {
                        id: 6,
                        audio: "../assets/audio/2015.12-6.mp3",
                        script: {
                            question: "六番：ラジオで女の人が話しています。女の人は何について話していますか。",
                            questionTrans: "（第六题：在广播里女人正在讲话。女人在谈论什么？）",
                            dialogue: [
                                { speaker: "女", text: "日本では、雪が多いいくつかの地域で、春先のよく晴れた日に、長く<span class=\"keyword\" onclick=\"showTooltip(event, '愛用（あいよう）：爱用，喜欢用。')\">愛用</span>した着物の<span class=\"keyword\" onclick=\"showTooltip(event, '生地（きじ）：布料，质地。')\">生地</span>を雪の上に<span class=\"keyword\" onclick=\"showTooltip(event, 'さらす（曝す）：暴露，风吹日晒。')\">さらす</span>ということが百年ほど前まで行われていました。", trans: "（在日本降雪较多的一些地区，直到一百年前左右，还保留着在初春晴朗的日子里，将长期爱穿的和服布料铺放在雪地上的做法。）" },
                                { speaker: "女", text: "太陽の熱で溶け出した雪が<span class=\"keyword\" onclick=\"showTooltip(event, '水蒸気（すいじょうき）：水蒸气。')\">水蒸気</span>になり、それが太陽の日差しに当ることにより化学反応が起こって、汗の染みなどが消え、染められた布の色が<span class=\"keyword\" onclick=\"showTooltip(event, '蘇（よみがえ）る：复苏，复活，恢复。')\">蘇る</span>んだそうです。", trans: "（据说，因太阳热量而融化的雪会变成水蒸气，水蒸气在阳光的照射下发生化学反应，从而消除汗渍等，让染过色的布料颜色焕然一新。）" },
                                { speaker: "女", text: "<span class=\"highlight-correct\"><span class=\"opt-tag tag-correct\">①</span><span class=\"explain-correct\" onclick=\"showTooltip(event, '女人在这里点出了这种做法的本质：【在过去还没有洗涤剂的时候，人们绞尽脑汁寻找把和服弄干净的方法，最终利用自然环境创造出了这一做法（昔、洗剤などがまだない頃、着物を綺麗にするすべがないかと工夫を重ねた人々が、自然環境を活かして生み出したものです）】。整段话介绍的正是一种去除和服污渍的传统方法，符合选项1。')\">昔、洗剤などがまだない頃、着物を綺麗にする<span class=\"keyword\" onclick=\"showTooltip(event, 'すべ（術）：方法，手段。')\">すべ</span>がないかと<span class=\"keyword\" onclick=\"showTooltip(event, '工夫（くふう）：想办法，动脑筋。')\">工夫</span>を重ねた人々が、自然環境を活かして生み出したものです。</span></span>", trans: "（在过去还没有洗涤剂的时候，人们绞尽脑汁寻找把和服弄干净的方法，最终利用自然环境创造出了这一做法。）" },
                                { speaker: "女", text: "<span class=\"highlight-wrong\"><span class=\"opt-tag tag-wrong\">②③④</span><span class=\"explain-wrong\" onclick=\"showTooltip(event, '关于前三个错误选项：文中讲的是把和服放在雪上洗，而不是“防止下雪天弄脏和服（排除2）”；提到颜色焕然一新，但并没有探讨“图案之美（排除3）”；讲的是清洗方法，而不是“保存的困难（排除4）”。')\">着物を着ることが少なくなった現在でも、一部の人によって行われているそうです。</span></span>", trans: "（即使在很少穿和服的现在，据说也有一部分人还在这么做。）" },
                                { speaker: "女", text: "着物を着るという習慣の中で<span class=\"keyword\" onclick=\"showTooltip(event, '培（つちか）う：培养，培育。')\">培われて</span>きた知恵を感じることができます。", trans: "（从中可以感受到在穿和服的习惯中所培养出来的智慧。）" }
                            ]
                        },
                        options: [
                            { text: "着物の染みを取る伝統的な方法", translation: "（去除和服污渍的传统方法）", correct: true },
                            { text: "雪の日に着物が汚れないための工夫", translation: "（为了下雪天不弄脏和服的办法）", correct: false },
                            { text: "伝統的な着物の柄の美しさ", translation: "（传统的和服图案之美）", correct: false },
                            { text: "着物を綺麗に保存することの難しさ", translation: "（把和服漂亮地保存起来的困难程度）", correct: false }
                        ]
                    }
                ]
            }
        };

        let currentExamKey = "N1-2015-12-概要理解"; 
        let currentQuestionIndex = 0;
        let preferredMode = 'practice'; 
        const LISTENING_TYPE = 'summary-comprehension';
        const LISTENING_LEVEL = 'n1';
        const listeningRewardHooks = window.StudyQuestListeningRewards && window.StudyQuestListeningRewards.create({
            type: LISTENING_TYPE,
            level: LISTENING_LEVEL,
            getExamKey: () => currentExamKey,
            getCurrentQuestionIndex: () => currentQuestionIndex,
            getQuestions: () => (examData[currentExamKey] && examData[currentExamKey].questions) || [],
            buildIndexUrl: () => '../index.html',
            buildRetryUrl: (examKey) => {
                const params = new URLSearchParams();
                if (examKey) params.set('year', examKey);
                return params.toString() ? `${window.location.pathname}?${params.toString()}` : window.location.pathname;
            }
        });

        // --- Initialization ---
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const yearParam = urlParams.get('year');
            const modeParam = urlParams.get('mode');
            
            const targetKey = yearParam ? `N1-${yearParam}-概要理解` : currentExamKey;

            if (examData[targetKey]) {
                currentExamKey = targetKey;
                window.ListeningProgress && window.ListeningProgress.setLastPractice(LISTENING_TYPE, LISTENING_LEVEL, currentExamKey);

                if (modeParam === 'review') {
                    const marks = getMarks();
                    if (marks.length === 0) {
                        alert('付箋を貼った問題はありません。(No marked questions)');
                    } else {
                        const originalQuestions = examData[currentExamKey].questions;
                        const filtered = originalQuestions.filter(q => marks.includes(q.id));
                        if (filtered.length > 0) {
                            examData[currentExamKey].questions = filtered;
                            setTimeout(() => {
                                const lbl = document.getElementById('yearLabel');
                                if(lbl) lbl.innerHTML += ' <span style="background:var(--marker-yellow); color:var(--graphite); font-size:12px; margin-left:8px; padding:2px 8px; border-radius:2px 8px 2px 6px / 6px 2px 8px 2px; border:1.5px solid var(--graphite);">✔ 復習ノート</span>';
                            }, 100);
                        } else {
                            alert('付箋を貼った問題が見つかりませんでした。');
                        }
                    }
                }
            } else if (!examData[currentExamKey]) {
                currentExamKey = Object.keys(examData)[0];
            }

            const yearLabel = document.getElementById('yearLabel');
            if (yearLabel && modeParam !== 'review') {
                yearLabel.textContent = examData[currentExamKey].label + " 概要理解";
            }

            updateQuestionSelect();
            if(window.setupListeningPlayer) {
                window.setupListeningPlayer({
                    subtitle: document.title.replace(/\s*\(N1\)\s*$/, ''),
                    skipSeconds: 10
                });
            }
            if (listeningRewardHooks) listeningRewardHooks.startRun();
            renderQuestion();
        }

        // --- Mark Logic ---
        function getMarks() {
            return window.ListeningProgress ? window.ListeningProgress.getMistakeIds(LISTENING_TYPE, LISTENING_LEVEL, currentExamKey) : [];
        }

        function saveMarks(marks) {
            if(window.ListeningProgress) window.ListeningProgress.setMistakeIds(LISTENING_TYPE, LISTENING_LEVEL, currentExamKey, marks);
        }

        function toggleMark() {
            if (!examData[currentExamKey] || !examData[currentExamKey].questions[currentQuestionIndex]) return;

            const marks = getMarks();
            const qId = examData[currentExamKey].questions[currentQuestionIndex].id;
            const index = marks.indexOf(qId);

            if (index === -1) {
                marks.push(qId);
                saveMarks(marks);
                updateMarkUI();
                return;
            }

            marks.splice(index, 1);
            saveMarks(marks);

            updateMarkUI();
        }

        function updateMarkUI() {
            if (!examData[currentExamKey] || !examData[currentExamKey].questions[currentQuestionIndex]) return;
            const marks = getMarks();
            const qId = examData[currentExamKey].questions[currentQuestionIndex].id;
            const btn = document.getElementById('markBtn');
            if (marks.includes(qId)) btn.classList.add('active');
            else btn.classList.remove('active');
        }

        function updateQuestionSelect() {
            const select = document.getElementById('questionSelect');
            select.innerHTML = '';
            
            const questions = examData[currentExamKey].questions;
            questions.forEach((q, index) => {
                const option = document.createElement('option');
                option.value = index; 
                option.textContent = `問題 ${q.id}`;
                select.appendChild(option);
            });
        }

        function changeQuestion(index) {
            currentQuestionIndex = parseInt(index);
            renderQuestion();
        }

        // --- Answer Selection ---
        function selectOption(element) {
            const container = document.getElementById('appContainer');
            if (!container.classList.contains('mode-practice')) return;
            if (element.parentElement.querySelector('.judged-correct') || element.parentElement.querySelector('.judged-wrong')) return;

            const siblings = element.parentElement.children;
            for (let i = 0; i < siblings.length; i++) {
                siblings[i].classList.remove('selected');
                const btn = siblings[i].querySelector('.inline-confirm-btn');
                if (btn) btn.remove();
            }

            element.classList.add('selected');
            
            const btn = document.createElement('button');
            btn.id = 'inlineConfirmBtn';
            btn.className = 'inline-confirm-btn';
            btn.textContent = '確認';
            btn.onclick = (e) => {
                e.stopPropagation();
                checkAnswer();
            };
            element.appendChild(btn);
        }

        function checkAnswer() {
            const container = document.getElementById('appContainer');
            const selected = container.querySelector('.options-list li.selected');
            if (!selected) return;

            const currentMode = new URLSearchParams(window.location.search).get('mode');
            const isChallengeMode = currentMode === 'challenge' && window.__LISTENING_RANDOM_EXAM__ === true;
            const index = parseInt(selected.getAttribute('data-index'));
            const question = examData[currentExamKey].questions[currentQuestionIndex];
            const options = container.querySelectorAll('.options-list li');

            const isCorrect = question.options[index].correct;
            if (listeningRewardHooks) listeningRewardHooks.handleAnswer(isCorrect);

            if (isChallengeMode) {
                if (!isCorrect) {
                    const marks = getMarks();
                    if (!marks.includes(question.id)) {
                        marks.push(question.id);
                        saveMarks(marks);
                        updateMarkUI();
                    }
                }

                const confirmBtn = document.getElementById('inlineConfirmBtn');
                if (confirmBtn) confirmBtn.remove();

                container.dataset.sqChallengeAnswered = '1';
                container.classList.remove('judged');
                options.forEach((opt) => {
                    opt.style.pointerEvents = 'none';
                });
                return;
            }

            container.classList.add('judged');

            if (isCorrect) {
                selected.classList.add('judged-correct');
            } else {
                selected.classList.add('judged-wrong');
                question.options.forEach((opt, i) => {
                    if (opt.correct) options[i].classList.add('judged-correct');
                });

                const marks = getMarks();
                if (!marks.includes(question.id)) {
                    marks.push(question.id);
                    saveMarks(marks);
                    updateMarkUI();
                }
            }

            const confirmBtn = document.getElementById('inlineConfirmBtn');
            if (confirmBtn) confirmBtn.remove();

            setTimeout(() => {
                setMode('explanation', false);
            }, 1000);
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                setMode(preferredMode, false);
                renderQuestion();
            }
        }

        function nextQuestion() {
            const questions = examData[currentExamKey].questions;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                setMode(preferredMode, false);
                renderQuestion();
            }
        }

        // --- Render Content ---
        function renderQuestion() {
            const container = document.getElementById('appContainer');
            if (container) container.classList.remove('judged');

            const data = examData[currentExamKey].questions[currentQuestionIndex];
            const total = examData[currentExamKey].questions.length;

            updateMarkUI();
            document.getElementById('questionSelect').value = currentQuestionIndex;
            if(window.updateListeningPlayer) {
                window.updateListeningPlayer({
                    title: `問題 ${data.id}`,
                    audioSrc: data.audio,
                    hasPrev: currentQuestionIndex > 0,
                    hasNext: currentQuestionIndex < total - 1
                });
            }

            // Transcript Update
            document.getElementById('questionText').innerHTML = data.script.question;
            document.getElementById('questionTrans').innerHTML = data.script.questionTrans;
            const questionImageArea = document.getElementById('questionImageArea');
            const questionImage = document.getElementById('questionImage');
            if (questionImageArea && questionImage) {
                if (data.image) {
                    questionImage.src = data.image;
                    questionImage.alt = `${examData[currentExamKey].label} 問題 ${data.id} 题图`;
                    questionImageArea.style.display = 'block';
                } else {
                    questionImage.removeAttribute('src');
                    questionImage.alt = '';
                    questionImageArea.style.display = 'none';
                }
            }
            const conversationHtml = data.script.dialogue.map(line => `
                <div class="conversation-line">
                    <span class="speaker-name">${line.speaker}</span>
                    <div class="speaker-text">
                        <div>${line.text}</div>
                        <div class="translation">${line.trans}</div>
                    </div>
                </div>
            `).join('');
            document.getElementById('conversationText').innerHTML = conversationHtml;

            // Options Update
            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';
            data.options.forEach((opt, idx) => {
                const li = document.createElement('li');
                if (opt.correct) li.classList.add('correct-answer');
                li.setAttribute('data-index', idx);
                li.onclick = () => selectOption(li);

                li.innerHTML = `
                    <span class="options-num">${idx + 1}</span>
                    <div class="option-content">
                        
                        <div class="option-text">${opt.text}</div>
                        <div class="translation">${opt.translation}</div>
                    </div>
                `;
                optionsList.appendChild(li);
            });

            if (listeningRewardHooks) listeningRewardHooks.onQuestionRendered();
        }

        // --- Mode Switching ---
        function setMode(mode, updatePreference = true) {
            if (updatePreference) preferredMode = mode;

            const container = document.getElementById('appContainer');
            const btnPractice = document.getElementById('btnPractice');
            const btnExplanation = document.getElementById('btnExplanation');
            const tooltip = document.getElementById('wordTooltip');

            const confirmBtn = document.getElementById('inlineConfirmBtn');
            if (confirmBtn) confirmBtn.remove();
            tooltip.style.display = 'none';

            if (mode === 'practice') {
                container.classList.remove('mode-explanation');
                container.classList.add('mode-practice');
                btnPractice.classList.add('active');
                btnExplanation.classList.remove('active');
            } else {
                container.classList.remove('mode-practice');
                container.classList.add('mode-explanation');
                btnExplanation.classList.add('active');
                btnPractice.classList.remove('active');

                // 滚动至顶部以查看听力原文
                setTimeout(() => {
                    const transcriptSection = document.getElementById('transcriptBlock');
                    const anchorTarget = transcriptSection || document.querySelector('.content-wrapper');
                    if (anchorTarget) {
                        const headerOffset = window.innerWidth <= 768 ? 112 : 132;
                        const elementPosition = anchorTarget.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                        window.scrollTo({ top: offsetPosition, behavior: "smooth" });
                    }
                }, 100);
            }
        }

        // --- Tooltip Logic ---
        function showTooltip(event, text) {
            event.stopPropagation();
            const tooltip = document.getElementById('wordTooltip');
            tooltip.innerText = text;
            tooltip.style.display = 'block';
            
            const targetRect = event.target.getBoundingClientRect();
            setTimeout(() => {
                const width = tooltip.offsetWidth, height = tooltip.offsetHeight;
                const top = targetRect.top + window.scrollY - height - 10; 
                let left = targetRect.left + window.scrollX + (targetRect.width / 2) - (width / 2);
                if (left < 10) left = 10;
                if (left + width > window.innerWidth - 10) left = window.innerWidth - width - 10;
                
                const targetCenterX = targetRect.left + window.scrollX + (targetRect.width / 2);
                tooltip.style.setProperty('--arrow-left', `${targetCenterX - left}px`);
                tooltip.style.top = `${top}px`; tooltip.style.left = `${left}px`;
            }, 0);
        }

        document.addEventListener('click', () => {
            const tooltip = document.getElementById('wordTooltip');
            if (tooltip.style.display === 'block') tooltip.style.display = 'none';
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>

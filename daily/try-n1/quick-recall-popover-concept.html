<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Try! N1 快速回忆气泡设计稿</title>
  <style>
    :root {
      --paper: #f8f7f4;
      --sheet: #ffffff;
      --ink: #302f32;
      --muted: #767279;
      --line: #ddd8de;
      --grammar: #963b4c;
      --grammar-soft: rgba(150, 59, 76, 0.12);
      --tooltip: rgba(40, 39, 36, 0.97);
      --tooltip-text: #fffdf7;
      --tooltip-muted: #c9c5bc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Serif JP", "Noto Serif SC", "Yu Mincho", "Hiragino Mincho ProN", "Songti SC", serif;
    }

    .page {
      position: relative;
      width: min(1240px, calc(100vw - 88px));
      min-height: 720px;
      padding: 64px 88px 74px;
      border: 1px solid #dedbe0;
      border-top: 7px solid #66526f;
      background: var(--sheet);
      box-shadow: 0 18px 50px rgba(55, 48, 58, 0.08);
    }

    .page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 55px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      color: #66526f;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .page-heading strong {
      font-size: 15px;
      letter-spacing: 0.06em;
    }

    .page-heading span {
      color: #8b878e;
      font-size: 12px;
    }

    .article {
      font-size: 26px;
      font-weight: 620;
      line-height: 2.45;
      letter-spacing: 0;
    }

    .article p {
      margin: 0 0 28px;
    }

    ruby {
      ruby-position: over;
    }

    rt {
      color: #78737a;
      font-family: "Noto Sans JP", "Noto Sans SC", sans-serif;
      font-size: 0.43em;
      font-weight: 500;
    }

    .grammar-anchor {
      position: relative;
      display: inline;
      padding: 0 4px 2px;
      border-bottom: 2px solid rgba(150, 59, 76, 0.56);
      border-radius: 5px 5px 2px 2px;
      background: linear-gradient(transparent 54%, var(--grammar-soft) 0);
      color: var(--grammar);
    }

    .quick-popover {
      position: absolute;
      z-index: 5;
      top: 260px;
      left: 600px;
      width: 430px;
      padding: 18px 20px 20px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 10px;
      background: var(--tooltip);
      color: var(--tooltip-text);
      box-shadow: 0 22px 52px rgba(36, 33, 29, 0.28);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .quick-popover::before {
      content: "";
      position: absolute;
      bottom: 100%;
      left: 88%;
      border: 8px solid transparent;
      border-bottom-color: rgba(40, 39, 36, 0.97);
      transform: translateX(-50%);
    }

    .popover-type {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
      color: #e6a8b3;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .popover-type::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #bd586a;
    }

    .quick-popover h2 {
      margin: 0;
      color: var(--tooltip-text);
      font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.35;
    }

    .popover-divider {
      height: 1px;
      margin: 13px 0 12px;
      background: rgba(255, 255, 255, 0.12);
    }

    .popover-row {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 5px 0;
    }

    .popover-row dt,
    .popover-row dd {
      margin: 0;
    }

    .popover-row dt {
      padding-top: 1px;
      color: #e6a8b3;
      font-size: 13px;
      font-weight: 700;
    }

    .popover-row dd {
      color: var(--tooltip-text);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.68;
    }

    .popover-row + .popover-row dd {
      color: #e8e4dc;
    }

    .muted-line {
      color: #6f6b72;
    }

    @media (max-width: 800px) {
      .page {
        width: calc(100vw - 28px);
        min-height: 700px;
        padding: 42px 26px;
      }

      .article {
        font-size: 20px;
        line-height: 2.25;
      }

      .quick-popover {
        top: 230px;
        left: 18px;
        width: calc(100% - 36px);
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Try N1 语法快速回忆气泡设计预览">
    <header class="page-heading">
      <strong>Try! N1 ・ 課文</strong>
      <span>第二課　産業医を増やそう</span>
    </header>

    <article class="article" lang="ja">
      <p>
        <ruby>市<rt>し</rt></ruby><ruby>内<rt>ない</rt></ruby>の<ruby>事<rt>じ</rt></ruby><ruby>業<rt>ぎょう</rt></ruby><ruby>所<rt>しょ</rt></ruby>を<ruby>対<rt>たい</rt></ruby><ruby>象<rt>しょう</rt></ruby>に、メンタルヘルス対策についての<ruby>支<rt>し</rt></ruby><ruby>援<rt>えん</rt></ruby>を<ruby>始<rt>はじ</rt></ruby>める<span class="grammar-anchor">次第です</span>。
      </p>
      <p>
        この<ruby>取<rt>と</rt></ruby>り<ruby>組<rt>く</rt></ruby>みを<ruby>通<rt>とお</rt></ruby>して、より<ruby>多<rt>おお</rt></ruby>くの<ruby>人<rt>ひと</rt></ruby>が<ruby>安<rt>あん</rt></ruby><ruby>心<rt>しん</rt></ruby>して<ruby>働<rt>はたら</rt></ruby>ける<ruby>環<rt>かん</rt></ruby><ruby>境<rt>きょう</rt></ruby>を<ruby>整<rt>ととの</rt></ruby>えていきます。
      </p>
      <p class="muted-line">
        また、今回のご提案をさせていただく次第です。
      </p>
    </article>

    <aside class="quick-popover" role="tooltip" aria-label="次第ですの快速解释">
      <div class="popover-type">文法</div>
      <h2 lang="ja">～次第です</h2>
      <div class="popover-divider"></div>
      <dl class="popover-row">
        <dt>语义</dt>
        <dd>事情是这样的；这就是事情的经过或理由。</dd>
      </dl>
      <dl class="popover-row">
        <dt>语境</dt>
        <dd>正式商务或演讲中，用于简要说明经过、理由或意图。</dd>
      </dl>
    </aside>
  </main>
</body>
</html>
